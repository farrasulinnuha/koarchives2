/* ============================================================
   Token. Palet aksen (--a1..--a3) ditulis ulang saat berjalan
   oleh pengaturan pemilik, jadi semua warna diturunkan darinya.
   ============================================================ */

:root{
  --a1:#FF5A7E;
  --a2:#FF8A5B;
  --a3:#B14AED;

  --dasar:#F2F0F6;
  --dasar-2:#E9E6F0;
  --tinta:#191622;
  --tinta-2:#453D57;
  --redup:#6A6179;

  --kaca:255,255,255;
  --kaca-isi:.58;
  --kaca-tepi:rgba(255,255,255,.75);
  --kaca-kilau:rgba(255,255,255,.9);
  --kaca-bayang:0 1px 2px rgba(25,22,34,.04), 0 12px 32px -12px rgba(25,22,34,.16);
  --kaca-bayang-naik:0 2px 6px rgba(25,22,34,.06), 0 24px 60px -20px rgba(25,22,34,.28);

  --garis:rgba(25,22,34,.09);
  --garis-halus:rgba(25,22,34,.055);

  --baik:#12A46B;
  --baik-latar:rgba(18,164,107,.12);
  --buruk:#E23D5A;
  --buruk-latar:rgba(226,61,90,.12);
  --tunggu:#E08A00;
  --tunggu-latar:rgba(224,138,0,.13);

  --atas-aksen:#FFFFFF;

  --f-tampil:"Gabarito","Trebuchet MS",system-ui,sans-serif;
  --f-badan:"Jakarta",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;

  --r-s:12px;
  --r-m:18px;
  --r-l:26px;
  --r-xl:34px;
}

@media (prefers-color-scheme: dark){
  :root{
    --dasar:#0D0B12;
    --dasar-2:#15121C;
    --tinta:#F4F1FA;
    --tinta-2:#C9C1DA;
    --redup:#948AA8;
    --kaca:38,32,50;
    --kaca-isi:.55;
    --kaca-tepi:rgba(255,255,255,.13);
    --kaca-kilau:rgba(255,255,255,.16);
    --kaca-bayang:0 1px 2px rgba(0,0,0,.5), 0 14px 40px -14px rgba(0,0,0,.8);
    --kaca-bayang-naik:0 2px 8px rgba(0,0,0,.6), 0 30px 70px -22px rgba(0,0,0,.95);
    --garis:rgba(255,255,255,.1);
    --garis-halus:rgba(255,255,255,.06);
    --baik:#3DD68C;
    --baik-latar:rgba(61,214,140,.15);
    --buruk:#FF7A90;
    --buruk-latar:rgba(255,122,144,.15);
    --tunggu:#FFB443;
    --tunggu-latar:rgba(255,180,67,.15);
    --atas-aksen:#140F1C;
  }
}

:root[data-theme="dark"]{
  --dasar:#0D0B12;
  --dasar-2:#15121C;
  --tinta:#F4F1FA;
  --tinta-2:#C9C1DA;
  --redup:#948AA8;
  --kaca:38,32,50;
  --kaca-isi:.55;
  --kaca-tepi:rgba(255,255,255,.13);
  --kaca-kilau:rgba(255,255,255,.16);
  --kaca-bayang:0 1px 2px rgba(0,0,0,.5), 0 14px 40px -14px rgba(0,0,0,.8);
  --kaca-bayang-naik:0 2px 8px rgba(0,0,0,.6), 0 30px 70px -22px rgba(0,0,0,.95);
  --garis:rgba(255,255,255,.1);
  --garis-halus:rgba(255,255,255,.06);
  --baik:#3DD68C;
  --baik-latar:rgba(61,214,140,.15);
  --buruk:#FF7A90;
  --buruk-latar:rgba(255,122,144,.15);
  --tunggu:#FFB443;
  --tunggu-latar:rgba(255,180,67,.15);
  --atas-aksen:#140F1C;
}

:root[data-theme="light"]{
  --dasar:#F2F0F6;
  --dasar-2:#E9E6F0;
  --tinta:#191622;
  --tinta-2:#453D57;
  --redup:#6A6179;
  --kaca:255,255,255;
  --kaca-isi:.58;
  --kaca-tepi:rgba(255,255,255,.75);
  --kaca-kilau:rgba(255,255,255,.9);
  --kaca-bayang:0 1px 2px rgba(25,22,34,.04), 0 12px 32px -12px rgba(25,22,34,.16);
  --kaca-bayang-naik:0 2px 6px rgba(25,22,34,.06), 0 24px 60px -20px rgba(25,22,34,.28);
  --garis:rgba(25,22,34,.09);
  --garis-halus:rgba(25,22,34,.055);
  --baik:#12A46B;
  --baik-latar:rgba(18,164,107,.12);
  --buruk:#E23D5A;
  --buruk-latar:rgba(226,61,90,.12);
  --tunggu:#E08A00;
  --tunggu-latar:rgba(224,138,0,.13);
  --atas-aksen:#FFFFFF;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:var(--dasar);
  color:var(--tinta);
  font-family:var(--f-badan);
  font-size:15px;
  line-height:1.6;
  font-synthesis-weight:none;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--aksen-teks,var(--a3))}

:focus-visible{
  outline:2.5px solid var(--a1);
  outline-offset:3px;
  border-radius:6px;
}

/* ---------- latar milik masing-masing akun ---------- */

.latar{
  position:fixed;
  inset:0;
  z-index:-4;
  display:none;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}
.latar-tudung{
  position:fixed;
  inset:0;
  z-index:-3;
  display:none;
  background:var(--dasar);
  opacity:.45;
}
body.berlatar .latar,
body.berlatar .latar-tudung{display:block}
/* Aurora diredupkan supaya tidak bertabrakan dengan foto. */
body.berlatar .langit{opacity:.22}
body.berlatar .butir{opacity:.25}

/* ---------- langit aurora ---------- */

.langit{
  position:fixed;
  inset:-18vmax;
  z-index:-2;
  pointer-events:none;
  filter:blur(70px) saturate(150%);
  opacity:.75;
}
@media (prefers-color-scheme: dark){ .langit{opacity:.5} }
:root[data-theme="dark"] .langit{opacity:.5}
:root[data-theme="light"] .langit{opacity:.75}

.blob{
  position:absolute;
  border-radius:50%;
  mix-blend-mode:normal;
}
.blob.b1{
  width:52vmax;height:52vmax;
  left:-6vmax;top:-4vmax;
  background:radial-gradient(circle at 35% 35%, var(--a1), transparent 68%);
  animation:apung1 26s ease-in-out infinite alternate;
}
.blob.b2{
  width:46vmax;height:46vmax;
  right:-8vmax;top:6vmax;
  background:radial-gradient(circle at 60% 40%, var(--a3), transparent 68%);
  animation:apung2 32s ease-in-out infinite alternate;
}
.blob.b3{
  width:44vmax;height:44vmax;
  left:22vmax;bottom:-12vmax;
  background:radial-gradient(circle at 50% 50%, var(--a2), transparent 66%);
  animation:apung3 29s ease-in-out infinite alternate;
}

@keyframes apung1{ to{ transform:translate3d(9vmax,7vmax,0) scale(1.14) } }
@keyframes apung2{ to{ transform:translate3d(-11vmax,10vmax,0) scale(.88) } }
@keyframes apung3{ to{ transform:translate3d(6vmax,-9vmax,0) scale(1.1) } }

.butir{
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  opacity:.5;
  background-image:radial-gradient(rgba(120,110,140,.16) .5px, transparent .5px);
  background-size:3px 3px;
}

/* ---------- kaca ---------- */

.kaca{
  background:rgba(var(--kaca), var(--kaca-isi));
  -webkit-backdrop-filter:blur(26px) saturate(190%);
  backdrop-filter:blur(26px) saturate(190%);
  border:1px solid var(--kaca-tepi);
  box-shadow:var(--kaca-bayang), inset 0 1px 0 var(--kaca-kilau);
}

/* ---------- kerangka ---------- */

.app{
  display:grid;
  grid-template-columns:262px minmax(0,1fr);
  gap:20px;
  max-width:1360px;
  margin:0 auto;
  padding:18px 20px 40px;
  align-items:start;
}

.sisi{
  position:sticky;
  top:18px;
  border-radius:var(--r-l);
  padding:16px 14px;
  display:flex;
  flex-direction:column;
  gap:6px;
  max-height:calc(100vh - 36px);
  overflow-y:auto;
}

.merek{
  display:flex;
  align-items:center;
  gap:11px;
  padding:6px 8px 14px;
  background:none;
  border:0;
  cursor:pointer;
  text-align:left;
  width:100%;
}
.merek .lambang{
  width:38px;height:38px;
  flex:0 0 38px;
  border-radius:13px;
  background:linear-gradient(135deg,var(--a1),var(--a3));
  display:grid;
  place-items:center;
  color:var(--atas-aksen);
  font-family:var(--f-tampil);
  font-weight:800;
  font-size:17px;
  box-shadow:0 6px 18px -6px var(--a1);
}
.merek .tulisan{min-width:0;flex:1}
.merek b{
  display:block;
  font-family:var(--f-tampil);
  font-size:19px;
  font-weight:800;
  letter-spacing:-.02em;
  line-height:1.15;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.merek small{
  display:block;
  font-size:11.5px;
  color:var(--redup);
  font-weight:600;
  letter-spacing:.01em;
}

.nav-b{
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  padding:9px 11px;
  border:0;
  border-radius:var(--r-s);
  background:transparent;
  color:var(--tinta-2);
  cursor:pointer;
  font-size:14.5px;
  font-weight:600;
  text-align:left;
  transition:background .16s, color .16s, transform .16s;
}
.nav-b:hover{background:rgba(var(--kaca),.7);color:var(--tinta)}
.nav-b:active{transform:scale(.975)}
.nav-b svg{flex:0 0 20px;opacity:.85}
.nav-b[aria-current="true"]{
  background:linear-gradient(135deg,var(--a1),var(--a3));
  color:var(--atas-aksen);
  box-shadow:0 8px 20px -8px var(--a1);
}
.nav-b[aria-current="true"] svg{opacity:1}
.nav-b .lencana{
  margin-left:auto;
  min-width:20px;
  height:20px;
  padding:0 6px;
  border-radius:10px;
  background:var(--buruk);
  color:#fff;
  font-size:11.5px;
  font-weight:800;
  display:grid;
  place-items:center;
  font-variant-numeric:tabular-nums;
}
.nav-b[aria-current="true"] .lencana{background:rgba(0,0,0,.28)}

.sisi-judul{
  font-size:11px;
  font-weight:800;
  letter-spacing:.11em;
  text-transform:uppercase;
  color:var(--redup);
  padding:16px 11px 6px;
}

.stase-b{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  padding:7px 11px;
  border:0;
  border-radius:var(--r-s);
  background:transparent;
  color:var(--tinta-2);
  cursor:pointer;
  font-size:13.5px;
  font-weight:600;
  text-align:left;
  transition:background .16s;
}
.stase-b:hover{background:rgba(var(--kaca),.7)}
.stase-b[aria-current="true"]{background:rgba(var(--kaca),.95);color:var(--tinta)}
.stase-b .titik{
  width:9px;height:9px;
  flex:0 0 9px;
  border-radius:50%;
  background:hsl(var(--h) 78% 58%);
  box-shadow:0 0 0 3px hsl(var(--h) 78% 58% / .18);
}
.stase-b .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stase-b .n{font-size:12px;color:var(--redup);font-variant-numeric:tabular-nums}

/* ---------- panggung ---------- */

.panggung{min-width:0;display:flex;flex-direction:column;gap:18px}

.atas{
  display:flex;
  align-items:center;
  gap:12px;
  border-radius:var(--r-l);
  padding:11px 14px;
  position:sticky;
  top:18px;
  z-index:20;
}
.cari-kotak{flex:1;position:relative;min-width:0}
.cari-kotak svg{
  position:absolute;
  left:13px;top:50%;
  transform:translateY(-50%);
  color:var(--redup);
  pointer-events:none;
}
.cari-kotak input{
  width:100%;
  padding:10px 14px 10px 40px;
  border-radius:100px;
  border:1px solid var(--garis);
  background:rgba(var(--kaca),.55);
  font-size:14.5px;
  font-weight:500;
}
.cari-kotak input::placeholder{color:var(--redup);font-weight:500}
.cari-kotak input:focus{outline:none;border-color:var(--a1);box-shadow:0 0 0 4px rgba(var(--kaca),.9), 0 0 0 5px var(--a1)}

/* ---------- tombol ---------- */

.t{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:9px 17px;
  border-radius:100px;
  border:1px solid var(--garis);
  background:rgba(var(--kaca),.7);
  color:var(--tinta);
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  transition:transform .14s, box-shadow .16s, background .16s;
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
}
.t:hover{background:rgba(var(--kaca),.95);box-shadow:var(--kaca-bayang)}
.t:active{transform:scale(.96)}
.t:disabled{opacity:.45;cursor:not-allowed;transform:none}

.t.utama{
  background:linear-gradient(135deg,var(--a1),var(--a3));
  border-color:transparent;
  color:var(--atas-aksen);
  box-shadow:0 10px 26px -10px var(--a1);
}
.t.utama:hover{filter:brightness(1.07);box-shadow:0 14px 32px -10px var(--a1)}
.t.bahaya{color:var(--buruk);border-color:rgba(226,61,90,.3)}
.t.bahaya:hover{background:var(--buruk-latar)}
.t.sunyi{background:transparent;border-color:transparent;color:var(--redup);font-weight:600}
.t.sunyi:hover{background:rgba(var(--kaca),.8);color:var(--tinta)}
.t.kcl{padding:6px 13px;font-size:13px}

/* ---------- hero ---------- */

.hero{
  border-radius:var(--r-xl);
  padding:26px 26px 22px;
  position:relative;
  overflow:hidden;
}
.hero::after{
  content:"";
  position:absolute;
  right:-70px;top:-90px;
  width:260px;height:260px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--a1),var(--a3));
  opacity:.16;
  pointer-events:none;
}

/* Spanduk gambar stase yang dipasang pemilik. Teks tetap terbaca karena
   gambar diberi gradien penutup ke arah bawah. */
.hero.berspanduk{
  padding-top:132px;
  color:#fff;
}
.hero.berspanduk::before{
  content:"";
  position:absolute;
  left:0;right:0;top:0;
  height:210px;
  background-image:linear-gradient(to bottom, rgba(10,8,14,.15) 0%, rgba(10,8,14,.72) 78%, rgba(var(--kaca),1) 100%), var(--spanduk);
  background-size:cover, cover;
  background-position:center, center;
  pointer-events:none;
}
.hero.berspanduk::after{display:none}
.hero.berspanduk .sapa{position:relative;color:rgba(255,255,255,.82)}
.hero.berspanduk h1{
  position:relative;
  background:none;
  -webkit-text-fill-color:#fff;
  color:#fff;
  text-shadow:0 2px 18px rgba(0,0,0,.45);
}
.hero.berspanduk p{position:relative}
.hero.berspanduk .angka-baris{position:relative}
.hero .sapa{
  font-size:13.5px;
  font-weight:700;
  color:var(--redup);
  margin:0 0 5px;
}
.hero h1{
  font-family:var(--f-tampil);
  font-size:clamp(30px,5.2vw,44px);
  font-weight:800;
  letter-spacing:-.035em;
  line-height:1.05;
  margin:0;
  text-wrap:balance;
  color:var(--tinta);
}
/* Gradien hanya dipasang kalau browsernya mendukung, supaya judul tidak
   pernah jadi tak terlihat gara-gara color:transparent tanpa clip. */
@supports ((-webkit-background-clip: text) or (background-clip: text)){
  .hero h1{
    background:linear-gradient(120deg,var(--tinta) 30%,var(--a3));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
}
.hero p{
  color:var(--tinta-2);
  margin:11px 0 0;
  max-width:56ch;
  font-size:14.5px;
}

.angka-baris{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.angka{
  border-radius:var(--r-m);
  padding:11px 15px;
  background:rgba(var(--kaca),.7);
  border:1px solid var(--kaca-tepi);
  min-width:82px;
}
.angka b{
  display:block;
  font-family:var(--f-tampil);
  font-size:23px;
  font-weight:800;
  line-height:1.1;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;
}
.angka span{
  display:block;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--redup);
  margin-top:2px;
}

/* ---------- cincin stase ---------- */

.cincin-baris{
  display:flex;
  gap:15px;
  overflow-x:auto;
  padding:4px 2px 10px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.cincin-baris::-webkit-scrollbar{display:none}

.cincin{
  flex:0 0 auto;
  width:70px;
  background:none;
  border:0;
  padding:0;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
}
.cincin .lingkar{
  width:62px;height:62px;
  border-radius:50%;
  padding:2.5px;
  background:conic-gradient(from 140deg, hsl(var(--h) 85% 62%), hsl(var(--h2) 85% 60%), hsl(var(--h) 85% 62%));
  transition:transform .18s;
  position:relative;
}
/* Stase kosong tetap berwarna, hanya diredupkan. */
.cincin.sepi .lingkar{opacity:.4}
.cincin.sepi:hover .lingkar{opacity:.72}
.cincin:hover .lingkar{transform:scale(1.07)}
.cincin:active .lingkar{transform:scale(.96)}
.cincin[aria-current="true"] .lingkar{
  box-shadow:0 0 0 3px rgba(var(--kaca),.9), 0 0 0 5.5px hsl(var(--h) 85% 60%);
}
.cincin .isi{
  width:100%;height:100%;
  border-radius:50%;
  background:rgba(var(--kaca),.92);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  display:grid;
  place-items:center;
  font-family:var(--f-tampil);
  font-size:14.5px;
  font-weight:800;
  letter-spacing:.01em;
  color:var(--tinta);
}
.cincin.sepi .isi{color:var(--redup)}
.cincin .cap{
  font-size:11px;
  font-weight:700;
  color:var(--tinta-2);
  line-height:1.25;
  text-align:center;
  max-width:70px;
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}
.cincin .jml{
  position:absolute;
  right:-2px;bottom:-2px;
  min-width:20px;height:20px;
  padding:0 5px;
  border-radius:10px;
  background:linear-gradient(135deg,var(--a1),var(--a3));
  color:var(--atas-aksen);
  font-size:11px;
  font-weight:800;
  display:grid;
  place-items:center;
  border:2px solid rgba(var(--kaca),.95);
  font-variant-numeric:tabular-nums;
}

/* ---------- saring ---------- */

.saring{display:flex;gap:8px;flex-wrap:wrap}
.pil{
  padding:7px 15px;
  border-radius:100px;
  border:1px solid var(--garis);
  background:rgba(var(--kaca),.5);
  color:var(--tinta-2);
  font-size:13.5px;
  font-weight:700;
  cursor:pointer;
  transition:transform .14s, background .16s;
}
.pil:hover{background:rgba(var(--kaca),.9)}
.pil:active{transform:scale(.95)}
.pil[aria-pressed="true"]{
  background:linear-gradient(135deg,var(--a1),var(--a3));
  border-color:transparent;
  color:var(--atas-aksen);
  box-shadow:0 8px 20px -9px var(--a1);
}

/* ---------- kartu ---------- */

.kartu-kisi{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}

.kartu{
  border-radius:var(--r-l);
  padding:18px 19px 17px;
  text-align:left;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  gap:9px;
  transition:transform .2s cubic-bezier(.2,.7,.3,1), box-shadow .2s;
  animation:masuk .45s cubic-bezier(.2,.7,.3,1) backwards;
}
.kartu:hover{transform:translateY(-4px);box-shadow:var(--kaca-bayang-naik), inset 0 1px 0 var(--kaca-kilau)}
.kartu:active{transform:translateY(-1px) scale(.99)}

@keyframes masuk{ from{opacity:0;transform:translateY(14px)} }

.kartu-atas{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.tag-stase{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:4px 11px 4px 8px;
  border-radius:100px;
  background:hsl(var(--h) 80% 60% / .15);
  color:hsl(var(--h) 72% 38%);
  font-size:11.5px;
  font-weight:800;
  letter-spacing:.02em;
}
@media (prefers-color-scheme: dark){ .tag-stase{color:hsl(var(--h) 85% 72%)} }
:root[data-theme="dark"] .tag-stase{color:hsl(var(--h) 85% 72%)}
:root[data-theme="light"] .tag-stase{color:hsl(var(--h) 72% 38%)}
.tag-stase .titik{width:7px;height:7px;border-radius:50%;background:currentColor}

.tipe-pil{
  padding:3px 10px;
  border-radius:100px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.04em;
  text-transform:uppercase;
  background:rgba(var(--kaca),.85);
  border:1px solid var(--garis);
  color:var(--tinta-2);
}

.status-pil{
  padding:3px 10px;
  border-radius:100px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.03em;
}
.status-pil.menunggu{background:var(--tunggu-latar);color:var(--tunggu)}
.status-pil.dikembalikan{background:var(--buruk-latar);color:var(--buruk)}

.kartu h3{
  font-family:var(--f-tampil);
  font-size:19.5px;
  font-weight:800;
  letter-spacing:-.024em;
  line-height:1.22;
  margin:0;
  text-wrap:balance;
}
.kartu .cuplik{
  color:var(--redup);
  font-size:13.5px;
  line-height:1.55;
  margin:0;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.kartu-kaki{
  display:flex;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
  margin-top:auto;
  padding-top:5px;
  font-size:12px;
  font-weight:600;
  color:var(--redup);
}
.kartu-kaki .skor{
  color:var(--baik);
  background:var(--baik-latar);
  padding:2px 9px;
  border-radius:100px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
}

.tag-baris{display:flex;flex-wrap:wrap;gap:6px}
.tag{
  font-size:11.5px;
  font-weight:700;
  color:var(--redup);
  background:rgba(var(--kaca),.7);
  border:1px solid var(--garis-halus);
  padding:2px 9px;
  border-radius:100px;
}

.sepi-kotak{
  border-radius:var(--r-l);
  padding:44px 26px;

/* =====================================================================
   1b. Mode terkunci
   ---------------------------------------------------------------------
   Saat TERKUNCI berisi bundel, isi arsip TIDAK ada dalam bentuk terbaca
   di berkas ini. Yang tersimpan hanya ciphertext AES-GCM. Kunci utama
   dibungkus terpisah untuk tiap kode akses, jadi tiap pembeli punya
   kodenya sendiri dan kunci utamanya tidak pernah muncul polos.

   Bundel dibuat pemilik lewat menu Atur, lalu ditanam di sini dan
   diterbitkan ulang. Selama TERKUNCI null, situs berjalan terbuka.
   ===================================================================== */

var TERKUNCI = null; /* PENANDA-BUNDEL: baris ini diganti bundel terkunci */

var PUTARAN = 250000;
var ABJAD = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

function bytesKeB64(buf){
  var b = new Uint8Array(buf);
  var s = "";
  for(var i=0;i<b.length;i++) s += String.fromCharCode(b[i]);
  return btoa(s);
}
function b64KeBytes(s){
  var bin = atob(s);
  var b = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) b[i] = bin.charCodeAt(i);
  return b;
}
function acakBytes(n){
  var b = new Uint8Array(n);
  window.crypto.getRandomValues(b);
  return b;
}

function normalPengguna(s){
  return String(s || "").toLowerCase().replace(/[^a-z0-9._-]/g, "");
}

function buatSandi(n){
  var b = acakBytes(n || 10);
  var s = "";
  for(var i=0;i<(n||10);i++) s += ABJAD.charAt(b[i] % 32);
  return s.match(/.{1,5}/g).join("-");
}

/* Kredensial digabung dengan pemisah yang tidak mungkin muncul di nama
   pengguna, supaya "ab"+"cd" tidak pernah setara dengan "a"+"bcd". */
function kredensial(pengguna, sandi){
  return normalPengguna(pengguna) + "\n" + String(sandi || "");
}

function adaKripto(){
  return !!(window.crypto && window.crypto.subtle && window.isSecureContext);
}

async function turunkanKunci(rahasia, garamB64, putaran){
  var bahan = await window.crypto.subtle.importKey(
    "raw", new TextEncoder().encode(rahasia), "PBKDF2", false, ["deriveKey"]
  );
  return window.crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64KeBytes(garamB64), iterations:putaran, hash:"SHA-256"},
    bahan,
    {name:"AES-GCM", length:256},
    false,
    ["encrypt","decrypt"]
  );
}

async function enkripsi(kunci, teks){
  var iv = acakBytes(12);
  var data = await window.crypto.subtle.encrypt(
    {name:"AES-GCM", iv:iv}, kunci, new TextEncoder().encode(teks)
  );
  return {iv:bytesKeB64(iv), data:bytesKeB64(data)};
}

async function dekripsi(kunci, ivB64, dataB64){
  // AES-GCM terautentikasi: kunci salah menolak, bukan menghasilkan sampah.
  try{
    var hasil = await window.crypto.subtle.decrypt(
      {name:"AES-GCM", iv:b64KeBytes(ivB64)}, kunci, b64KeBytes(dataB64)
    );
    return new TextDecoder().decode(hasil);
  }catch(e){ return null; }
}

/* Peran, tingkat akses, dan masa berlaku ikut terenkripsi di dalam
   bungkusan, jadi pemegang akun tidak bisa menaikkan haknya dengan
   menyunting berkas. */
async function bukaDenganAkun(pengguna, sandi){
  if(!TERKUNCI || !adaKripto()) return null;
  var kunciAkun;
  try{ kunciAkun = await turunkanKunci(kredensial(pengguna, sandi), TERKUNCI.garam, TERKUNCI.putaran || PUTARAN); }
  catch(e){ return null; }

  for(var i=0;i<TERKUNCI.bungkus.length;i++){
    var w = TERKUNCI.bungkus[i];
    var isi = await dekripsi(kunciAkun, w.iv, w.data);
    if(!isi) continue;
    var info;
    try{ info = JSON.parse(isi); }catch(e){ continue; }
    if(info.exp && info.exp < hariIni()) return {kedaluwarsa:true, exp:info.exp, nama:info.n || ""};

    var hasil = {
      peran: info.p || "pembaca",
      tingkat: info.t || "penuh",
      nama: info.n || pengguna,
      pengguna: normalPengguna(pengguna),
      exp: info.exp || "",
      isi: null
    };

    // Akun tingkat publik tidak memegang kunci muatan terbatas.
    if(info.k){
      var master = await window.crypto.subtle.importKey(
        "raw", b64KeBytes(info.k), {name:"AES-GCM"}, false, ["encrypt","decrypt"]
      );
      var muatan = await dekripsi(master, TERKUNCI.muatan.iv, TERKUNCI.muatan.data);
      if(muatan === null) return null;
      try{ hasil.isi = JSON.parse(muatan); }catch(e){ return null; }
    }
    return hasil;
  }
  return null;
}

  var d = new Date(s);
  if(isNaN(d.getTime())) return s;
  var b = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
  return d.getDate() + " " + b[d.getMonth()] + " " + d.getFullYear();
}

/* ---------------------------------------------------------------------
   Dialog dalam aplikasi. Menggantikan prompt/confirm/alert bawaan browser
   yang tampilannya tidak nyambung dengan sisa situs, sekaligus memberi
   jebakan fokus dan tombol Esc yang benar.

   Mengembalikan Promise:
     jenis "konfirmasi" -> true / false
     jenis "teks"       -> isi string / null bila dibatalkan
     jenis "info"       -> true
   --------------------------------------------------------------------- */

var dialogAktif = null;

function jebakTab(ev, wadah){
  var f = wadah.querySelectorAll("button, input, textarea, select, a[href]");
  if(!f.length) return;
  var awal = f[0], akhir = f[f.length - 1];
  if(ev.shiftKey && document.activeElement === awal){ ev.preventDefault(); akhir.focus(); }
  else if(!ev.shiftKey && document.activeElement === akhir){ ev.preventDefault(); awal.focus(); }
}

function dialog(o){
  o = o || {};
  return new Promise(function(selesai){
    var kosongan = o.jenis === "teks" || o.jenis === "borang" ? null : false;
    if(dialogAktif){ selesai(kosongan); return; }

    var teks = o.jenis === "teks";
    var info = o.jenis === "info";
    // "borang" menampung beberapa isian sekaligus; pemanggil menyusun HTML-nya
    // sendiri lalu memanennya lewat o.ambil() saat dikirim.
    var borang = o.jenis === "borang";
    var g = document.createElement("div");
    g.className = "gerbang";
    g.setAttribute("role", "dialog");
    g.setAttribute("aria-modal", "true");

    var h = '<form class="gerbang-kotak kaca' + (o.lebar ? " gerbang-lebar" : "") + '" id="dform">';
    h += "<h2>" + esc(o.judul || "Konfirmasi") + "</h2>";
    if(o.pesan) h += '<p class="dialog-pesan">' + esc(o.pesan) + "</p>";
    if(teks){
      h += '<div class="b"><label for="dnilai">' + esc(o.label || "Isian") + "</label>";
      h += o.banyakBaris
        ? '<textarea id="dnilai" class="mono" placeholder="' + esc(o.placeholder || "") + '">' + esc(o.nilai || "") + "</textarea>"
        : '<input id="dnilai" type="' + (o.rahasia ? "password" : "text") +
          '" value="' + esc(o.nilai || "") + '" placeholder="' + esc(o.placeholder || "") + '" autocomplete="off">';
      h += "</div>";
    }
    if(borang) h += '<div class="dialog-borang">' + (o.isi || "") + '<p class="dialog-galat" id="dgalat" role="alert"></p></div>';
    h += '<div class="kotak-aksi"><button class="t ' + (o.bahaya ? "bahaya-utama" : "utama") + '" type="submit">' +
         esc(o.ok || (info ? "Mengerti" : "Lanjut")) + "</button>";
    if(!info) h += '<button class="t sunyi" type="button" id="dbatal">' + esc(o.batal || "Batal") + "</button>";
    h += "</div></form>";

    g.innerHTML = h;
    document.body.appendChild(g);
    dialogAktif = g;

    var fokusLama = document.activeElement;
    var inp = g.querySelector("#dnilai");
    var awal = inp || g.querySelector(".dialog-borang input, .dialog-borang select, .dialog-borang textarea") ||
               g.querySelector('button[type="submit"]');
    if(awal) awal.focus();
    if(inp && inp.select) inp.select();

    function tutup(hasil){
      document.removeEventListener("keydown", padaTombol, true);
      g.remove();
      dialogAktif = null;
      if(fokusLama && fokusLama.focus){ try{ fokusLama.focus(); }catch(e){} }
      selesai(hasil);
    }
    function batal(){ tutup(kosongan); }

    function padaTombol(ev){
      if(ev.key === "Escape" && !info){ ev.preventDefault(); batal(); }
      else if(ev.key === "Tab") jebakTab(ev, g);
    }
    document.addEventListener("keydown", padaTombol, true);

    g.querySelector("#dform").addEventListener("submit", function(ev){
      ev.preventDefault();
      if(borang){
        var panen = o.ambil ? o.ambil() : {nilai:{}};
        if(panen && panen.galat){
          var eg = g.querySelector("#dgalat");
          if(eg) eg.textContent = panen.galat;
          return;
        }
        tutup(panen ? panen.nilai : null);
        return;
      }
      tutup(teks ? (inp ? inp.value : "") : true);
    });
    var tb = g.querySelector("#dbatal");
    if(tb) tb.addEventListener("click", batal);
    g.addEventListener("mousedown", function(ev){ if(ev.target === g && !info) batal(); });
  });
}

function salin(teks, pesan){
  function cadangan(){
    var ta = document.createElement("textarea");
    ta.value = teks;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); toast(pesan || "Disalin."); }
    catch(e){ toast("Tidak bisa menyalin otomatis \u2014 pilih teksnya manual."); }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(teks).then(function(){ toast(pesan || "Disalin."); }, cadangan);
  } else cadangan();
}

function unduh(nama, isi){
  if(window.claude && window.claude.downloads){
    window.claude.downloads.save({filename:nama, data:isi}).then(function(){
      toast("Berkas tersimpan.");
    }, function(err){
      var c = err && err.code;
      if(c === "declined") return;
      if(c === "rate_limited") toast("Tunggu sebentar lalu coba lagi.");
      else if(c === "too_large") toast("Arsip terlalu besar untuk diunduh (batas 16 MB).");
      else toast("Unduhan tidak tersedia di sini \u2014 pakai tombol Salin.");
    });
    return;
  }
  try{
    var b = new Blob([isi], {type:"application/json"});
    var u = URL.createObjectURL(b);
    var a = document.createElement("a");
    a.href = u; a.download = nama;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(u); }, 1000);
    toast("Berkas tersimpan.");
  }catch(e){ toast("Unduhan tidak tersedia \u2014 pakai tombol Salin."); }
}

async function sha(teks){
  if(!(window.crypto && window.crypto.subtle)) return "polos:" + teks;
  var buf = new TextEncoder().encode(teks);
  var h = await window.crypto.subtle.digest("SHA-256", buf);
  return Array.prototype.map.call(new Uint8Array(h), function(b){
    return b.toString(16).padStart(2,"0");
  }).join("");
}

/* =====================================================================
   4. Markdown ringkas
   ===================================================================== */

function inline(t){
  return esc(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
}

function md(src){
  var lines = String(src || "").replace(/\r\n?/g, "\n").split("\n");
  var out = [];
  var i = 0;

  function barisTabel(s){ return /^\s*\|.*\|\s*$/.test(s); }
  function selTabel(s){
    return s.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function(c){ return c.trim(); });
  }

  while(i < lines.length){
    var l = lines[i];
    if(/^\s*$/.test(l)){ i++; continue; }

    if(/^```/.test(l)){
      var buf = [];
      i++;
      while(i < lines.length && !/^```/.test(lines[i])){ buf.push(lines[i]); i++; }
      i++;
      out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>");
      continue;
    }

    if(/^\s*(---|\*\*\*|___)\s*$/.test(l)){ out.push("<hr>"); i++; continue; }

    var h = l.match(/^(#{1,4})\s+(.*)$/);
    if(h){
      var n = Math.max(2, Math.min(h[1].length, 4));
      out.push("<h" + n + ">" + inline(h[2]) + "</h" + n + ">");
      i++;
      continue;
    }

    if(barisTabel(l) && i + 1 < lines.length && /^\s*\|[\s:\-|]+\|\s*$/.test(lines[i+1])){
      var head = selTabel(l);
      i += 2;
      var body = [];
      while(i < lines.length && barisTabel(lines[i])){ body.push(selTabel(lines[i])); i++; }
      var t = '<div class="tabel-bungkus"><table><thead><tr>';
      head.forEach(function(c){ t += "<th>" + inline(c) + "</th>"; });
      t += "</tr></thead><tbody>";
      body.forEach(function(r){
        t += "<tr>";
        for(var k=0;k<head.length;k++){ t += "<td>" + inline(r[k] || "") + "</td>"; }
        t += "</tr>";
      });
      out.push(t + "</tbody></table></div>");
      continue;
    }

    if(/^\s*>\s?/.test(l)){
      var qb = [];
      while(i < lines.length && /^\s*>\s?/.test(lines[i])){ qb.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
      out.push("<blockquote>" + md(qb.join("\n")) + "</blockquote>");
      continue;
    }

    // Daftar bertingkat: kedalaman diambil dari spasi di depan baris, jadi
    // sub-poin benar-benar menjorok alih-alih rata dengan induknya.
    if(/^\s*(?:\d+[.)]|[-*+])\s+/.test(l)){
      var awal = i;
      var potong = [];
      while(i < lines.length && /^\s*(?:\d+[.)]|[-*+])\s+/.test(lines[i])){
        var spasi = (lines[i].match(/^\s*/) || [""])[0].replace(/\t/g, "    ").length;
        var urut = /^\s*\d+[.)]\s+/.test(lines[i]);
        potong.push({
          dalam: Math.floor(spasi / 2),
          urut: urut,
          teks: lines[i].replace(/^\s*(?:\d+[.)]|[-*+])\s+/, "")
        });
        i++;
      }
      if(!potong.length){ i = awal; }
      else {
        var html = "";
        var tumpuk = [];
        potong.forEach(function(butir){
          while(tumpuk.length && butir.dalam < tumpuk[tumpuk.length - 1].dalam){
            html += "</li></" + tumpuk.pop().tag + ">";
          }
          var atas = tumpuk[tumpuk.length - 1];
          if(atas && butir.dalam === atas.dalam){
            html += "</li><li>" + inline(butir.teks);
          } else {
            var tag = butir.urut ? "ol" : "ul";
            html += "<" + tag + "><li>" + inline(butir.teks);
            tumpuk.push({tag:tag, dalam:butir.dalam});
          }
        });
        while(tumpuk.length) html += "</li></" + tumpuk.pop().tag + ">";
        out.push(html);
        continue;
      }
    }

    var pb = [];
    while(i < lines.length && !/^\s*$/.test(lines[i])
          && !/^(#{1,4}\s|```|\s*[-*+]\s|\s*\d+[.)]\s|\s*>)/.test(lines[i])
          && !barisTabel(lines[i])){
      pb.push(lines[i]); i++;
    }
    if(pb.length) out.push("<p>" + inline(pb.join(" ")) + "</p>");
  }
  return out.join("\n");
}

function ringkas(s, n){
  var t = String(s || "").replace(/[#*`>|]/g, " ").replace(/\s+/g, " ").trim();
  return t.length > n ? t.slice(0, n).trim() + "\u2026" : t;
}

/* =====================================================================
   5. Pengurai latihan soal
   ===================================================================== */

/* Menengok ke depan: nomor ini pembuka soal baru, atau sekadar butir
   daftar di dalam pembahasan? Soal selalu punya pilihan jawaban. */
function soalBaruDiSini(lines, i){
  for(var k = i + 1; k < lines.length && k < i + 8; k++){
    var t = lines[k].trim();
    if(!t) continue;
    if(/^[A-Ea-e]\s*[.)]\s+/.test(t)) return true;
    if(/^(?:soal\s*)?\d+\s*[.)]\s+/i.test(t)) return false;
    if(/^(?:jawaban|kunci|jawab|pembahasan|penjelasan|alasan|rasional)\s*[:.\-]/i.test(t)) return false;
  }
  return false;
}

function uraiSoal(teks){
  var s = String(teks || "").trim();
  if(!s) return [];

  if(s.charAt(0) === "[" || s.charAt(0) === "{"){
    try{
      var j = JSON.parse(s);
      var arr = Array.isArray(j) ? j : (Array.isArray(j.soal) ? j.soal : null);
      if(arr) return arr.map(normalSoal).filter(Boolean);
    }catch(e){}
  }

  var lines = s.replace(/\r\n?/g, "\n").split("\n");
  var soal = [];
  var cur = null;
  var mode = null;

  function tutup(){
    if(cur && cur.q && cur.opsi.length >= 2) soal.push(cur);
    cur = null; mode = null;
  }

  for(var i=0;i<lines.length;i++){
    var raw = lines[i];
    var l = raw.trim();
    if(!l){ if(mode === "bahas" && cur) cur.penjelasan += "\n"; continue; }

    var mQ = l.match(/^(?:soal\s*)?(\d+)\s*[.)]\s+(.*)$/i);
    var mO = l.match(/^([A-Ea-e])\s*[.)]\s+(.*)$/);
    var mK = l.match(/^(?:jawaban|kunci|kunci jawaban|jawab)\s*[:.\-]\s*([A-Ea-e0-9])/i);
    var mP = l.match(/^(?:pembahasan|penjelasan|alasan|rasional)\s*[:.\-]\s*(.*)$/i);

    if(mK && cur){
      var k = mK[1].toUpperCase();
      cur.jawaban = /[0-9]/.test(k) ? (parseInt(k,10) - 1) : (k.charCodeAt(0) - 65);
      mode = null;
      continue;
    }
    if(mP && cur){ cur.penjelasan = mP[1] || ""; mode = "bahas"; continue; }
    if(mO && cur && mode !== "bahas"){ cur.opsi.push(mO[2]); mode = "opsi"; continue; }
    // Saat sedang mengumpulkan pembahasan, baris bernomor belum tentu soal
    // baru: pembahasan sering memuat langkah "1. ... 2. ...". Soal sungguhan
    // selalu disusul pilihan jawaban, jadi itu yang dijadikan penentu.
    if(mQ && (mode !== "bahas" || (!/^\s/.test(raw) && soalBaruDiSini(lines, i)))){
      tutup(); cur = {q:mQ[2], opsi:[], jawaban:-1, penjelasan:""}; mode = "q"; continue;
    }
    if(cur){
      if(mode === "bahas") cur.penjelasan += (cur.penjelasan ? "\n" : "") + l;
      else if(mode === "q") cur.q += " " + l;
      else if(mode === "opsi" && cur.opsi.length) cur.opsi[cur.opsi.length-1] += " " + l;
    }
  }
  tutup();
  return soal.map(normalSoal).filter(Boolean);
}

function normalSoal(o){
  if(!o || typeof o !== "object") return null;
  var q = String(o.q || o.pertanyaan || o.soal || "").trim();
  var opsi = o.opsi || o.pilihan || o.options || o.choices || [];
  if(!Array.isArray(opsi)) return null;
  opsi = opsi.map(function(x){ return String(x).replace(/^\s*[A-Ea-e]\s*[.)]\s*/, "").trim(); })
             .filter(function(x){ return x.length > 0; });
  var jw = o.jawaban;
  if(jw === undefined) jw = o.kunci;
  if(jw === undefined) jw = o.answer;
  if(typeof jw === "string"){
    var t = jw.trim().toUpperCase();
    jw = /^[0-9]+$/.test(t) ? parseInt(t,10) - 1 : t.charCodeAt(0) - 65;
  }
  jw = Number(jw);
  if(!q || opsi.length < 2) return null;
  if(!(jw >= 0 && jw < opsi.length)) jw = 0;
  return {q:q, opsi:opsi, jawaban:jw, penjelasan:String(o.penjelasan || o.pembahasan || o.explanation || "").trim()};
}

function soalKeTeks(list){
  return (list || []).map(function(s, i){
    var b = (i+1) + ". " + s.q + "\n";
    s.opsi.forEach(function(o, k){ b += String.fromCharCode(65+k) + ". " + o + "\n"; });
    b += "Jawaban: " + String.fromCharCode(65 + s.jawaban) + "\n";
    if(s.penjelasan) b += "Pembahasan: " + String(s.penjelasan).replace(/\n/g, "\n  ") + "\n";
    return b;
  }).join("\n");
}

function setSesi(o){

    if(o) sessionStorage.setItem(KUNCI + "/sesi", JSON.stringify(o));
    else sessionStorage.removeItem(KUNCI + "/sesi");
  }catch(e){}
}
function peran(){ return sesi().peran || ""; }
function setPeran(p){
  var s = sesi();
  if(p){ s.peran = p; setSesi(s); }
  else setSesi(null);
}
/* Saat terbuka semua orang melihat semuanya. Saat terkunci, pengunjung
   tanpa akun hanya kebagian materi publik. */
function tingkat(){
  if(!TERKUNCI) return "penuh";
  return sesi().tingkat || "publik";
}
function penuh(){ return tingkat() === "penuh"; }
function namaAkun(){ return sesi().nama || ""; }
function penggunaAkun(){ return sesi().pengguna || ""; }
function pemilik(){ return peran() === "pemilik"; }
function kontributor(){ return peran() === "kontributor"; }
function bisaTulis(){ return pemilik() || kontributor(); }

/* Nama penulis punya dua bentuk: di mode server berisi nama pengguna
   (dipaksa server), di mode luring berisi nama peran. Entri lama pun bisa
   memakai bentuk yang satunya. Semua pengecekan "ini tulisanku" harus lewat
   sini, jangan dibandingkan langsung dengan "kontributor". */
function penulisSaya(){
  return (SERVER.ada && penggunaAkun()) ? penggunaAkun() : (peran() || "pemilik");
}
function punyaku(e){
  if(!e || !e.penulis) return false;
  return e.penulis === penulisSaya() || e.penulis === peran();
}

function entriTampak(){
  // Pembaca hanya melihat yang terbit. Kontributor juga melihat miliknya
  // yang sedang ditinjau atau dikembalikan. Pemilik melihat semuanya.
  var l;
  if(pemilik()) l = db.entri;
  else if(kontributor()) l = db.entri.filter(function(e){
    return e.status === "terbit" || punyaku(e);
  });
  else l = db.entri.filter(function(e){ return e.status === "terbit"; });

  // Tingkat publik hanya kebagian entri bertanda publik \u2014 kecuali
  // tulisannya sendiri, yang harus selalu terlihat oleh penulisnya.
  if(!penuh() && !pemilik()) l = l.filter(function(e){ return e.akses === "publik" || punyaku(e); });
  return l;
}

function antrian(){
  return db.entri.filter(function(e){ return e.status === "menunggu"; });
}

function entriTersaring(){
  var q = ui.cari.trim().toLowerCase();
  return entriTampak().filter(function(e){
    if(ui.stase !== "semua" && e.stase !== ui.stase) return false;
    if(ui.tipe !== "semua" && e.tipe !== ui.tipe) return false;
    if(!q) return true;
    var hay = [e.judul, e.isi, e.sumber, (e.tag||[]).join(" ")];
    (e.soal || []).forEach(function(s){ hay.push(s.q, s.penjelasan, (s.opsi||[]).join(" ")); });
    return hay.join(" ").toLowerCase().indexOf(q) !== -1;
  }).sort(function(a,b){
    var sa = a.status === "terbit" ? 1 : 0;
    var sb = b.status === "terbit" ? 1 : 0;
    if(sa !== sb) return sa - sb;
    return String(b.tanggal || "").localeCompare(String(a.tanggal || ""));
  });
}

function cariEntri(id){
  for(var i=0;i<db.entri.length;i++){ if(db.entri[i].id === id) return db.entri[i]; }
  return null;
}

/* ---------------------------------------------------------------------

   Disimpan terpisah per nama pengguna di browser masing-masing, jadi
   tidak pernah ikut ke bundel dan tidak terlihat akun lain.

var pribadi = null;

function kunciPribadi(){ return KUNCI + "/pribadi/" + (penggunaAkun() || "tamu"); }

function pribadiKosong(){
  return {latar:null, latarBuram:0, latarGelap:45, tema:null, ipk:null, skor:{}, klarifikasi:[],
          agenda:[], agendaSelesai:{}, catatan:[], berkas:[], berkasSelesai:{}};
}

function muatPribadi(){
  try{ pribadi = JSON.parse(localStorage.getItem(kunciPribadi()) || "null") || pribadiKosong(); }
  catch(e){ pribadi = pribadiKosong(); }
  var k = pribadiKosong();
  for(var f in k){ if(pribadi[f] === undefined) pribadi[f] = k[f]; }

  // Pindahan dari versi yang menyimpan skor di db bersama.
  if(db && (Object.keys(db.skor || {}).length || (db.klarifikasi || []).length)){
    if(!Object.keys(pribadi.skor).length) pribadi.skor = db.skor || {};
    if(!pribadi.klarifikasi.length) pribadi.klarifikasi = db.klarifikasi || [];
    db.skor = {}; db.klarifikasi = [];
    simpanPribadi();
    simpan();
  }
  return pribadi;
}

/* Skor kuis dan tanda klarifikasi ikut data pribadi, bukan db bersama,
   supaya tiap akun punya catatannya sendiri di perangkat yang sama. */
function skorSaya(){
  if(!pribadi.skor || typeof pribadi.skor !== "object") pribadi.skor = {};
  return pribadi.skor;
}
/* Catatan pribadi ikut ember `pribadi` tiap akun. Ember itu hanya
   dikembalikan server kepada pemiliknya sendiri, jadi pemilik arsip pun
   tidak bisa membacanya. Jangan pernah memindahkannya ke `db`. */
function berkasSelesai(){
  if(!pribadi.berkasSelesai || typeof pribadi.berkasSelesai !== "object") pribadi.berkasSelesai = {};
  return pribadi.berkasSelesai;
}

function catatanSaya(){
  if(!Array.isArray(pribadi.catatan)) pribadi.catatan = [];
  return pribadi.catatan;
}

function agendaSaya(){
  if(!Array.isArray(pribadi.agenda)) pribadi.agenda = [];
  return pribadi.agenda;
}
function agendaSelesai(){
  if(!pribadi.agendaSelesai || typeof pribadi.agendaSelesai !== "object") pribadi.agendaSelesai = {};
  return pribadi.agendaSelesai;
}
function klarifikasiSaya(){
  if(!Array.isArray(pribadi.klarifikasi)) pribadi.klarifikasi = [];
  return pribadi.klarifikasi;
}

function simpanPribadi(){
  dorongPribadi();
  try{ localStorage.setItem(kunciPribadi(), JSON.stringify(pribadi)); return true; }
  catch(e){
    toast("Penyimpanan browser penuh. Coba gambar latar yang lebih kecil.");
    return false;
  }
}

/* Gambar dikecilkan dulu sebelum jadi data URI. Foto kamera mentah bisa
   5 MB dan langsung menghabiskan jatah localStorage. */
function bacaGambar(file, maksSisi, mutu){
  return new Promise(function(res, tolak){
    if(!file || !/^image\//.test(file.type)) return tolak(new Error("Berkasnya bukan gambar."));
    var fr = new FileReader();
    fr.onerror = function(){ tolak(new Error("Gagal membaca berkas.")); };
    fr.onload = function(){
      var img = new Image();
      img.onerror = function(){ tolak(new Error("Gambar tidak bisa dibuka.")); };
      img.onload = function(){
        var sk = Math.min(1, maksSisi / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * sk));
        var h = Math.max(1, Math.round(img.height * sk));
        var c = document.createElement("canvas");
        c.width = w; c.height = h;
        var ctx = c.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        try{ res(c.toDataURL("image/jpeg", mutu || 0.82)); }
        catch(e){ tolak(new Error("Gambar tidak bisa diproses.")); }
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function beratKb(dataUri){ return Math.round((String(dataUri||"").length * 0.75) / 1024); }

function terapkanIkon(){
  if(!db || !db.ikon) return;
  var tautan = document.querySelector('link[rel="icon"][data-ikon-situs]');
  if(!tautan){
    tautan = document.createElement("link");
    tautan.rel = "icon";
    tautan.setAttribute("data-ikon-situs", "1");
    document.head.appendChild(tautan);
  }
  tautan.href = db.ikon;
}

function terapkanTema(ubahMode){
  var r = document.documentElement;
  var t = (pribadi && pribadi.tema) ? pribadi.tema : db.tema;
  r.style.setProperty("--a1", t.a1);
  r.style.setProperty("--a2", t.a2);
  r.style.setProperty("--a3", t.a3);

  var mode = (pribadi && pribadi.tema && pribadi.tema.mode) ? pribadi.tema.mode : db.tema.mode;
  if(mode === "terang") r.setAttribute("data-theme", "light");
  else if(mode === "gelap") r.setAttribute("data-theme", "dark");
  else if(ubahMode) r.removeAttribute("data-theme");

  var foto = document.getElementById("latarFoto");
  var tudung = document.getElementById("latarTudung");
  if(pribadi && pribadi.latar){
    document.body.classList.add("berlatar");
    foto.style.backgroundImage = 'url("' + pribadi.latar + '")';
    foto.style.filter = pribadi.latarBuram ? "blur(" + pribadi.latarBuram + "px)" : "";
    foto.style.transform = pribadi.latarBuram ? "scale(1.06)" : "";
    tudung.style.opacity = (Number(pribadi.latarGelap) || 0) / 100;
  } else {
    document.body.classList.remove("berlatar");
    foto.style.backgroundImage = "";
  }
}

/* =====================================================================
   8. Render
   ===================================================================== */

var panggung = document.getElementById("panggung");
var sisi = document.getElementById("sisi");
var bawah = document.getElementById("bawah");

function navItem(){
  var n = [{v:"arsip", ik:"arsip", nm:"Arsip"}];
  // Jadwal terbuka untuk semua peran: tiap orang punya pengingat sendiri,
  // dan pemilik bisa mengumumkan agenda bersama.
  n.push({v:"jadwal", ik:"jadwal", nm:"Jadwal", lencana:jadwalMendesak()});
  n.push({v:"catatan", ik:"catatan", nm:"Catatan"});
  n.push({v:"berkas", ik:"berkas", nm:"Berkas"});
  n.push({v:"ipk", ik:"ipk", nm:"IPK"});
  if(bisaTulis()) n.push({v:"editor", ik:"tambah", nm:"Tambah", sorot:true});
  if(pemilik()) n.push({v:"tinjauan", ik:"tinjau", nm:"Tinjauan", lencana:antrian().length});
  n.push({v:"tampilan", ik:"tampilan", nm:"Tampilan"});
  // Kontributor ikut dapat Alat, tapi isinya disaring di dalam viewAlat:
  // hanya jalur tempel JSON. Pengakses tidak melihatnya sama sekali.
  if(bisaTulis()) n.push({v:"alat", ik:"alat", nm:"Alat"});
  if(pemilik()) n.push({v:"atur", ik:"atur", nm:"Atur"});
  return n;
}

function renderSisi(){
  var h = "";
  h += '<button class="merek" id="merek" type="button">';
  h += '<span class="lambang">' + esc(T("lambang").slice(0,2)) + "</span>";
  h += '<span class="tulisan"><b>' + esc(T("judul")) + "</b><small>" + esc(peranLabel()) + "</small></span>";
  h += "</button>";

  navItem().forEach(function(n){
    h += '<button class="nav-b" type="button" data-view="' + n.v + '" aria-current="' + (ui.view === n.v ? "true" : "false") + '">';
    h += IKON[n.ik] + "<span>" + esc(n.nm) + "</span>";
    if(n.lencana) h += '<span class="lencana">' + n.lencana + "</span>";
    h += "</button>";
  });

  h += '<button class="nav-b" type="button" id="tombolPeran">' + (bisaTulis() || TERKUNCI || (SERVER.ada && penggunaAkun()) ? IKON.keluar : IKON.masuk) +
       "<span>" + (bisaTulis() || TERKUNCI || (SERVER.ada && penggunaAkun()) ? "Keluar" : "Masuk") + "</span></button>";

  h += '<div class="sisi-judul">Stase</div>';
  var hitung = {};
  entriTampak().forEach(function(e){ hitung[e.stase] = (hitung[e.stase] || 0) + 1; });

  h += staseTombol({id:"semua", kode:"ALL", nama:"Semua entri", h:270}, entriTampak().length);
  semuaStase().forEach(function(s){ h += staseTombol(s, hitung[s.id] || 0); });

  sisi.innerHTML = h;

  document.getElementById("merek").addEventListener("click", keBeranda);
  document.getElementById("tombolPeran").addEventListener("click", togelPeran);
  Array.prototype.forEach.call(sisi.querySelectorAll(".nav-b[data-view]"), function(b){
    b.addEventListener("click", function(){ keView(b.dataset.view); });
  });
  Array.prototype.forEach.call(sisi.querySelectorAll(".stase-b"), function(b){
    b.addEventListener("click", function(){
      ui.stase = b.dataset.id; ui.view = "arsip"; ui.entriId = null; render();
    });
  });
}

function staseTombol(s, n){
  return '<button class="stase-b" type="button" data-id="' + esc(s.id) + '" style="--h:' + s.h + '" aria-current="' +
    (ui.stase === s.id && ui.view === "arsip" ? "true" : "false") + '">' +
    '<span class="titik"></span><span class="nm">' + esc(s.nama) + '</span><span class="n">' + n + "</span></button>";
}

function peranLabel(){
  if(pemilik()) return "Mode pemilik";
  if(kontributor()) return "Mode kontributor";
  return T("slogan");
}

function renderBawah(){
  var n = navItem();
  var h = "";
  n.forEach(function(x){
    h += '<button class="bawah-b' + (x.sorot ? " sorot" : "") + '" type="button" data-view="' + x.v + '" aria-current="' +
         (ui.view === x.v ? "true" : "false") + '">' + IKON[x.ik] + "<span>" + esc(x.nm) + "</span>";
    if(x.lencana) h += '<span class="lencana">' + x.lencana + "</span>";
    h += "</button>";
  });
  h += '<button class="bawah-b" type="button" id="peranBawah">' + (bisaTulis() || TERKUNCI || (SERVER.ada && penggunaAkun()) ? IKON.keluar : IKON.masuk) +
       "<span>" + (bisaTulis() || TERKUNCI || (SERVER.ada && penggunaAkun()) ? "Keluar" : "Masuk") + "</span></button>";
  bawah.innerHTML = h;

  Array.prototype.forEach.call(bawah.querySelectorAll(".bawah-b[data-view]"), function(b){
    b.addEventListener("click", function(){ keView(b.dataset.view); });
  });
  document.getElementById("peranBawah").addEventListener("click", togelPeran);
}

function keView(v){
  if(v === "editor"){ bukaEditor(null); return; }
  ui.view = v;
  ui.entriId = null;
  render();
  window.scrollTo(0,0);
}

function keBeranda(){
  ui.view = "arsip"; ui.stase = "semua"; ui.tipe = "semua"; ui.entriId = null;
  render();
  window.scrollTo(0,0);
}

async function togelPeran(){
  if(SERVER.ada){
    if(!await tanya("Keluar dari arsip?", "Kamu perlu masuk lagi dengan akunmu.", {ok:"Keluar"})) return;
    await srv("keluar", {});
    setToken(null);
    setSesi(null);
    location.reload();
    return;
  }
  if(TERKUNCI){
    if(!await tanya("Keluar dari arsip?", "Kamu perlu masuk lagi dengan nama pengguna dan sandimu.",
                    {ok:"Keluar"})) return;
    try{ localStorage.removeItem(KUNCI + "/masuk"); }catch(e){}
    setSesi(null);
    location.reload();
    return;
  }
  if(bisaTulis()){
    setSesi(null);
    muatPribadi();
    terapkanTema();
    if(ui.view === "editor" || ui.view === "atur" || ui.view === "tinjauan") ui.view = "arsip";
    render();
    toast("Sudah keluar.");
  } else mintaSandi();
}

/* Penanda pemegang lisensi. Bukan pengaman, tapi bikin akun yang dibagikan
   ke orang lain gampang dilacak asalnya. */
function teksLisensi(){
  if(!namaAkun() && !penggunaAkun()) return "";
  var b = ["Lisensi: " + (namaAkun() || penggunaAkun())];
  if(penggunaAkun()) b.push("akun " + penggunaAkun());
  b.push(tgl(hariIni()));
  return b.join(" \u00B7 ");
}

function perbaruiLisensi(){
  var el = document.getElementById("lisensi");
  var t = teksLisensi();
  el.textContent = t;
  document.body.classList.toggle("berlisensi", !!t);
}

function render(){
  if(!db) return;
  perbaruiLisensi();
  renderSisi();
  renderBawah();

  if(ui.view === "arsip") viewArsip();
  else if(ui.view === "detail") viewDetail();
  else if(ui.view === "kuis") viewKuis();
  else if(ui.view === "editor") viewEditor();
  else if(ui.view === "tinjauan") viewTinjauan();
  else if(ui.view === "jadwal") viewJadwal();
  else if(ui.view === "catatan") viewCatatan();
  else if(ui.view === "berkas") viewBerkas();
  else if(ui.view === "ipk") viewIpk();
  else if(ui.view === "tampilan") viewTampilan();
  else if(ui.view === "alat") viewAlat();
  else if(ui.view === "atur") viewAtur();
}

function bilahAtas(){
  return '<div class="atas kaca"><div class="cari-kotak">' + IKON.cari +
    '<input id="cari" type="search" placeholder="Cari judul, isi, tag, soal\u2026" autocomplete="off" value="' + esc(ui.cari) + '"></div></div>';
}

function pasangCari(){
  var el = document.getElementById("cari");
  if(!el) return;
  var t = null;
  el.addEventListener("input", function(){
    clearTimeout(t);
    t = setTimeout(function(){
      ui.cari = el.value;
      if(ui.view !== "arsip"){ ui.view = "arsip"; ui.entriId = null; }
      render();
      var f = document.getElementById("cari");
      if(f){ f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
    }, 220);
  });
}

/* --- arsip --- */

function viewArsip(){
  var list = entriTersaring();
  var st = ui.stase === "semua" ? null : cariStase(ui.stase);
  var tampak = entriTampak();
  var jmlSoal = tampak.reduce(function(a,e){ return a + ((e.soal||[]).length); }, 0);
  var jmlKuis = tampak.filter(function(e){ return e.tipe === "kuis"; }).length;

  var h = bilahAtas();

  var gambarStase = st ? (db.staseGambar || {})[st.id] : null;
  h += '<section class="hero kaca' + (gambarStase ? " berspanduk" : "") + '"' +
       (gambarStase ? ' style="--spanduk:url(&quot;' + gambarStase + '&quot;)"' : "") + ">";
  h += '<p class="sapa">' + esc(namaAkun() ? "Halo, " + namaAkun() : T("sapa")) + "</p>";
  h += "<h1>" + esc(st ? st.nama : T("judul")) + "</h1>";
  h += "<p>" + esc(st ? "Semua yang kamu kumpulkan selama stase ini." : T("deskripsi")) + "</p>";
  h += '<div class="angka-baris">';
  h += '<div class="angka"><b>' + tampak.length + "</b><span>Entri</span></div>";
  h += '<div class="angka"><b>' + jmlKuis + "</b><span>Kuis</span></div>";
  h += '<div class="angka"><b>' + jmlSoal + "</b><span>Soal</span></div>";
  if(pemilik() && antrian().length) h += '<div class="angka"><b>' + antrian().length + "</b><span>Menunggu</span></div>";
  h += "</div></section>";

  // Cincin stase bergaya cerita.
  var hitung = {};
  tampak.forEach(function(e){ hitung[e.stase] = (hitung[e.stase] || 0) + 1; });
  h += '<div class="cincin-baris">';
  h += cincin({id:"semua", kode:"ALL", nama:"Semua", h:270, h2:300}, tampak.length);
  semuaStase().forEach(function(s){
    h += cincin({id:s.id, kode:s.kode, nama:s.nama, h:s.h, h2:(s.h + 45) % 360}, hitung[s.id] || 0);
  });
  h += "</div>";

  h += '<div class="saring">';
  [["semua","Semua"]].concat(TIPE_ENTRI.map(function(t){ return [t, labelTipe(t)]; })).forEach(function(t){
    h += '<button class="pil" type="button" data-tipe="' + t[0] + '" aria-pressed="' + (ui.tipe === t[0] ? "true" : "false") + '">' + esc(t[1]) + "</button>";
  });
  h += "</div>";

  if(!list.length){
    h += '<div class="sepi-kotak"><b>' + esc(ui.cari ? "Tidak ada yang cocok" : T("kosongJudul")) + "</b><span>" +
         esc(ui.cari ? 'Coba kata kunci lain untuk "' + ui.cari + '".' : T("kosongIsi")) + "</span></div>";
  } else {
    h += '<div class="kartu-kisi">';
    list.forEach(function(e, i){ h += kartu(e, i); });
    h += "</div>";
  }

  h += '<p style="text-align:center;color:var(--redup);font-size:12.5px;margin:8px 0 0">' + esc(T("kaki")) + "</p>";
  if(teksLisensi()) h += '<p class="kaki-lisensi">' + esc(teksLisensi()) + "</p>";

  panggung.innerHTML = h;
  pasangCari();

  Array.prototype.forEach.call(panggung.querySelectorAll(".pil"), function(b){
    b.addEventListener("click", function(){ ui.tipe = b.dataset.tipe; render(); });
  });
  Array.prototype.forEach.call(panggung.querySelectorAll(".cincin"), function(b){
    b.addEventListener("click", function(){ ui.stase = b.dataset.id; render(); });
  });
  Array.prototype.forEach.call(panggung.querySelectorAll(".kartu"), function(b){
    b.addEventListener("click", function(){
      ui.entriId = b.dataset.id; ui.view = "detail"; render(); window.scrollTo(0,0);
    });
  });
}

function cincin(s, n){
  return '<button class="cincin' + (n ? "" : " sepi") + '" type="button" data-id="' + esc(s.id) +
    '" style="--h:' + s.h + ';--h2:' + s.h2 + '" aria-current="' + (ui.stase === s.id ? "true" : "false") + '">' +
    '<span class="lingkar"><span class="isi">' + esc(s.kode) + "</span>" +
    (n ? '<span class="jml">' + n + "</span>" : "") + "</span>" +
    '<span class="cap">' + esc(s.nama) + "</span></button>";
}

function kartu(e, i){
  var st = cariStase(e.stase);
  var sk = skorSaya()[e.id];
  var h = '<article class="kartu kaca" data-id="' + esc(e.id) + '" tabindex="0" role="button" style="animation-delay:' + Math.min(i*40, 400) + 'ms">';
  h += '<div class="kartu-atas">';
  h += '<span class="tag-stase" style="--h:' + st.h + '"><span class="titik"></span>' + esc(st.kode) + "</span>";
  h += '<span class="tipe-pil">' + esc(labelTipe(e.tipe)) + "</span>";
  if(e.status === "menunggu") h += '<span class="status-pil menunggu">Menunggu tinjauan</span>';
  if(e.status === "dikembalikan") h += '<span class="status-pil dikembalikan">Dikembalikan</span>';
  h += "</div>";
  h += "<h3>" + esc(e.judul) + "</h3>";
  h += '<p class="cuplik">' + esc(ringkas(e.isi || ((e.soal||[]).length + " soal latihan"), 150)) + "</p>";
  if((e.tag || []).length){
    h += '<div class="tag-baris">';
    e.tag.slice(0,3).forEach(function(t){ h += '<span class="tag">' + esc(t) + "</span>"; });
    h += "</div>";
  }
  h += '<div class="kartu-kaki">';
  if(e.tanggal) h += "<span>" + esc(tgl(e.tanggal)) + "</span>";
  if(e.tipe === "kuis" && (e.soal||[]).length) h += "<span>" + e.soal.length + " soal</span>";
  if(sk) h += '<span class="skor">' + sk.terbaik + "/" + sk.dari + "</span>";
  h += "</div></article>";
  return h;
}

/* --- detail --- */

function viewDetail(){
  var e = cariEntri(ui.entriId);
  if(!e){ ui.view = "arsip"; return render(); }
  var st = cariStase(e.stase);
  var sk = skorSaya()[e.id];
  var bolehSunting = pemilik() || (kontributor() && punyaku(e));

  var h = bilahAtas();
  h += '<section class="lembar kaca">';
  h += '<button class="balik" id="balik" type="button">' + IKON.balik + "Arsip</button>";
  h += '<div class="kartu-atas">';
  h += '<span class="tag-stase" style="--h:' + st.h + '"><span class="titik"></span>' + esc(st.kode) + " \u00B7 " + esc(st.nama) + "</span>";
  h += '<span class="tipe-pil">' + esc(labelTipe(e.tipe)) + "</span>";
  if(e.status === "menunggu") h += '<span class="status-pil menunggu">Menunggu tinjauan</span>';
  if(e.status === "dikembalikan") h += '<span class="status-pil dikembalikan">Dikembalikan</span>';
  h += "</div>";
  h += '<h1 class="judul-besar">' + esc(e.judul) + "</h1>";
  h += '<p style="color:var(--redup);font-size:13.5px;margin:9px 0 0">' + esc(tgl(e.tanggal)) +
       (e.penulis && e.penulis !== "pemilik" ? " \u00B7 oleh " + esc(e.penulis) : "") + "</p>";

  if((e.tag || []).length){
    h += '<div class="tag-baris" style="margin-top:12px">';
    e.tag.forEach(function(t){ h += '<span class="tag">' + esc(t) + "</span>"; });
    h += "</div>";
  }

  if(e.status === "dikembalikan" && e.catatanTinjau){
    h += '<div style="margin-top:16px;padding:13px 16px;border-radius:var(--r-m);background:var(--buruk-latar)">';
    h += '<b style="font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--buruk)">Catatan peninjau</b>';
    h += '<p style="margin:6px 0 0;font-size:14px">' + esc(e.catatanTinjau) + "</p></div>";
  }

  h += '<div class="kotak-aksi" style="margin-top:18px">';
  if(e.tipe === "kuis" && (e.soal || []).length){
    h += '<button class="t utama" id="mulai" type="button">' + IKON.main + "Mulai kuis \u00B7 " + e.soal.length + " soal</button>";
  }
  if(bolehSunting) h += '<button class="t" id="sunting" type="button">Sunting</button>';
  if(pemilik()) h += '<button class="t bahaya" id="hapus" type="button">Hapus</button>';
  h += "</div>";

  if(sk){
    h += '<p style="margin:12px 0 0;font-size:13px;color:var(--redup)">Skor terbaik <b style="color:var(--baik)">' +
         sk.terbaik + "/" + sk.dari + "</b> \u00B7 terakhir " + sk.terakhir + "/" + sk.dari + "</p>";
  }

  h += "</section>";

  var kakiSumber = e.sumber
    ? '<p style="margin:26px 0 0;padding-top:15px;border-top:1px solid var(--garis);font-size:12.5px;color:var(--redup)"><b style="letter-spacing:.07em;text-transform:uppercase;font-size:11px">Sumber</b><br>' + esc(e.sumber) + "</p>"
    : "";

  var pecah = bagianIsi(e);
  if(pecah){
    if(ui.tabEntri !== e.id){ ui.tabEntri = e.id; ui.tab = 0; }
    if(ui.tab >= pecah.bagian.length) ui.tab = 0;

    h += '<section class="lembar kaca">';
    if(pecah.pengantar) h += '<div class="prosa" style="margin-bottom:20px">' + md(pecah.pengantar) + "</div>";
    h += '<div class="tab-bar" role="tablist" aria-label="Bagian materi">';
    pecah.bagian.forEach(function(bg, i){
      h += '<button class="tab-pil' + (i === ui.tab ? " nyala" : "") + '" type="button" role="tab"' +
           ' id="tab-' + i + '" aria-selected="' + (i === ui.tab ? "true" : "false") +
           '" aria-controls="panel-' + i + '" tabindex="' + (i === ui.tab ? "0" : "-1") +
           '" data-tab="' + i + '">' + esc(bg.judul) + "</button>";
    });
    h += "</div>";
    pecah.bagian.forEach(function(bg, i){
      h += '<div class="prosa tab-panel" role="tabpanel" id="panel-' + i + '" aria-labelledby="tab-' + i + '"' +
           (i === ui.tab ? "" : " hidden") + "><h2>" + esc(bg.judul) + "</h2>" + md(bg.isi) +
           bagianLampiran(e, bg.judul, true) + "</div>";
    });
    h += kakiSumber + "</section>";
  }
  else if(e.isi){
    h += '<section class="lembar kaca"><div class="prosa">' + md(e.isi) + "</div>" + kakiSumber + "</section>";
  }

  h += bagianLampiran(e);

  panggung.innerHTML = h;
  pasangCari();
  pasangLampiran(e);
  pasangTabIsi();

  document.getElementById("balik").addEventListener("click", function(){ ui.view = "arsip"; ui.entriId = null; render(); });
  var m = document.getElementById("mulai");
  if(m) m.addEventListener("click", function(){ mulaiKuis(e, null); });
  var s = document.getElementById("sunting");
  if(s) s.addEventListener("click", function(){ bukaEditor(e.id); });
  var hp = document.getElementById("hapus");
  if(hp) hp.addEventListener("click", async function(){
    if(!await tanya("Hapus entri ini?", '"' + e.judul + '" akan hilang dari arsip di browser ini. Tidak bisa dibatalkan.',
                    {ok:"Hapus", bahaya:true})) return;
    if(SERVER.ada){
      var jh = await srv("entriHapus", {id:e.id});
      if(jh.galat){ toast(jh.galat); return; }
      pasangArsipServer(jh.arsip);
      delete skorSaya()[e.id];
      simpanPribadi();
      ui.view = "arsip"; ui.entriId = null;
      render();
      toast("Entri dihapus di server.");
      return;
    }
    db.entri = db.entri.filter(function(x){ return x.id !== e.id; });
    delete skorSaya()[e.id];
    pribadi.klarifikasi = klarifikasiSaya().filter(function(k){ return k.entriId !== e.id; });
    simpan();
    simpanPribadi();
    ui.view = "arsip"; ui.entriId = null;
    render();
    toast("Entri dihapus.");
  });
}

/* =====================================================================
   9. Kuis
   ===================================================================== */

function acakLarik(a){
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function mulaiKuis(e, subset){
  var urut = (subset || e.soal.map(function(_, i){ return i; })).slice();
  if(pribadi.acakSoal !== false) acakLarik(urut);

  // Urutan pilihan diacak per soal, tapi dicatat supaya jawaban tetap
  // dipetakan ke indeks aslinya.
  var opsiUrut = {};
  urut.forEach(function(si){
    var u = (e.soal[si].opsi || []).map(function(_, k){ return k; });
    if(pribadi.acakOpsi !== false) acakLarik(u);
    opsiUrut[si] = u;
  });

  // jwb dan ragu dikunci indeks soal asli, bukan posisi, supaya tetap
  // benar saat peserta melompat bolak-balik lewat papan nomor.
  ui.kuis = {
    entriId:e.id,
    urut:urut, opsiUrut:opsiUrut,
    jwb:{}, ragu:{},
    pos:0, selesai:false
  };
  ui.view = "kuis";
  render();
  window.scrollTo(0,0);
}

function kuisBenar(k){
  var n = 0;
  for(var si in k.jwb){ if(k.jwb[si].benar) n++; }
  return n;
}
function kuisTerjawab(k){ return Object.keys(k.jwb).length; }
function kuisRagu(k){ return Object.keys(k.ragu).length; }

function catatSkor(e, k){
  var prev = skorSaya()[e.id];
  var dari = k.urut.length;
  var benar = kuisBenar(k);
  skorSaya()[e.id] = {
    terbaik: Math.max(benar, prev && prev.dari === dari ? prev.terbaik : 0),
    terakhir: benar,
    dari: dari,
    pada: hariIni()
  };
  simpanPribadi();
}

function tutupKuis(){
  ui.view = "detail";
  ui.entriId = ui.kuis ? ui.kuis.entriId : ui.entriId;
  ui.kuis = null;
  render();
  window.scrollTo(0,0);
}

function sudahiKuis(e, k){
  k.selesai = true;
  catatSkor(e, k);
  render();
  window.scrollTo(0,0);
}

/* Papan nomor soal: satu tombol per soal, warnanya menunjukkan status.
   Ini pengganti mekanisme lewati-lalu-dibuang-ke-belakang; peserta bebas
   melompat ke soal mana pun dan menandai yang masih ragu. */
function papanNomor(k){
  var h = '<nav class="navsoal" aria-label="Nomor soal">';
  k.urut.forEach(function(si, n){
    var j = k.jwb[si];
    var cls = "ns";
    if(j) cls += j.benar ? " ns-benar" : " ns-salah";
    if(k.ragu[si]) cls += " ns-ragu";
    if(n === k.pos) cls += " ns-kini";
    var ket = j ? (j.benar ? "sudah dijawab, benar" : "sudah dijawab, salah") : "belum dijawab";
    if(k.ragu[si]) ket += ", ditandai ragu-ragu";
    h += '<button type="button" class="' + cls + '" data-ke="' + n + '"' +
         (n === k.pos ? ' aria-current="true"' : "") +
         ' aria-label="Soal ' + (n + 1) + ", " + ket + '">' + (n + 1) + "</button>";
  });
  h += "</nav>";
  h += '<p class="nav-ket">' +
       '<span><i class="nk nk-benar"></i>benar</span>' +
       '<span><i class="nk nk-salah"></i>salah</span>' +
       '<span><i class="nk nk-ragu"></i>ragu-ragu</span>' +
       '<span><i class="nk"></i>belum dijawab</span></p>';
  return h;
}

function viewKuis(){
  var k = ui.kuis;
  var e = cariEntri(k.entriId);
  if(!e){ ui.view = "arsip"; return render(); }

  var h = "";
  var benar = kuisBenar(k);

  if(k.selesai){
    var total = k.urut.length;
    var dikerjakan = kuisTerjawab(k);
    var belum = total - dikerjakan;
    var pct = dikerjakan ? Math.round(benar / dikerjakan * 100) : 0;
    var kabar = pct === 100 ? "Sempurna!" : pct >= 80 ? "Mantap!" : pct >= 60 ? "Lumayan, lanjut" : "Ayo diulang";

    h += '<section class="hasil kaca">';
    h += '<div class="lingkaran" style="--p:' + pct + '"><b>' + pct + "%</b></div>";
    h += '<p class="kabar">' + kabar + "</p>";
    h += '<p class="rinci">' + benar + " benar dari " + dikerjakan + " yang dikerjakan" +
         (belum ? " \u00B7 " + belum + " soal tidak dijawab" : "") + "</p>";
    h += '<div class="aksi">';
    h += '<button class="t utama" id="ulang" type="button">Ulangi semua</button>';
    var salah = k.urut.filter(function(si){ return k.jwb[si] && !k.jwb[si].benar; });
    if(salah.length) h += '<button class="t" id="ulangSalah" type="button">Ulangi ' + salah.length + " yang salah</button>";
    var raguSisa = k.urut.filter(function(si){ return k.ragu[si]; });
    if(raguSisa.length) h += '<button class="t" id="ulangRagu" type="button">Ulangi ' + raguSisa.length + " yang ragu</button>";
    h += '<button class="t sunyi" id="keluar" type="button">Selesai</button>';
    h += "</div></section>";

    h += '<section class="lembar kaca"><h2 style="font-family:var(--f-tampil);font-size:21px;font-weight:800;letter-spacing:-.022em;margin:0 0 14px">Tinjauan jawaban</h2>';
    k.urut.forEach(function(si, n){
      var s = e.soal[si];
      var j = k.jwb[si];
      var warna = !j ? "var(--redup)" : j.benar ? "var(--baik)" : "var(--buruk)";
      var status = !j ? "tidak dijawab" : j.benar ? "benar" : "salah";
      if(k.ragu[si]) status += " \u00B7 ditandai ragu-ragu";
      h += '<div class="tinjau-item">';
      h += '<div class="sl" style="color:' + warna + '">Soal ' + (n + 1) + " \u00B7 " + status + "</div>";
      h += '<p class="qq">' + esc(s.q) + "</p>";
      h += '<p class="nn">Kunci: <b>' + esc(s.opsi[s.jawaban]) + "</b>";
      if(j && !j.benar) h += " \u00B7 Jawabanmu: " + esc(s.opsi[j.pilih]);
      h += "</p>";
      if(s.penjelasan) h += '<div class="prosa" style="font-size:14px">' + md(s.penjelasan) + "</div>";
      h += "</div>";
    });
    h += "</section>";

    panggung.innerHTML = h;
    document.getElementById("keluar").addEventListener("click", tutupKuis);
    document.getElementById("ulang").addEventListener("click", function(){ mulaiKuis(e, null); });
    var us = document.getElementById("ulangSalah");
    if(us) us.addEventListener("click", function(){ mulaiKuis(e, salah); });
    var ur = document.getElementById("ulangRagu");
    if(ur) ur.addEventListener("click", function(){ mulaiKuis(e, raguSisa); });
    return;
  }

  var si = k.urut[k.pos];
  var s = e.soal[si];
  var jwb = k.jwb[si] || null;
  var terjawab = jwb !== null;

  h += '<section class="lembar kaca">';
  h += '<button class="balik" id="balik" type="button">' + IKON.balik + "Keluar dari kuis</button>";
  h += '<div class="kuis-atas">';
  h += '<span class="kuis-rel"><span class="kuis-isi" style="width:' + (kuisTerjawab(k) / k.urut.length * 100) + '%"></span></span>';
  h += '<span class="kuis-skor">' + benar + "/" + k.urut.length + "</span>";
  h += "</div>";

  h += papanNomor(k);

  h += '<p class="soal-teks"><span class="soal-no">Soal ' + (k.pos + 1) + " dari " + k.urut.length +
       (k.ragu[si] ? " \u00B7 ditandai ragu-ragu" : "") + "</span><br>" + esc(s.q) + "</p>";

  h += '<div class="opsi-daftar">';
  var urutOpsi = k.opsiUrut[si] || s.opsi.map(function(_, x){ return x; });
  urutOpsi.forEach(function(asli, tampil){
    var cls = "opsi";
    var cap = "";
    if(terjawab){
      if(asli === s.jawaban){ cls += " benar"; cap = "kunci"; }
      else if(asli === jwb.pilih){ cls += " salah"; cap = "pilihanmu"; }
    }
    h += '<button class="' + cls + '" type="button" data-i="' + asli + '"' + (terjawab ? " disabled" : "") + ">";
    h += '<span class="hrf">' + String.fromCharCode(65 + tampil) + "</span><span>" + esc(s.opsi[asli]) + "</span>";
    if(cap) h += '<span class="cap-k">' + cap + "</span>";
    h += "</button>";
  });
  h += "</div>";

  if(terjawab){
    var ditandai = klarifikasiSaya().some(function(x){ return x.entriId === e.id && x.qi === si; });
    h += '<div class="bahas kaca">';
    h += '<div class="bahas-kepala"><span class="bahas-lencana ' + (jwb.benar ? "ya" : "tidak") + '">' +
         (jwb.benar ? "Benar" : "Belum tepat") + '</span><span class="cap">Pembahasan</span></div>';
    h += '<div class="prosa">' + (s.penjelasan ? md(s.penjelasan) : "<p><em>Belum ada pembahasan untuk soal ini.</em></p>") + "</div>";
    h += '<div class="bahas-kaki">';
    h += '<button class="t kcl" id="tandai" type="button"' + (ditandai ? " disabled" : "") + ">" +
         (ditandai ? "Sudah ditandai" : "Tandai untuk klarifikasi") + "</button>";
    h += "</div></div>";
  }

  h += '<div class="kuis-kemudi">';
  h += '<button class="t" id="mundur" type="button"' + (k.pos === 0 ? " disabled" : "") + ">" +
       "\u2190 Sebelumnya</button>";
  h += '<button class="t' + (k.ragu[si] ? " ragu-nyala" : "") + '" id="ragu" type="button" aria-pressed="' +
       (k.ragu[si] ? "true" : "false") + '">' + (k.ragu[si] ? "Batal ragu-ragu" : "Ragu-ragu") + "</button>";
  h += '<button class="t utama" id="maju" type="button"' + (k.pos + 1 >= k.urut.length ? " disabled" : "") + ">" +
       "Selanjutnya \u2192</button>";
  h += '<button class="t sunyi" id="sudahi" type="button">Selesai</button>';
  h += "</div>";
  h += '<p class="kuis-rekap">' + kuisTerjawab(k) + " dari " + k.urut.length + " terjawab" +
       (kuisRagu(k) ? " \u00B7 " + kuisRagu(k) + " ditandai ragu-ragu" : "") + "</p>";

  h += "</section>";
  panggung.innerHTML = h;

  document.getElementById("balik").addEventListener("click", tutupKuis);

  function keSoal(n){
    if(n < 0 || n >= k.urut.length || n === k.pos) return;
    k.pos = n;
    render();
    window.scrollTo(0,0);
  }

  Array.prototype.forEach.call(panggung.querySelectorAll("[data-ke]"), function(b){
    b.addEventListener("click", function(){ keSoal(Number(b.dataset.ke)); });
  });

  Array.prototype.forEach.call(panggung.querySelectorAll(".opsi"), function(b){
    b.addEventListener("click", function(){
      if(k.jwb[si]) return;
      var i = Number(b.dataset.i);
      k.jwb[si] = {pilih:i, benar:i === s.jawaban};
      render();
    });
  });

  document.getElementById("mundur").addEventListener("click", function(){ keSoal(k.pos - 1); });
  document.getElementById("maju").addEventListener("click", function(){ keSoal(k.pos + 1); });

  document.getElementById("ragu").addEventListener("click", function(){
    if(k.ragu[si]) delete k.ragu[si]; else k.ragu[si] = true;
    render();
  });

  document.getElementById("sudahi").addEventListener("click", async function(){
    var sisa = k.urut.length - kuisTerjawab(k);
    var ragu = kuisRagu(k);
    if(sisa || ragu){
      var rincian = [];
      if(sisa) rincian.push(sisa + " soal belum dijawab");
      if(ragu) rincian.push(ragu + " soal ditandai ragu-ragu");
      if(!await tanya("Sudahi kuis sekarang?",
            "Masih ada " + rincian.join(" dan ") + ". Soal yang belum dijawab tidak dihitung benar.",
            {ok:"Sudahi"})) return;
    }
    sudahiKuis(e, k);
  });

  var td = document.getElementById("tandai");
  if(td) td.addEventListener("click", async function(){
    var catatan = await mintaTeks("Tandai untuk klarifikasi",
      "Apa yang mengganjal?",
      {pesan:"Boleh dikosongkan kalau cukup ditandai saja.", placeholder:"mis. kuncinya kayaknya B, bukan C",
       ok:"Tandai"});
    if(catatan === null) return;
    klarifikasiSaya().push({id:idBaru("k"), entriId:e.id, qi:si, catatan:catatan.trim(), pada:hariIni()});
    simpanPribadi();
    render();
    toast("Ditandai. Lihat daftarnya di menu Alat.");
  });
}
