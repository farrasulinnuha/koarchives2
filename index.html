    var yatim = semua.filter(function(c){ return !sahId[c.stase]; }).length;
    if(yatim){
      h += '<button class="ct-chip' + (ui.catatanStase === CT_LAIN ? " nyala" : "") +
           '" type="button" data-ct-lain="1">Tanpa stase <b>' + yatim + "</b></button>";
    }
    h += "</div>";
  }
  h += "</section>";

  if(!l.length){
    h += '<section class="kotak kaca"><div class="sepi-kotak" style="padding:32px"><b>' +
         (semua.length ? "Tidak ada yang cocok" : "Belum ada catatan") + "</b><span>" +
         (semua.length ? "Coba ganti kata kunci atau pilih stase lain."
                       : "Tulis apa saja \u2014 rangkuman visite, tips penguji, daftar obat yang sering ditanya.") +
         "</span></div></section>";
  }

  l.forEach(function(c){
    var st = cariStase(c.stase);
    h += '<section class="kotak kaca ct-kartu">';
    h += '<div class="ct-kepala"><span class="ct-stase" style="--sw:hsl(' + (st.h || 270) + ' 70% 55%)">' +
         esc(st.kode === "?" ? "\u2013" : st.kode) + "</span>";
    h += '<h2 class="ct-judul">' + esc(c.judul) + "</h2></div>";
    h += '<div class="prosa ct-isi">' + md(c.isi || "") + "</div>";
    h += '<div class="ct-kaki"><span class="ct-waktu">' +
         (c.diubah && c.diubah !== c.pada ? "diubah " + esc(c.diubah) : esc(c.pada || "")) + "</span>";
    h += '<span class="ct-aksi"><button class="t kcl" type="button" data-ct-ubah="' + esc(c.id) + '">Ubah</button>';
    h += '<button class="t kcl" type="button" data-ct-hapus="' + esc(c.id) + '">Hapus</button></span></div>';
    h += "</section>";

  panggung.innerHTML = h;
  pasangCari();
  pasangCatatan();

/* =====================================================================
   11e. Checklist berkas per stase, dipecah per rumah sakit
   ===================================================================== */

/* Checklist berkas sepenuhnya milik tiap akun: daftarnya maupun
   centangnya. Sempat dibuat milik bersama, tapi itu salah \u2014 syarat
   berkas berbeda antar orang, dan daftar satu akun terlihat di akun lain. */
function daftarBerkas(){
  if(!Array.isArray(pribadi.berkas)) pribadi.berkas = [];
  return pribadi.berkas;
}

/* Pindahan sekali jalan dari masa checklist masih milik bersama. Hanya
   untuk pemilik, yang dulu menyusunnya; akun lain tidak boleh ikut
   mewarisi daftar orang lain. */
function pindahBerkasLama(){
  if(!pemilik()) return;
  if(!Array.isArray(db.berkas) || !db.berkas.length) return;

  // Menyalin hanya sekali, supaya daftar pribadi yang sudah disunting tidak
  // ketimpa; tapi mengosongkan salinan bersamanya SELALU, karena selama
  // kunci itu masih terisi, akun lain tetap menerimanya dari server.
  if(!daftarBerkas().length){
    pribadi.berkas = db.berkas.map(function(b){ return Object.assign({}, b); });
    simpanPribadi();
  }
  db.berkas = [];
  simpan();
  if(SERVER.ada) dorongAtur();
}

function berkasStase(){
  var urut = [];
  var lihat = {};
  daftarBerkas().forEach(function(b){
    if(lihat[b.stase]) return;
    lihat[b.stase] = true;
    urut.push(b.stase);
  });
  return urut;
}

function viewBerkas(){
  var semua = daftarBerkas();
  var stasePakai = berkasStase();
  if(ui.berkasStase && stasePakai.indexOf(ui.berkasStase) === -1) ui.berkasStase = null;
  var aktif = ui.berkasStase || stasePakai[0] || null;

  var h = bilahAtas();
  h += '<section class="lembar kaca"><h1 class="judul-besar">Checklist berkas</h1>';
  h += '<p style="color:var(--redup);font-size:14px;margin:10px 0 0;max-width:62ch">Syarat berkas tiap stase, dipisah per rumah sakit. Seluruhnya milik akunmu sendiri \u2014 daftar maupun centangnya tidak terlihat oleh siapa pun, termasuk pemilik arsip.</p>';
  h += '<div class="kotak-aksi"><button class="t utama" id="bkTambah" type="button">+ Berkas</button>';
  h += '<button class="t" id="bkPemicu" type="button">Salin pemicu</button>';
  h += '<button class="t" id="bkTempel" type="button">Tempel dari AI</button></div>';

  if(stasePakai.length){
    h += '<div class="ct-saring">';
    stasePakai.forEach(function(id){
      var st = cariStase(id);
      var punya = semua.filter(function(b){ return b.stase === id; });
      var usai = punya.filter(function(b){ return berkasSelesai()[b.id]; }).length;
      h += '<button class="ct-chip' + (id === aktif ? " nyala" : "") +
           '" type="button" data-bk-stase="' + esc(id) + '">' + esc(st.nama) +
           " <b>" + usai + "/" + punya.length + "</b></button>";
    });
    h += "</div>";
  }
  h += "</section>";

  if(!semua.length){
    h += '<section class="kotak kaca"><div class="sepi-kotak" style="padding:32px"><b>Belum ada checklist</b><span>' +
         "Tambahkan syarat berkas pertama, misalnya logbook atau laporan kasus. Atau salin pemicunya, minta Claude menyusunkan, lalu tempel hasilnya." + "</span></div></section>";
    panggung.innerHTML = h;
    pasangCari();
    pasangBerkas();
    return;
  }

  var isiStase = semua.filter(function(b){ return b.stase === aktif; });
  var rs = [];
  var lihatRs = {};
  isiStase.forEach(function(b){
    var nama = b.rs || "Tanpa rumah sakit";
    if(lihatRs[nama]) return;
    lihatRs[nama] = true;
    rs.push(nama);
  });
  rs.sort();

  rs.forEach(function(nama){
    var punya = isiStase.filter(function(b){ return (b.rs || "Tanpa rumah sakit") === nama; });
    var usai = punya.filter(function(b){ return berkasSelesai()[b.id]; }).length;
    var pct = punya.length ? Math.round(usai / punya.length * 100) : 0;

    h += '<section class="kotak kaca">';
    h += '<div class="bk-kepala"><h2>' + esc(nama) + "</h2>";
    h += '<span class="bk-kanan">';
    h += '<button class="t kcl" type="button" data-bk-namai="' + esc(nama) + '">Ganti nama</button>';
    h += '<span class="bk-hitung' + (usai === punya.length ? " bk-kelar" : "") + '">' + usai + " / " + punya.length + "</span></span></div>";
    h += '<div class="bk-bilah"><span style="width:' + pct + '%"></span></div>';
    h += '<ul class="bk-daftar">';
    punya.forEach(function(b){
      var ok = berkasSelesai()[b.id] === true;
      h += '<li class="bk-item' + (ok ? " bk-usai" : "") + '">';
      h += '<button class="ag-centang" type="button" data-bk-usai="' + esc(b.id) + '" role="checkbox" aria-checked="' +
           (ok ? "true" : "false") + '" aria-label="Tandai ' + esc(b.judul) + ' selesai">' + (ok ? "\u2713" : "") + "</button>";
      h += '<div class="ag-isi"><div class="ag-judul">' + esc(b.judul) + "</div>";
      if(b.catatan) h += '<div class="ag-catatan">' + esc(b.catatan) + "</div>";
      h += "</div>";
      h += '<div class="ag-aksi"><button class="t kcl" type="button" data-bk-salin="' + esc(b.id) + '">Duplikat</button>';
      h += '<button class="t kcl" type="button" data-bk-ubah="' + esc(b.id) + '">Ubah</button>';
      h += '<button class="t kcl" type="button" data-bk-hapus="' + esc(b.id) + '">Hapus</button></div>';
      h += "</li>";
    });
    h += "</ul></section>";
  });

  panggung.innerHTML = h;
  pasangCari();
  pasangBerkas();
}

async function formBerkas(awal){
  var b = awal || {judul:"", stase:(semuaStase()[0] || {}).id || "ipd", rs:"", catatan:""};
  // Rumah sakit yang sudah pernah dipakai ditawarkan lagi supaya namanya
  // tidak tertulis beda-beda dan berkasnya terpecah jadi dua kelompok.
  var rsPernah = [];
  daftarBerkas().forEach(function(x){
    if(x.rs && rsPernah.indexOf(x.rs) === -1) rsPernah.push(x.rs);
  });

  var isi =
    '<label class="dl">Nama berkas</label>' +
    '<input id="bkJudul" type="text" maxlength="160" value="' + esc(b.judul) + '" placeholder="mis. Logbook tindakan">' +

/* Kedua penempel di bawah menulis ke ember pribadi, jadi tidak lewat
   imporJson() yang khusus entri arsip. */
function bacaJsonTempel(teks){
  var t = String(teks || "").trim();
  if(!t) return {galat:"Kotaknya masih kosong."};
  var pagar = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if(pagar) t = pagar[1].trim();
  var data;
  try{ data = JSON.parse(t); }
  catch(err){ return {galat:"JSON tidak terbaca: " + err.message}; }
  var arr = Array.isArray(data) ? data : [data];
  return {arr:arr};
}

async function tempelBerkas(){
  var teks = await mintaTeks("Tempel checklist dari AI", "JSON hasil AI",
    {banyakBaris:true, ok:"Masukkan",
     placeholder:'[{"judul":"Logbook tindakan","stase":"ipd","rs":"RSUP Sardjito","catatan":"min. 10 tindakan"}]'});
  if(teks === null) return;
  var b = bacaJsonTempel(teks);
  if(b.galat) return beritahu("Gagal membaca", b.galat);

  var sah = {};
  semuaStase().forEach(function(x){ sah[x.id] = true; });
  var masuk = 0, lewat = 0;
  b.arr.forEach(function(o){
    if(!o || !o.judul){ lewat++; return; }
    daftarBerkas().push({
      id: idBaru("bk"),
      judul: String(o.judul).slice(0, 160),
      stase: sah[o.stase] ? o.stase : (semuaStase()[0] || {}).id,
      rs: o.rs ? String(o.rs).slice(0, 120) : "",
      catatan: o.catatan ? String(o.catatan).slice(0, 240) : ""
    });
    masuk++;
  });
  if(!masuk) return beritahu("Tidak ada yang masuk", "Setiap butir butuh \u201Cjudul\u201D.");
  simpanPribadi();
  render();
  toast(masuk + " berkas ditambahkan" + (lewat ? ", " + lewat + " dilewati" : "") + ".");
}

async function tempelJadwal(){
  var teks = await mintaTeks("Tempel jadwal dari AI", "JSON hasil AI",
    {banyakBaris:true, ok:"Masukkan",
     placeholder:'[{"judul":"Jaga malam IGD","tanggal":"2026-08-20","jam":"19:00","jenis":"jaga"}]'});
  if(teks === null) return;
  var b = bacaJsonTempel(teks);
  if(b.galat) return beritahu("Gagal membaca", b.galat);

  var jenisSah = {};
  JENIS_AGENDA.forEach(function(j){ jenisSah[j.id] = true; });
  var masuk = 0, lewat = 0;
  b.arr.forEach(function(o){
    if(!o || !o.judul || !/^\d{4}-\d{2}-\d{2}$/.test(String(o.tanggal || ""))){ lewat++; return; }
    agendaSaya().push({
      id: idBaru("ag"),
      judul: String(o.judul).slice(0, 160),
      tanggal: String(o.tanggal),
      jam: /^\d{2}:\d{2}$/.test(String(o.jam || "")) ? String(o.jam) : "",
      jenis: jenisSah[o.jenis] ? o.jenis : "acara",
      catatan: o.catatan ? String(o.catatan).slice(0, 200) : "",
      selesai: false
    });
    masuk++;
  });
  if(!masuk) return beritahu("Tidak ada yang masuk", "Setiap butir butuh \u201Cjudul\u201D dan \u201Ctanggal\u201D format YYYY-MM-DD.");
  simpanPribadi();
  render();
  toast(masuk + " pengingat ditambahkan" + (lewat ? ", " + lewat + " dilewati" : "") + ".");
}

function pasangBerkas(){
  var bp = document.getElementById("bkPemicu");
  if(bp) bp.addEventListener("click", function(){ salin(promptBerkas(), "Pemicu checklist disalin."); });
  var bt = document.getElementById("bkTempel");
  if(bt) bt.addEventListener("click", tempelBerkas);

  Array.prototype.forEach.call(panggung.querySelectorAll("[data-bk-stase]"), function(b){
    b.addEventListener("click", function(){ ui.berkasStase = b.dataset.bkStase; render(); });
  });

  Array.prototype.forEach.call(panggung.querySelectorAll("[data-bk-usai]"), function(b){
    b.addEventListener("click", function(){
      var m = berkasSelesai();
      var id = b.dataset.bkUsai;
      if(m[id]) delete m[id]; else m[id] = true;
      simpanPribadi();
      render();
    });
  });

  Array.prototype.forEach.call(panggung.querySelectorAll("[data-bk-namai]"), function(b){
    b.addEventListener("click", async function(){
      var lama = b.dataset.bkNamai;
      var baru = await mintaTeks("Ganti nama rumah sakit", "Nama baru",
        {nilai: lama === "Tanpa rumah sakit" ? "" : lama, ok:"Ganti",
         pesan:"Semua berkas di kelompok ini ikut berpindah.",
         placeholder:"mis. RSUP Dr. Sardjito"});
      if(baru === null) return;
      baru = baru.trim();
      // Nama kosong berarti kembali ke kelompok tanpa rumah sakit.
      var jadi = baru;
      var kena = 0;
      daftarBerkas().forEach(function(x){
        if((x.rs || "Tanpa rumah sakit") !== lama) return;
        x.rs = jadi;
        kena++;
      });
      if(!kena) return;
      simpanPribadi();
      render();
      toast(kena + " berkas dipindahkan ke " + (jadi || "tanpa rumah sakit") + ".");
    });
  });

  var tb = document.getElementById("bkTambah");
  if(tb) tb.addEventListener("click", async function(){
    var n = await formBerkas(null);
    if(!n) return;
    daftarBerkas().push({id:idBaru("bk"), judul:n.judul, stase:n.stase, rs:n.rs, catatan:n.catatan});
    ui.berkasStase = n.stase;
    simpanPribadi();
    render();
    toast("Berkas ditambahkan.");
  });

  Array.prototype.forEach.call(panggung.querySelectorAll("[data-bk-ubah]"), function(b){
    b.addEventListener("click", async function(){
      var it = daftarBerkas().filter(function(x){ return x.id === b.dataset.bkUbah; })[0];
      if(!it) return;
      var n = await formBerkas(it);
      if(!n) return;
      it.judul = n.judul; it.stase = n.stase; it.rs = n.rs; it.catatan = n.catatan;
      ui.berkasStase = n.stase;
      simpanPribadi();
      render();
      toast("Berkas diperbarui.");
    });
  });

  Array.prototype.forEach.call(panggung.querySelectorAll("[data-bk-salin]"), function(b){
    b.addEventListener("click", async function(){
      var it = daftarBerkas().filter(function(x){ return x.id === b.dataset.bkSalin; })[0];
      if(!it) return;
      // Salinan mulai belum tercentang: berkas yang sama di RS lain tentu
      // belum tentu sudah diurus juga.
      var n = await formBerkas({judul:it.judul, stase:it.stase, rs:it.rs, catatan:it.catatan});
      if(!n) return;
      daftarBerkas().push({id:idBaru("bk"), judul:n.judul, stase:n.stase, rs:n.rs, catatan:n.catatan});
      ui.berkasStase = n.stase;
      simpanPribadi();
      render();
      toast("Berkas diduplikat.");
    });
  });

  Array.prototype.forEach.call(panggung.querySelectorAll("[data-bk-hapus]"), function(b){
    b.addEventListener("click", async function(){
      var it = daftarBerkas().filter(function(x){ return x.id === b.dataset.bkHapus; })[0];
      if(!it) return;
      if(!await tanya("Hapus dari checklist?",
            "\u201C" + it.judul + "\u201D akan hilang untuk semua akun, termasuk centang yang sudah mereka isi.",
            {ok:"Hapus", bahaya:true})) return;
      pribadi.berkas = daftarBerkas().filter(function(x){ return x.id !== it.id; });
      delete berkasSelesai()[it.id];
      simpanPribadi();
      render();
      toast("Berkas dihapus.");
    });
  });
}

    h += '<input type="number" min="0" max="4" step="0.05" value="' + esc(sk.poin) + '" data-skala="' + i + '" data-f="poin" aria-label="Bobot poin" style="padding:7px 9px;border-radius:9px;border:1px solid var(--garis);background:rgba(var(--kaca),.6);text-align:center">';
    h += "</div>";
  });
  h += "</div>";
  // Menyunting 14 baris dengan tangan gampang membuat ambangnya tumpang
  // tindih; kalau dibiarkan diam, nilainya salah tanpa ketahuan.
  var kacau = [];
  for(var iz = 1; iz < d.skala.length; iz++){
    if(Number(d.skala[iz].min) >= Number(d.skala[iz - 1].min)){
      kacau.push(esc(d.skala[iz].huruf) + " vs " + esc(d.skala[iz - 1].huruf));
    }
  }
  if(kacau.length){
    h += '<p class="skala-awas">Batas nilai perlu menurun dari atas ke bawah. Yang bertabrakan: ' +
         kacau.join(", ") + ".</p>";
  }
  h += '<div class="kotak-aksi"><button class="t" id="skalaBawaan" type="button">Kembalikan bawaan</button>';
  h += '<span style="font-size:13px;color:var(--redup);align-self:center">Batas lulus: </span>';
  h += '<select id="skalaLulus" style="width:120px;padding:7px 10px;border-radius:9px;border:1px solid var(--garis);background:rgba(var(--kaca),.6);font-weight:700">' + opsiHuruf(d.lulus, "\u2013") + "</select>";
  h += "</div></section>";


  panggung.innerHTML = h;
  pasangCari();
  pasangIpk();
}

function cariMk(id){
  var hasil = null;
  ipkData().semester.forEach(function(sm){
    (sm.mk || []).forEach(function(m){ if(m.id === id) hasil = m; });
  });
  return hasil;
}

function pasangIpk(){
  function simpanUlang(){ simpanPribadi(); render(); }

  Array.prototype.forEach.call(panggung.querySelectorAll(".sm-nama"), function(el){
    el.addEventListener("change", function(){
      var sm = ipkData().semester.filter(function(x){ return x.id === el.dataset.sm; })[0];
      if(sm){ sm.nama = el.value; simpanPribadi(); }
    });
  });

  Array.prototype.forEach.call(panggung.querySelectorAll("[data-mk][data-f]"), function(el){
    if(el.dataset.komp) return;
    var ev = el.tagName === "SELECT" ? "change" : "input";
    el.addEventListener(ev, function(){
      var m = cariMk(el.dataset.mk);
      if(!m) return;
      var f = el.dataset.f;
      m[f] = (f === "sks") ? (el.value === "" ? "" : Number(el.value)) : el.value;
      if(f === "nilai" || f === "sim" || f === "target"){ simpanUlang(); }
      else simpanPribadi();
    });
  });

  Array.prototype.forEach.call(panggung.querySelectorAll("[data-komp]"), function(el){
    if(!el.dataset.f) return;
    el.addEventListener("input", function(){
      var m = cariMk(el.dataset.mk);
      if(!m) return;
      var k = (m.komp || []).filter(function(x){ return x.id === el.dataset.komp; })[0];
      if(!k) return;
      var f = el.dataset.f;
      k[f] = (f === "nama") ? el.value : (el.value === "" ? "" : Number(el.value));
      simpanPribadi();
    });
  });

  Array.prototype.forEach.call(panggung.querySelectorAll("[data-buka-mk]"), function(b){
    b.addEventListener("click", function(){
      var m = cariMk(b.dataset.bukaMk);
      if(m){ m.buka = !m.buka; simpanUlang(); }
    });
  });

  Array.prototype.forEach.call(panggung.querySelectorAll("[data-tambah-mk]"), function(b){
    b.addEventListener("click", function(){
      var sm = ipkData().semester.filter(function(x){ return x.id === b.dataset.tambahMk; })[0];
      if(!sm) return;
      if(!sm.mk) sm.mk = [];
      sm.mk.push(mkBaru());
      simpanUlang();
    });
  });

  Array.prototype.forEach.call(panggung.querySelectorAll("[data-hapus-mk]"), function(b){
    b.addEventListener("click", async function(){
      var m = cariMk(b.dataset.hapusMk);
      if(!await tanya("Hapus mata kuliah?", '"' + ((m && m.nama) || "Mata kuliah ini") + '" akan dihapus dari semester ini.',
                      {ok:"Hapus", bahaya:true})) return;
      ipkData().semester.forEach(function(sm){
        sm.mk = (sm.mk || []).filter(function(x){ return x.id !== b.dataset.hapusMk; });
      });
      simpanUlang();
    });
  });

  Array.prototype.forEach.call(panggung.querySelectorAll("[data-hapus-sm]"), function(b){
    b.addEventListener("click", async function(){
      if(!await tanya("Hapus semester?", "Semester ini beserta seluruh mata kuliah di dalamnya akan dihapus.",
                      {ok:"Hapus", bahaya:true})) return;
      ipkData().semester = ipkData().semester.filter(function(x){ return x.id !== b.dataset.hapusSm; });
      simpanUlang();
    });
  });

  Array.prototype.forEach.call(panggung.querySelectorAll("[data-pola]"), function(b){
    b.addEventListener("click", async function(){
      var m = cariMk(b.dataset.mk);
      if(!m) return;
      if((m.komp || []).length &&
         !await tanya("Ganti komponen?", "Komponen yang sudah ada di mata kuliah ini akan ditimpa pola baru.",
                      {ok:"Ganti"})) return;
      m.komp = POLA_KOMP[b.dataset.pola].map(function(p){
        return {id:idBaru("kp"), nama:p[0], bobot:p[1], skor:""};
      });
      simpanUlang();
    });
  });

  Array.prototype.forEach.call(panggung.querySelectorAll("[data-tambah-komp]"), function(b){
    b.addEventListener("click", function(){
      var m = cariMk(b.dataset.tambahKomp);
      if(!m) return;
      if(!m.komp) m.komp = [];
      m.komp.push({id:idBaru("kp"), nama:"", bobot:0, skor:""});
      simpanUlang();
    });
  });

  Array.prototype.forEach.call(panggung.querySelectorAll("[data-hapus-komp]"), function(b){
    b.addEventListener("click", function(){
      var m = cariMk(b.dataset.mk);
      if(!m) return;
      m.komp = (m.komp || []).filter(function(x){ return x.id !== b.dataset.hapusKomp; });
      simpanUlang();
    });
  });

  Array.prototype.forEach.call(panggung.querySelectorAll("[data-skala]"), function(el){
    el.addEventListener("input", function(){
      var d = ipkData();
      var baris = d.skala[Number(el.dataset.skala)];
      if(!baris) return;
      var f = el.dataset.f;
      if(f === "huruf") baris.huruf = el.value;
      else baris[f] = el.value === "" ? 0 : Number(el.value);
      simpanPribadi();
    });
    // Angka baru mengubah semua hitungan, jadi digambar ulang saat selesai.
    el.addEventListener("change", function(){ render(); });
  });

  var slLulus = document.getElementById("skalaLulus");
  if(slLulus) slLulus.addEventListener("change", function(){
    ipkData().lulus = slLulus.value;
    simpanPribadi(); render();
  });

  var slBawaan = document.getElementById("skalaBawaan");
  if(slBawaan) slBawaan.addEventListener("click", async function(){
    if(!await tanya("Kembalikan skala nilai ke bawaan?",
          "Semua batas huruf dan bobot poin yang kamu ubah akan kembali ke setelan awal.",
          {ok:"Kembalikan"})) return;
    ipkData().skala = ipkKosong().skala;
    simpanPribadi(); render();
    toast("Skala nilai dikembalikan.");
  });

  document.getElementById("tambahSm").addEventListener("click", function(){
    var d = ipkData();
    d.semester.push({id:idBaru("sm"), nama:"Semester " + (d.semester.length + 1), mk:[]});
    simpanUlang();
  });

  document.getElementById("ipkEkspor").addEventListener("click", function(){
    unduh("tracker-ipk-" + (penggunaAkun() || "saya") + "-" + hariIni() + ".json", JSON.stringify(ipkData(), null, 2));
  });

  document.getElementById("ipkImpor").addEventListener("click", async function(){
    var t = await mintaTeks("Pulihkan data IPK", "Isi berkas cadangan (.json)",
      {pesan:"Buka berkas cadanganmu dengan editor teks, lalu tempel seluruh isinya di sini.",
       banyakBaris:true, ok:"Pulihkan"});
    if(t === null) return;
    try{
      var j = JSON.parse(t);
      if(!j || !Array.isArray(j.semester)) throw new Error("Bentuknya tidak dikenali");
      pribadi.ipk = j;
      simpanPribadi();
      render();
      toast("Data IPK dipulihkan.");
    }catch(err){ toast("Gagal memulihkan: " + err.message); }
  });
}

  h += '<div class="kotak-aksi" style="margin-top:0">';
  h += '<button class="t" id="buatVerifikasi" type="button">Buat nilai AKUN_VERIFIKASI</button>';
  h += '<button class="t sunyi" id="lihatPerangkat" type="button">Lihat perangkat terdaftar</button></div>';

  h += '<div id="bundelKotak" style="display:none;margin-top:16px">';

  h += '<div class="b"><label for="bundelTeks">Bundel terkunci</label><textarea id="bundelTeks" class="mono" readonly style="min-height:150px"></textarea>';
  h += '<span class="bantu">Kirim ini ke Claude untuk ditanam ke dalam website lalu diterbitkan ulang. Selama belum ditanam, situs masih terbuka.</span></div>';

  h += '<button class="t" id="unduhBundel" type="button">Unduh bundel</button></div></div>';
  h += "</section>";
  }

  // --- sandi ---
  h += '<section class="kotak kaca"><h2>Sandi mode terbuka</h2>';
  h += "<p>Dipakai hanya selama arsip masih <b>terbuka</b>. Begitu arsip dikunci, yang berlaku adalah kode akses di atas, dan peran ikut menempel pada kodenya. Sandi di sini menyembunyikan tombol, bukan data \u2014 selama arsip belum dikunci, siapa pun yang punya tautannya bisa membaca sumber halaman. Jangan simpan data pasien yang bisa diidentifikasi.</p>";
  h += '<div class="borang">';
  h += '<div class="borang-kisi">';
  h += '<div class="b"><label for="sLama">Sandi pemilik sekarang</label><input id="sLama" type="password" autocomplete="current-password"></div>';
  h += '<div class="b"><label for="sBaru">Sandi pemilik baru</label><input id="sBaru" type="password" autocomplete="new-password" placeholder="kosongkan bila tidak diubah"></div>';
  h += "</div>";
  h += '<div class="b"><label for="sKontrib">Sandi kontributor baru</label><input id="sKontrib" type="password" autocomplete="new-password" placeholder="kosongkan bila tidak diubah"></div>';
  h += '<div class="kotak-aksi"><button class="t utama" id="gantiSandi" type="button">Simpan sandi</button></div>';
  h += "</div></section>";

  panggung.innerHTML = h;
  pasangCari();
  pasangAtur();
}

async function pasangAkunServerUi(){
  var kotak = document.getElementById("daftarAkunServer");
  if(!kotak) return;

  async function gambarDaftar(){
    var j = await srv("akunDaftar", {});
    var el = document.getElementById("daftarAkunServer");
    if(!el) return;
    if(j.galat){ el.innerHTML = '<p style="color:var(--buruk);font-size:13.5px">' + esc(j.galat) + "</p>"; return; }

    var h = "";
    (j.akun || []).forEach(function(a){
      h += '<div class="tinjau-item"' + (a.aktif === false ? ' style="opacity:.55"' : "") + ">";
      h += '<div class="sl">' + esc(a.peran) + " &middot; " +
           esc(a.tingkat === "publik" ? "akses publik" : "akses penuh") +
           (a.ai ? " &middot; boleh pakai Claude" : "") +
           (a.exp ? " &middot; sampai " + esc(tgl(a.exp)) : "") +
           (a.aktif === false ? " &middot; NONAKTIF" : "") + "</div>";
      h += '<p class="qq">' + esc(a.nama || a.pengguna) + "</p>";
      h += '<p class="nn" style="font-family:var(--f-mono);font-size:13px">' + esc(a.pengguna) + "</p>";
      h += '<div class="kotak-aksi" style="margin-top:8px">';
      h += '<button class="t kcl" data-isi-akun="' + esc(a.pengguna) + '" type="button">Sunting</button>';
      h += '<button class="t kcl" data-togel-akun="' + esc(a.pengguna) + '" data-aktif="' + (a.aktif === false ? "0" : "1") +
           '" type="button">' + (a.aktif === false ? "Aktifkan" : "Nonaktifkan") + "</button>";
      if(a.pengguna !== penggunaAkun()){
        h += '<button class="t kcl bahaya" data-hapus-akun="' + esc(a.pengguna) + '" type="button">Hapus</button>';
      }
      h += "</div></div>";
    });
    if(!(j.akun || []).length) h = '<p style="color:var(--redup);font-size:13.5px">Belum ada akun lain.</p>';
    el.innerHTML = h;

    var petaAkun = {};
    (j.akun || []).forEach(function(a){ petaAkun[a.pengguna] = a; });

    Array.prototype.forEach.call(el.querySelectorAll("[data-isi-akun]"), function(b){
      b.addEventListener("click", function(){
        var a = petaAkun[b.dataset.isiAkun];
        if(!a) return;
        document.getElementById("sNama").value = a.nama || "";
        document.getElementById("sPengguna").value = a.pengguna;
        document.getElementById("sPeran").value = a.peran;
        document.getElementById("sTingkat").value = a.tingkat;
        document.getElementById("sExp").value = a.exp || "";
        document.getElementById("sAi").checked = a.ai === true;
        document.getElementById("sSandi").value = "";
        document.getElementById("sSandi").placeholder = "kosongkan bila sandi tidak diubah";
        toast("Isian diisi dari akun " + a.pengguna + ".");
      });
    });

    Array.prototype.forEach.call(el.querySelectorAll("[data-togel-akun]"), function(b){
      b.addEventListener("click", async function(){
        var a = petaAkun[b.dataset.togelAkun];
        if(!a) return;
        var r = await srv("akunSimpan", {
          pengguna:a.pengguna, nama:a.nama, peran:a.peran, tingkat:a.tingkat,
          exp:a.exp, ai:a.ai, aktif:!(a.aktif !== false)
        });
        if(r.galat){ toast(r.galat); return; }
        toast(a.aktif === false ? "Diaktifkan." : "Dinonaktifkan.");
        gambarDaftar();
      });
    });

    Array.prototype.forEach.call(el.querySelectorAll("[data-hapus-akun]"), function(b){
      b.addEventListener("click", async function(){
        var siapa = b.dataset.hapusAkun;
        if(!await tanya("Hapus akun " + siapa + "?",
              "Akun dan data pribadinya (tracker IPK, skor kuis) dihapus dari server. Isi arsip tidak terpengaruh.",
              {ok:"Hapus", bahaya:true})) return;
        var r = await srv("akunHapus", {pengguna:siapa});
        if(r.galat){ toast(r.galat); return; }
        toast("Akun dihapus.");
        gambarDaftar();
      });
    });
  }

  document.getElementById("sSimpanAkun").addEventListener("click", async function(){
    var pengguna = normalPengguna(document.getElementById("sPengguna").value);
    if(pengguna.length < 3){ toast("Nama pengguna minimal 3 karakter."); return; }
    var r = await srv("akunSimpan", {
      pengguna: pengguna,
      nama: document.getElementById("sNama").value.trim() || pengguna,
      peran: document.getElementById("sPeran").value,
      tingkat: document.getElementById("sTingkat").value,
      exp: document.getElementById("sExp").value || "",
      ai: document.getElementById("sAi").checked,
      aktif: true,
      sandi: document.getElementById("sSandi").value || undefined
    });
    if(r.galat){ toast(r.galat); return; }
    ["sNama","sPengguna","sSandi","sExp"].forEach(function(id){ document.getElementById(id).value = ""; });
    document.getElementById("sAi").checked = false;
    toast("Akun " + pengguna + " tersimpan di server.");
    gambarDaftar();
  });

  gambarDaftar();
}

}

/* Semua pengaturan situs milik bersama: begitu pemilik mengubahnya, semua
   akun harus melihat perubahan itu. Tanpa ini hasil suntingan cuma mengendap
   di browser pemilik. */
async function dorongAtur(){
  if(!SERVER.ada) return true;
  var j = await srv("aturSimpan", {
    teks: db.teks, tema: db.tema, stase: db.stase,
    staseUbah: db.staseUbah, staseGambar: db.staseGambar, ikon: db.ikon || "",
    agenda: db.agenda || [], berkas: db.berkas || []
  });
  if(j.galat){ toast(j.galat); return false; }
  if(j.arsip) pasangArsipServer(j.arsip);
  return true;
}

function pasangAtur(){
  if(SERVER.ada) pasangAkunServerUi();

  var rm = document.getElementById("resetMuat");
  if(rm) rm.addEventListener("click", async function(){
    var kotak = document.getElementById("resetDaftar");
    var kabar = document.getElementById("resetKabar");
    kabar.textContent = "Memuat\u2026";
    var j = await srv("resetAntre", {});
    kabar.textContent = "";
    if(j.galat){ kabar.textContent = j.galat; return; }
    var antre = j.antre || [];
    if(!antre.length){
      kotak.innerHTML = '<p class="bantu" style="margin:0">Tidak ada permintaan.</p>';
      return;
    }
    kotak.innerHTML = antre.map(function(x){
      return '<div class="uji-baris"><span class="uji-nama">' + esc(x.pengguna) + "</span>" +
             '<span class="uji-nilai" style="font-weight:600;color:var(--redup)">' +
             esc(String(x.pada || "").slice(0, 10)) + "</span>" +
             '<button class="t kcl" type="button" data-reset-buat="' + esc(x.pengguna) + '">Buat kode</button>' +
             '<button class="t kcl" type="button" data-reset-batal="' + esc(x.pengguna) + '">Abaikan</button></div>';
    }).join("");

    Array.prototype.forEach.call(kotak.querySelectorAll("[data-reset-buat]"), function(b){
      b.addEventListener("click", async function(){
        var jk = await srv("resetBuat", {pengguna:b.dataset.resetBuat});
        if(jk.galat) return beritahu("Gagal", jk.galat);
        await beritahu("Kode untuk " + jk.pengguna,
          jk.kode + "\n\nBerlaku " + jk.berlaku + " dan sekali pakai. Sampaikan lewat jalur pribadi, jangan di grup.");
        salin(jk.kode, "Kode disalin.");
      });
    });
    Array.prototype.forEach.call(kotak.querySelectorAll("[data-reset-batal]"), function(b){
      b.addEventListener("click", async function(){
        var jb = await srv("resetBatal", {pengguna:b.dataset.resetBatal});
        if(jb.galat) return toast(jb.galat);
        rm.click();
      });
    });
  });

  var swDaftar = document.getElementById("aturDaftar");
  if(swDaftar) swDaftar.addEventListener("change", async function(){
    var mau = swDaftar.checked;
    swDaftar.disabled = true;
    var j = await srv("aturSimpan", {pendaftaran:mau});
    swDaftar.disabled = false;
    if(j.galat){ swDaftar.checked = !mau; toast(j.galat); return; }
    PENDAFTARAN_BUKA = mau;
    if(j.arsip) pasangArsipServer(j.arsip);
    toast(mau ? "Pendaftaran dibuka. Akun baru dapat akses gratis saja."
              : "Pendaftaran ditutup.");
  });

  document.getElementById("simpanTeks").addEventListener("click", function(){
    Array.prototype.forEach.call(panggung.querySelectorAll("[data-teks]"), function(el){
      db.teks[el.dataset.teks] = el.value.trim();
    });
    simpan();
    dorongAtur().then(function(ok){
      render();
      toast(ok ? (SERVER.ada ? "Teks situs diperbarui untuk semua akun."
                             : "Teks situs diperbarui.")
               : "Tersimpan lokal, tapi gagal ke server.");
    });
  });

  document.getElementById("resetTeks").addEventListener("click", async function(){
    if(!await tanya("Kembalikan teks ke bawaan?",
                    "Semua tulisan yang kamu ubah di halaman ini kembali ke aslinya.", {ok:"Kembalikan"})) return;
    db.teks = {};
    simpan();
    dorongAtur().then(function(){ render(); toast("Teks dikembalikan ke bawaan."); });
  });

  Array.prototype.forEach.call(panggung.querySelectorAll("[data-palet]"), function(b){
    b.addEventListener("click", function(){
      var p = PALET.filter(function(x){ return x.id === b.dataset.palet; })[0];
      if(!p) return;
      db.tema.palet = p.id;
      db.tema.a1 = p.a1; db.tema.a2 = p.a2; db.tema.a3 = p.a3;
      simpan(); terapkanTema();
      dorongAtur().then(function(){ render(); toast("Palet " + p.nama + " dipakai."); });
    });
  });

  ["a1","a2","a3"].forEach(function(k){
    var el = document.getElementById("w" + k);
    el.addEventListener("input", function(){
      db.tema[k] = el.value;
      db.tema.palet = "sendiri";
      terapkanTema();
    });
    el.addEventListener("change", function(){
      simpan();
      dorongAtur().then(function(){ render(); toast("Warna diperbarui."); });
    });
  });

  Array.prototype.forEach.call(panggung.querySelectorAll("[data-mode]"), function(b){
    b.addEventListener("click", function(){
      db.tema.mode = b.dataset.mode;
      simpan();
      terapkanTema(true);
      dorongAtur().then(function(){ render(); });
    });
  });

  document.getElementById("simpanStase").addEventListener("click", function(){
    var baris = panggung.querySelectorAll(".stase-atur");
    Array.prototype.forEach.call(baris, function(r){
      var id = r.dataset.id;
      var kode = r.querySelector('[data-f="kode"]').value.trim().toUpperCase() || "???";
      var nama = r.querySelector('[data-f="nama"]').value.trim() || id;
      var hue = Number(r.querySelector('[data-f="h"]').value);
      var sendiri = (db.stase || []).filter(function(x){ return x.id === id; })[0];
      if(sendiri){ sendiri.kode = kode; sendiri.nama = nama; sendiri.h = hue; return; }
      var bawaan = STASE_BAWAAN.filter(function(x){ return x.id === id; })[0];
      if(bawaan){ bawaan.kode = kode; bawaan.nama = nama; bawaan.h = hue; }
    });
    // Simpan juga penyesuaian stase bawaan supaya bertahan setelah muat ulang.
    db.staseUbah = STASE_BAWAAN.map(function(s){ return {id:s.id, kode:s.kode, nama:s.nama, h:s.h}; });
    simpan();
    dorongAtur().then(function(){ render(); toast("Stase disimpan."); });
  });

  document.getElementById("tambahStase").addEventListener("click", async function(){
    var nama = await mintaTeks("Stase baru", "Nama stase",
      {pesan:"Kode singkat dan warnanya dibuat otomatis, dan bisa kamu ubah di daftar setelah ini.",
       placeholder:"mis. Rehabilitasi Medik", ok:"Tambah"});
    if(nama === null) return;
    nama = nama.trim();
    if(!nama){ toast("Nama stase belum diisi."); return; }
    var kode = nama.replace(/[^A-Za-z]/g, "").slice(0,3).toUpperCase() || "STS";
    db.stase.push({id:idBaru("s"), kode:kode, nama:nama, h:Math.floor(Math.random()*360)});
    simpan();
    dorongAtur().then(function(){ render(); toast("Stase ditambahkan."); });
  });

  Array.prototype.forEach.call(panggung.querySelectorAll("[data-hapus-stase]"), function(b){
    b.addEventListener("click", async function(){
      var id = b.dataset.hapusStase;
      var pakai = db.entri.filter(function(e){ return e.stase === id; }).length;
      if(pakai && !await tanya("Hapus stase ini?",
            "Ada " + pakai + " entri di stase ini. Entrinya tetap ada, tapi stasenya jadi tidak dikenali.",
            {ok:"Tetap hapus", bahaya:true})) return;
      db.stase = db.stase.filter(function(x){ return x.id !== id; });
      simpan();
      dorongAtur().then(function(){ render(); toast("Stase dihapus."); });
    });
  });

  var ikonBerkas = document.getElementById("ikonBerkas");
  if(ikonBerkas){
    document.getElementById("pilihIkon").addEventListener("click", function(){ ikonBerkas.click(); });
    ikonBerkas.addEventListener("change", function(){
      var f = ikonBerkas.files && ikonBerkas.files[0];
      if(!f) return;
      toast("Memproses ikon\u2026");
      bacaGambar(f, 128, 0.9).then(function(uri){
        db.ikon = uri;
        simpan();
        terapkanIkon();
        dorongAtur().then(function(){ render(); toast("Ikon diganti."); });
      }, function(err){ toast(err.message); });
    });
    var hi = document.getElementById("hapusIkon");
    if(hi) hi.addEventListener("click", function(){
      db.ikon = "";
      simpan();
      terapkanIkon();
      dorongAtur().then(function(){ render(); toast("Ikon dikembalikan ke bawaan."); });
    });
  }

  var staseBerkas = document.getElementById("staseBerkas");
  var staseTarget = null;
  Array.prototype.forEach.call(panggung.querySelectorAll("[data-gambar-stase]"), function(b){
    b.addEventListener("click", function(){
      staseTarget = b.dataset.gambarStase;
      staseBerkas.value = "";
      staseBerkas.click();
    });
  });
  staseBerkas.addEventListener("change", function(){
    var f = staseBerkas.files && staseBerkas.files[0];
    if(!f || !staseTarget) return;
    toast("Memproses gambar\u2026");
    // Spanduk lebar tapi pendek, jadi 1000px sudah lebih dari cukup.
    bacaGambar(f, 1000, 0.78).then(function(uri){
      db.staseGambar[staseTarget] = uri;
      simpan();
      dorongAtur().then(function(){
        render();
        toast("Gambar header dipasang (" + beratKb(uri) + " KB).");
      });
    }, function(err){ toast(err.message); });
  });
  Array.prototype.forEach.call(panggung.querySelectorAll("[data-hapus-gambar]"), function(b){
    b.addEventListener("click", function(){
      delete db.staseGambar[b.dataset.hapusGambar];
      simpan();
      dorongAtur().then(function(){ render(); toast("Gambar header dihapus."); });
    });
  });

  document.getElementById("buatVerifikasi").addEventListener("click", async function(){
    var aktif = (db.akun || []).filter(function(a){ return a.aktif !== false; });
    if(!aktif.length){ toast("Belum ada akun."); return; }
    var peta = {};
    for(var i=0;i<aktif.length;i++){
      var a = aktif[i];
      peta[a.pengguna] = {
        h: await sha(kredensial(a.pengguna, a.sandi)),
        // Hanya akun bertanda ini yang boleh memanggil Claude, jadi tagihan
        // API tetap terkendali di tangan pemilik.
        ai: a.ai === true
      };
    }
    var teks = JSON.stringify(peta);
    document.getElementById("verifikasiTeks").value = teks;
    salin(teks, "Disalin. Tempel ke env var AKUN_VERIFIKASI di Vercel.");

  document.getElementById("lihatPerangkat").addEventListener("click", async function(){

        if((a.tingkat || "penuh") === "penuh") info.k = bytesKeB64(masterRaw);

      var bundel = {

        bungkus:bungkus, publik:publik, muatan:muatan

    tombol.textContent = "Kunci arsip & buat bundel";

function terapkanStaseUbah(){
  // Kembalikan ke bawaan dulu; tanpa ini nama stase dari akun sebelumnya
  // ikut terbawa saat berganti akun di perangkat yang sama.
  STASE_ASLI.forEach(function(a){
    var s = STASE_BAWAAN.filter(function(x){ return x.id === a.id; })[0];
    if(s){ s.kode = a.kode; s.nama = a.nama; s.h = a.h; }
  });
  if(db.staseUbah && Array.isArray(db.staseUbah)){
    db.staseUbah.forEach(function(u){
      var s = STASE_BAWAAN.filter(function(x){ return x.id === u.id; })[0];
      if(s){ s.kode = u.kode; s.nama = u.nama; s.h = u.h; }
    });
  }
}

/* Isi dari bundel menang atas salinan lokal, supaya penerbitan ulang
   oleh pemilik langsung terasa. Draf kontributor yang belum terbit
   tetap dipertahankan karena tidak ada di bundel. */
function pasangIsiBundel(hasil){
  // Muatan publik ikut polos di berkas; muatan terbatas hanya ada kalau
  // akunnya memegang kunci. Keduanya digabung jadi satu arsip.
  var pub = (TERKUNCI && TERKUNCI.publik) ? TERKUNCI.publik : {};
  var rah = hasil && hasil.isi ? hasil.isi : {};
  var p = {
    entri: (Array.isArray(pub.entri) ? pub.entri : []).concat(Array.isArray(rah.entri) ? rah.entri : []),
    stase: rah.stase || pub.stase || [],
    staseUbah: rah.staseUbah || pub.staseUbah || [],
    staseGambar: rah.staseGambar || pub.staseGambar || {},
    teks: rah.teks || pub.teks || null,
    tema: rah.tema || pub.tema || null
  };

  var dariBundel = Array.isArray(p.entri) ? p.entri : [];
  var idBundel = {};
  dariBundel.forEach(function(e){ idBundel[e.id] = true; });

  var drafLokal = db.entri.filter(function(e){
    return !idBundel[e.id] && punyaku(e) && e.status !== "terbit";
  });

  db.entri = dariBundel.concat(drafLokal);
  db.stase = Array.isArray(p.stase) ? p.stase : [];
  db.staseUbah = Array.isArray(p.staseUbah) ? p.staseUbah : [];
  db.staseGambar = p.staseGambar && typeof p.staseGambar === "object" ? p.staseGambar : {};
  if(p.teks && typeof p.teks === "object") db.teks = p.teks;
  if(p.tema && typeof p.tema === "object") db.tema = p.tema;

  setSesi({
    peran: hasil.peran === "pemilik" ? "pemilik" : (hasil.peran === "kontributor" ? "kontributor" : ""),
    tingkat: hasil.tingkat || "penuh",
    nama: hasil.nama || "",
    pengguna: hasil.pengguna || ""
  });
  terapkanStaseUbah();
}

    var cek = await daftarkanPerangkat(inpU.value, inpS.value);
    tombol.disabled = false;
    tombol.textContent = "Masuk";
    if(!cek.ok){
      galat.textContent = cek.pesan + " Hubungi pemilik arsip untuk melepas salah satunya.";
      return;
    }

    try{
      localStorage.setItem(KUNCI + "/masuk", JSON.stringify({u:inpU.value, s:inpS.value}));
    }catch(e){}
    pasangIsiBundel(hasil);
    muatPribadi();
    simpan();
    g.remove();
    document.querySelector(".app").style.display = "";
    terapkanTema();
    render();
    toast("Selamat datang, " + (hasil.nama || hasil.pengguna) + ".");
  });
}

/* ---------------------------------------------------------------------
   Batas jumlah perangkat.

   Butuh backend, karena dua perangkat tidak bisa saling melihat lewat
   penyimpanan browser. Kalau /api/perangkat tidak ada (mis. saat dibuka
   sebagai Artifact) atau belum disetel, fungsinya diam dan situs jalan
   normal tanpa pembatasan.
   --------------------------------------------------------------------- */

var API_PERANGKAT = "/api/perangkat";

function sidikPerangkat(){
  var k = KUNCI + "/sidik";
  var v = null;
  try{ v = localStorage.getItem(k); }catch(e){}
  if(!v){
    v = bytesKeB64(acakBytes(16)).replace(/[^A-Za-z0-9]/g, "").slice(0, 22);
    try{ localStorage.setItem(k, v); }catch(e){}
  }
  return v;
}

async function daftarkanPerangkat(pengguna, sandi){
  if(!adaKripto()) return {ok:true, mati:true};
  var akun = normalPengguna(pengguna);
  var verifikasi;
  try{ verifikasi = await sha(kredensial(akun, sandi)); }
  catch(e){ return {ok:true, mati:true}; }

  var jawab;
  try{
    var r = await fetch(API_PERANGKAT, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({akun:akun, verifikasi:verifikasi, sidik:sidikPerangkat()})
    });
    if(r.status === 404) return {ok:true, mati:true};
    jawab = await r.json();
    if(r.status === 403){
      return {ok:false, pesan: jawab.galat || "Batas perangkat sudah tercapai."};
    }
    if(!r.ok) return {ok:true, mati:true};
  }catch(e){
    // Tidak ada backend, atau jaringan bermasalah: jangan halangi yang sah.
    return {ok:true, mati:true};
  }
  if(jawab && jawab.mati) return {ok:true, mati:true};
  return {ok:true, slot:jawab && jawab.slot, maks:jawab && jawab.maks};
}

/* ---------------------------------------------------------------------
   Memanggil Claude lewat backend sendiri.

   Kunci API tidak pernah ada di halaman ini \u2014 endpoint /api/claude yang
   memegangnya di sisi server. Kalau endpoint itu tidak ada (mis. saat
   dibuka sebagai Artifact) atau belum disetel, tombolnya disembunyikan
   dan alur salin-tempel yang lama tetap tersedia.
   --------------------------------------------------------------------- */

/* ---------------------------------------------------------------------
   Lapisan server. Kalau /api/data hidup, dialah sumber kebenaran: isi arsip,
   akun, dan data pribadi diambil dari sana, bukan dari penyimpanan browser.
   Akibatnya isinya sama di perangkat mana pun, materi terbatas tidak pernah
   dikirim ke yang belum berhak, dan memperbarui berkas situs tidak
   menyentuh data sama sekali.
   --------------------------------------------------------------------- */

var API_DATA = "/api/data";
var SERVER = {ada:false, token:null, akun:null};

function tokenTersimpan(){ try{ return localStorage.getItem(KUNCI + "/token"); }catch(e){ return null; } }
function setToken(t){
  try{ t ? localStorage.setItem(KUNCI + "/token", t) : localStorage.removeItem(KUNCI + "/token"); }catch(e){}
  SERVER.token = t || null;
}

async function srv(aksi, data){
  var badan = {aksi:aksi, token:SERVER.token};
  for(var k in (data||{})) badan[k] = data[k];
  var r, j;
  try{
    r = await fetch(API_DATA, {
      method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(badan)
    });
    if(r.status === 404) return {mati:true};
    j = await r.json();
  }catch(e){ return {galat:"Tidak bisa menghubungi server."}; }
  if(j && j.mati) return {mati:true};
  if(!r.ok) return {galat:(j && j.galat) || ("Server menjawab " + r.status)};
  return j;
}

function pasangArsipServer(arsip){
  if(!arsip) return;
  db.entri = Array.isArray(arsip.entri) ? arsip.entri : [];
  db.stase = Array.isArray(arsip.stase) ? arsip.stase : [];
  db.staseUbah = Array.isArray(arsip.staseUbah) ? arsip.staseUbah : [];
  db.staseGambar = arsip.staseGambar || {};
  if(arsip.teks) db.teks = arsip.teks;
  if(arsip.tema) db.tema = arsip.tema;
  if(typeof arsip.ikon === "string") db.ikon = arsip.ikon;
  if(Array.isArray(arsip.agenda)) db.agenda = arsip.agenda;
  if(Array.isArray(arsip.berkas)) db.berkas = arsip.berkas;
  terapkanStaseUbah();
  terapkanIkon();
}

function pasangTugasan(t){ TUGASAN = Array.isArray(t) ? t : []; }

function pasangAkunServer(a){
  SERVER.akun = a || null;
  if(!a){ setSesi(null); return; }
  setSesi({peran:a.peran, tingkat:a.tingkat, nama:a.nama, pengguna:a.pengguna, ai:a.ai === true});
}

/* Data pribadi ikut ke server supaya tracker IPK dan skor kuis tidak hilang
   saat ganti perangkat. Ditulis berkala, tidak tiap ketukan tombol. */
var jadwalPribadi = null;
function dorongPribadi(){
  if(!SERVER.ada || !SERVER.token) return;
  clearTimeout(jadwalPribadi);
  jadwalPribadi = setTimeout(function(){ srv("pribadiSimpan", {pribadi:pribadi}); }, 1200);
}

var API_CLAUDE = "/api/claude";
var claudeSiap = null;

/* Di mode server cukup token sesinya; server yang menentukan akun mana
   dan boleh-tidaknya memakai AI. Jalur sidik sandi hanya tersisa untuk
   pemasangan bundel luring yang tidak punya sesi server. */
async function bekalAkun(){
  var tok = SERVER.token;
  if(!tok){
    try{ tok = localStorage.getItem(KUNCI + "/token") || null; }catch(e){}
  }
  if(tok) return {token:tok};

  var masuk = null;
  try{ masuk = JSON.parse(localStorage.getItem(KUNCI + "/masuk") || "null"); }catch(e){}
  if(!masuk || !masuk.u) return null;
  try{
    return {
      akun: normalPengguna(masuk.u),
      verifikasi: await sha(kredensial(masuk.u, masuk.s))
    };
  }catch(e){ return null; }
}

async function mintaClaude(tugas, materi, lampiran){
  var bekal = await bekalAkun();
  if(!bekal) return {ok:false, pesan:"Perlu masuk dengan akunmu dulu."};

  var r, j;
  try{
    r = await fetch(API_CLAUDE, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        token:bekal.token, akun:bekal.akun, verifikasi:bekal.verifikasi,
        tugas:tugas, materi:materi,
        lampiran: (lampiran || []).map(function(l){
          return {jenis:l.jenisKirim, mime:l.mime, data:l.data};
        })
      })
    });
    if(r.status === 404) return {ok:false, mati:true};
    j = await r.json();
  }catch(e){
    return {ok:false, pesan:"Tidak bisa menghubungi server."};
  }

  if(j && j.mati) return {ok:false, mati:true};
  if(j && j.galat) return {ok:false, pesan:j.galat};
  if(!r.ok) return {ok:false, pesan:"Server menjawab " + r.status + "."};
  return {ok:true, hasil:j.hasil, pakai:j.pakai, batas:j.batas, token:j.token};
}

/* Sekali per muat halaman: cek endpointnya ada atau tidak, supaya tombol
   yang pasti gagal tidak usah ditampilkan. */
async function cekClaude(){
  if(claudeSiap !== null) return claudeSiap;
  // Dulu dianggap mati kalau situsnya tidak dalam mode bundel terkunci.
  // Itu keliru sejak akun pindah ke server: justru pemasangan server yang
  // paling mungkin punya endpointnya. Sekarang endpointnya yang ditanya.
  if(!TERKUNCI && !SERVER.ada){ claudeSiap = false; return false; }
  try{
    var r = await fetch(API_CLAUDE, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({})
    });
    if(r.status === 404){ claudeSiap = false; return false; }
    var j = await r.json();
    claudeSiap = !(j && j.mati);
  }catch(e){ claudeSiap = false; }
  return claudeSiap;
}

/* true kalau server mengizinkan orang mendaftar sendiri. Diisi saat muat. */
var PENDAFTARAN_BUKA = false;

function layarMasuk(pesanAwal){
  if(document.getElementById("gerbangKunci")) return;
  var g = document.createElement("div");
  g.className = "gerbang";
  g.id = "gerbangKunci";
  g.innerHTML =
    '<form class="gerbang-kotak kaca" id="kform">' +
      '<div style="width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--a1),var(--a3));display:grid;place-items:center;color:var(--atas-aksen);font-family:var(--f-tampil);font-weight:800;font-size:19px;margin-bottom:14px">' +
        esc(T("lambang").slice(0,2)) + "</div>" +
      "<h2>" + esc(T("judul")) + "</h2>" +
      '<p id="kajak">Masuk dengan akunmu untuk membuka arsip.</p>' +
      '<div class="b" id="kotakNama" style="display:none"><label for="knama">Nama panggilan</label>' +
      '<input id="knama" type="text" autocomplete="name" placeholder="yang muncul di jadwal bersama"></div>' +
      '<div class="b"><label for="kuser">Nama pengguna</label>' +
      '<input id="kuser" type="text" autocomplete="username" autocapitalize="none" spellcheck="false"></div>' +
      '<div class="b"><label for="ksandi">Sandi</label>' +
      '<input id="ksandi" type="password" autocomplete="current-password"></div>' +
      '<div class="gerbang-galat" id="kgalat" role="alert">' + esc(pesanAwal || "") + "</div>" +
      '<div class="kotak-aksi"><button class="t utama" type="submit" id="kbuka">Masuk</button></div>' +
      '<p style="font-size:12px;margin:14px 0 0"><button type="button" class="tautan-teks" id="klupa">Lupa sandi?</button></p>' +
      '<p id="kalih" style="font-size:12px;color:var(--redup);margin:16px 0 0;line-height:1.5">Belum punya akun? Hubungi pemilik arsip.</p>' +
    "</form>";
  document.body.appendChild(g);

  var inpU = document.getElementById("kuser");
  var inpS = document.getElementById("ksandi");
  var inpN = document.getElementById("knama");
  var modeDaftar = false;
  inpU.focus();

  function segarkanAjakan(){
    var alih = document.getElementById("kalih");
    document.getElementById("kotakNama").style.display = modeDaftar ? "" : "none";
    document.getElementById("kbuka").textContent = modeDaftar ? "Buat akun" : "Masuk";
    document.getElementById("kajak").textContent = modeDaftar
      ? "Buat akun sendiri. Akun baru langsung bisa membaca materi gratis; untuk yang berbayar, minta pemilik menaikkan aksesmu."
      : "Masuk dengan akunmu untuk membuka arsip.";
    inpS.autocomplete = modeDaftar ? "new-password" : "current-password";
    if(!PENDAFTARAN_BUKA){
      alih.textContent = "Belum punya akun? Hubungi pemilik arsip.";
      return;
    }
    alih.innerHTML = modeDaftar
      ? 'Sudah punya akun? <button type="button" class="tautan-teks" id="kalihBalik">Masuk saja</button>'
      : 'Belum punya akun? <button type="button" class="tautan-teks" id="kalihDaftar">Daftar sendiri</button>';
    var bd = document.getElementById("kalihDaftar") || document.getElementById("kalihBalik");
    if(bd) bd.addEventListener("click", function(){
      modeDaftar = !modeDaftar;
      document.getElementById("kgalat").textContent = "";
      segarkanAjakan();
      (modeDaftar ? inpN : inpU).focus();
    });
  }
  segarkanAjakan();

  document.getElementById("kform").addEventListener("submit", async function(ev){
    ev.preventDefault();
    var galat = document.getElementById("kgalat");
    var tombol = document.getElementById("kbuka");
    if(!inpU.value.trim() || !inpS.value){ galat.textContent = "Nama pengguna dan sandi harus diisi."; return; }
    if(modeDaftar && inpS.value.length < 8){
      galat.textContent = "Sandi minimal 8 karakter."; inpS.focus(); return;
    }

    var labelAsli = tombol.textContent;
    tombol.disabled = true;
    tombol.textContent = modeDaftar ? "Membuat\u2026" : "Masuk\u2026";
    galat.textContent = "";
    var j = modeDaftar
      ? await srv("daftar", {pengguna:inpU.value, sandi:inpS.value, nama:inpN.value})
      : await srv("masuk", {pengguna:inpU.value, sandi:inpS.value});
    tombol.disabled = false; tombol.textContent = labelAsli;

    if(j.galat){ galat.textContent = j.galat; if(!modeDaftar) inpS.select(); return; }
    setToken(j.token);
    pasangAkunServer(j.akun);
    pasangArsipServer(j.arsip);
    // Mulai dari kosong kalau server belum punya apa-apa untuk akun ini;
    // kalau tidak, catatan pribadi pemakai sebelumnya di perangkat yang sama
    // ikut terbawa ke akun yang baru masuk.
    pribadi = (j.pribadi && typeof j.pribadi === "object") ? j.pribadi : pribadiKosong();
    // Sesi baru berarti daftar akun dan tugasan lama sudah tidak relevan.
    DAFTAR_AKUN = null;
    var jt = await srv("muat", {});
    if(!jt.galat) pasangTugasan(jt.tugasan);
    g.remove();
    document.querySelector(".app").style.display = "";
    terapkanTema();
    render();
    toast(modeDaftar
      ? "Akun dibuat. Selamat datang, " + (j.akun.nama || j.akun.pengguna) + "."
      : "Selamat datang, " + (j.akun.nama || j.akun.pengguna) + ".");
  });
}

function judulTerkunci(){
  return (TERKUNCI && TERKUNCI.judul) ? TERKUNCI.judul : TEKS_BAWAAN.judul;
}
function adaPublik(){
  return !!(TERKUNCI && TERKUNCI.publik && Array.isArray(TERKUNCI.publik.entri) && TERKUNCI.publik.entri.length);
}

(async function mulai(){
  HASH_PEMILIK = await sha(SANDI_PEMILIK_BAWAAN);
  HASH_KONTRIB = await sha(SANDI_KONTRIB_BAWAAN);
  db = muat();
  muatPribadi();
  terapkanStaseUbah();
  terapkanTema();

  // Server lebih dulu. Kalau hidup, dia yang menentukan isi dan hak akses.
  SERVER.token = tokenTersimpan();
  var awal = await srv("muat", {});
  if(!awal.mati && !awal.galat){
    SERVER.ada = true;
    pasangAkunServer(awal.akun);
    pasangArsipServer(awal.arsip);
    pribadi = (awal.pribadi && typeof awal.pribadi === "object") ? awal.pribadi : pribadiKosong();
    pasangTugasan(awal.tugasan);
    PENDAFTARAN_BUKA = awal.pendaftaran === true;
    pindahBerkasLama();
    muatPribadi.terpakai = true;
    terapkanTema();

    if(!awal.akun && awal.adaAkun){
      // Ada akun terdaftar tapi belum masuk: jangan render apa pun dulu.
      document.querySelector(".app").style.display = "none";
      layarMasuk(awal.arsip && (awal.arsip.entri || []).length
        ? "" : "Belum ada materi gratis. Masuk untuk melihat isinya.");
      return;
    }
    if(!awal.adaAkun){
      toast("Server aktif tapi belum ada akun. Atur PEMILIK_AWAL di Vercel.");
    }
    render();
    return;
  }

  if(!TERKUNCI){
    pindahBerkasLama();
    simpan();
    render();
    return;
  }

  // Mode terkunci: jangan render apa pun sebelum kode dibuka.
  if(!adaKripto()){
    document.querySelector(".app").style.display = "none";
    layarKunci("Browser ini tidak menyediakan Web Crypto pada konteks aman, jadi arsip tidak bisa dibuka di sini.");
    document.getElementById("kbuka").disabled = true;
    return;
  }

  document.querySelector(".app").style.display = "none";

  var tersimpan = null;
  try{ tersimpan = JSON.parse(localStorage.getItem(KUNCI + "/masuk") || "null"); }catch(e){}

  if(tersimpan && tersimpan.u){
    var hasil = await bukaDenganAkun(tersimpan.u, tersimpan.s);
    if(hasil && !hasil.kedaluwarsa){
      var cek = await daftarkanPerangkat(tersimpan.u, tersimpan.s);
      if(!cek.ok){
        try{ localStorage.removeItem(KUNCI + "/masuk"); }catch(e){}
        layarKunci(cek.pesan);
        return;
      }
      pasangIsiBundel(hasil);
      muatPribadi();
      simpan();
      document.querySelector(".app").style.display = "";
      terapkanTema();
      render();
      return;
    }
    try{ localStorage.removeItem(KUNCI + "/masuk"); }catch(e){}
    layarKunci(hasil && hasil.kedaluwarsa ? "Masa berlaku akunmu sudah habis." : "");
    return;
  }

  layarKunci("");
})();

})();
