/* Bilah format: menyunting textarea yang sedang aktif, jadi satu bilah
   cukup untuk kotak pengantar maupun tiap kotak tab. */
var FORMAT_TOMBOL = [
  {k:"tebal",  nm:"B",   jd:"Tebal",          bungkus:"**"},
  {k:"miring", nm:"I",   jd:"Miring",         bungkus:"*"},
  {k:"kode",   nm:"&lt;/&gt;", jd:"Kode",     bungkus:"`"},
  {k:"judul",  nm:"H",   jd:"Sub-judul",      awalan:"### "},
  {k:"daftar", nm:"\u2022", jd:"Daftar titik", awalan:"- "},
  {k:"nomor",  nm:"1.",  jd:"Daftar nomor",   awalan:"1. ", bernomor:true},
  {k:"kutip",  nm:"\u201C", jd:"Kutipan",      awalan:"> "},
  {k:"masuk",  nm:"\u2192|", jd:"Jorokkan ke dalam", awalan:"  ", polos:true},
  {k:"keluar", nm:"|\u2190", jd:"Keluarkan",        awalan:"  ", polos:true, mundur:true}
];

/* ---- Penyunting terformat (WYSIWYG) ----
   Bentuk simpanannya tetap markdown; yang berubah hanya cara menulisnya.
   Jadi entri lama tetap terbaca dan tidak ada migrasi data. */

function mdTeksSebaris(n){
  var keluar = "";
  Array.prototype.forEach.call(n.childNodes, function(c){
    if(c.nodeType === 3){ keluar += c.nodeValue.replace(/\s+/g, " "); return; }
    if(c.nodeType !== 1) return;
    var t = c.tagName;
    var dalam = mdTeksSebaris(c);
    if(t === "BR"){ keluar += "\n"; return; }
    if(!dalam.trim() && t !== "BR") return;
    if(t === "B" || t === "STRONG") keluar += "**" + dalam.trim() + "**";
    else if(t === "I" || t === "EM") keluar += "*" + dalam.trim() + "*";
    else if(t === "CODE") keluar += "`" + dalam.trim() + "`";
    else if(t === "A"){
      var href = c.getAttribute("href") || "";
      keluar += href ? "[" + dalam.trim() + "](" + href + ")" : dalam;
    }
    else keluar += dalam;
  });
  return keluar;
}

/* Daftar bisa bersarang; tiap tingkat dijorokkan dua spasi supaya cocok
   dengan yang dibaca md(). Tanpa ini sub-poin gepeng jadi satu baris. */
function daftarKeMd(daftar, dalam){
  var urut = daftar.tagName === "OL";
  var baris = [];
  var n = 0;
  Array.prototype.forEach.call(daftar.children, function(li){
    if(li.tagName !== "LI") return;
    n++;
    var anak = [];
    var sendiri = document.createElement("div");
    Array.prototype.forEach.call(li.childNodes, function(c){
      if(c.nodeType === 1 && (c.tagName === "UL" || c.tagName === "OL")) anak.push(c);
      else sendiri.appendChild(c.cloneNode(true));
    });
    var spasi = new Array(dalam * 2 + 1).join(" ");
    baris.push(spasi + (urut ? n + ". " : "- ") + mdTeksSebaris(sendiri).trim());
    anak.forEach(function(a){
      var dalamnya = daftarKeMd(a, dalam + 1);
      if(dalamnya) baris.push(dalamnya);
    });
  });
  return baris.join("\n");
}

function htmlKeMd(akar){
  var bagian = [];
  Array.prototype.forEach.call(akar.childNodes, function(n){
    if(n.nodeType === 3){
      var t = n.nodeValue.trim();
      if(t) bagian.push(t);
      return;
    }
    if(n.nodeType !== 1) return;
    var tag = n.tagName;
    if(/^H[1-6]$/.test(tag)){
      var tingkat = Math.min(Math.max(Number(tag[1]), 2), 4);
      bagian.push(new Array(tingkat + 1).join("#") + " " + mdTeksSebaris(n).trim());
    }
    else if(tag === "UL" || tag === "OL"){
      var baris = daftarKeMd(n, 0);
      if(baris) bagian.push(baris);
    }
    else if(tag === "BLOCKQUOTE"){
      var q = htmlKeMd(n).split("\n").map(function(x){ return x ? "> " + x : ">"; });
      bagian.push(q.join("\n"));
    }
    else if(tag === "TABLE"){
      // Tabel pipa dipertahankan; tanpa ini isi tabel entri lama hilang
      // begitu disunting di mode terformat.
      var baris2 = [];
      var kepalaSudah = false;
      Array.prototype.forEach.call(n.querySelectorAll("tr"), function(tr){
        var sel = Array.prototype.map.call(tr.children, function(td){
          return mdTeksSebaris(td).trim().replace(/\|/g, "\\|");
        });
        if(!sel.length) return;
        baris2.push("| " + sel.join(" | ") + " |");
        if(!kepalaSudah){
          baris2.push("| " + sel.map(function(){ return "---"; }).join(" | ") + " |");
          kepalaSudah = true;
        }
      });
      if(baris2.length) bagian.push(baris2.join("\n"));
    }
    else if(tag === "PRE") bagian.push("```\n" + n.textContent.replace(/\s+$/, "") + "\n```");
    else if(tag === "HR") bagian.push("---");
    else if(tag === "DIV" && n.querySelector("p,h2,h3,ul,ol,table,blockquote")) bagian.push(htmlKeMd(n));
    else {
      var isi = mdTeksSebaris(n).trim();
      if(isi) bagian.push(isi);
    }
  });
  return bagian.filter(Boolean).join("\n\n");
}

/* Menyambungkan satu textarea markdown dengan satu kotak terformat.
   Textarea-nya tetap ada (tersembunyi) sebagai sumber kebenaran. */
function pasangKaya(ta, kotak){
  function keKotak(){ kotak.innerHTML = md(ta.value) || "<p><br></p>"; }
  function keTeks(){
    ta.value = htmlKeMd(kotak);
    ta.dispatchEvent(new Event("input", {bubbles:true}));
  }
  keKotak();
  kotak.addEventListener("input", keTeks);
  kotak.addEventListener("blur", keTeks);
  // Tempel sebagai teks polos, supaya gaya dari Word atau web tidak ikut
  // terbawa dan merusak keluaran markdown-nya.
  kotak.addEventListener("paste", function(ev){
    ev.preventDefault();
    var teks = (ev.clipboardData || window.clipboardData).getData("text/plain");
    document.execCommand("insertText", false, teks);
  });
  return {segarkan:keKotak, panen:keTeks};
}

function bilahFormat(){
  var h = '<div class="format-bar" role="toolbar" aria-label="Format tulisan">';
  FORMAT_TOMBOL.forEach(function(t){
    h += '<button class="format-b" type="button" data-format="' + t.k +
         '" title="' + esc(t.jd) + '" aria-label="' + esc(t.jd) + '">' + t.nm + "</button>";
  });
  h += '<span class="format-sela"></span>';
  if(pemilik()){
    h += '<button class="format-b format-ai" type="button" id="tulisRapikan" ' +
         'title="Bereskan dengan AI" aria-label="Bereskan tulisan dengan AI">Bereskan</button>';
  }
  h += '<button class="format-b" type="button" id="tulisSumber" aria-pressed="false" ' +
       'title="Lihat markdown mentah" aria-label="Tampilkan sumber markdown">Sumber</button>';
  h += '<button class="format-b" type="button" id="tulisLuas" aria-pressed="false" ' +
       'title="Layar fokus" aria-label="Perbesar layar tulis">Fokus</button>';
  h += "</div>";
  return h;
}

var PERINTAH_KAYA = {
  tebal:["bold"], miring:["italic"], daftar:["insertUnorderedList"],
  nomor:["insertOrderedList"], judul:["formatBlock","<h3>"],
  kutip:["formatBlock","<blockquote>"], kode:["formatBlock","<pre>"],
  masuk:["indent"], keluar:["outdent"]
};

function terapkanFormat(ta, kunci){
  // Di mode terformat, yang disunting kotaknya \u2014 markdown-nya menyusul.
  if(ta && ta.isContentEditable){
    var p = PERINTAH_KAYA[kunci];
    if(!p) return;
    ta.focus();
    document.execCommand(p[0], false, p[1] || null);
    ta.dispatchEvent(new Event("input", {bubbles:true}));
    return;
  }
  var t = FORMAT_TOMBOL.filter(function(x){ return x.k === kunci; })[0];
  if(!ta || !t) return;
  var mulai = ta.selectionStart, akhir = ta.selectionEnd;
  var isi = ta.value;

  if(t.bungkus){
    var pilih = isi.slice(mulai, akhir) || t.jd.toLowerCase();
    var sudah = isi.slice(mulai - t.bungkus.length, mulai) === t.bungkus &&
                isi.slice(akhir, akhir + t.bungkus.length) === t.bungkus;
    if(sudah){
      // Klik kedua melepas tandanya, bukan menumpuknya jadi ****.
      ta.value = isi.slice(0, mulai - t.bungkus.length) + pilih +
                 isi.slice(akhir + t.bungkus.length);
      ta.setSelectionRange(mulai - t.bungkus.length, akhir - t.bungkus.length);
    } else {
      ta.value = isi.slice(0, mulai) + t.bungkus + pilih + t.bungkus + isi.slice(akhir);
      ta.setSelectionRange(mulai + t.bungkus.length, mulai + t.bungkus.length + pilih.length);
    }
  } else if(t.polos){
    // Menjorokkan hanya menambah atau mengurangi dua spasi di depan baris.
    var kiriJ = isi.lastIndexOf("\n", mulai - 1) + 1;
    var kananJ = isi.indexOf("\n", akhir);
    if(kananJ === -1) kananJ = isi.length;
    var olahJ = isi.slice(kiriJ, kananJ).split("\n").map(function(b){
      return t.mundur ? b.replace(/^ {1,2}/, "") : "  " + b;
    }).join("\n");
    ta.value = isi.slice(0, kiriJ) + olahJ + isi.slice(kananJ);
    ta.setSelectionRange(kiriJ, kiriJ + olahJ.length);
  } else {
    // Awalan berlaku per baris, supaya beberapa baris terpilih jadi satu daftar.
    var kiri = isi.lastIndexOf("\n", mulai - 1) + 1;
    var kanan = isi.indexOf("\n", akhir);
    if(kanan === -1) kanan = isi.length;
    var baris = isi.slice(kiri, kanan).split("\n");
    var semuaSudah = baris.every(function(b){
      return t.bernomor ? /^\d+\.\s/.test(b) : b.indexOf(t.awalan) === 0;
    });
    var olah = baris.map(function(b, i){
      if(semuaSudah){
        return t.bernomor ? b.replace(/^\d+\.\s/, "") : b.slice(t.awalan.length);
      }
      // Ganti jenis daftar harus menggantikan, bukan menumpuk jadi "- 1. isi".
      var bersih = b.replace(/^(?:[-*+]\s|\d+\.\s|>\s|#{1,6}\s)/, "");
      return (t.bernomor ? (i + 1) + ". " : t.awalan) + bersih;
    });
    ta.value = isi.slice(0, kiri) + olah.join("\n") + isi.slice(kanan);
    ta.setSelectionRange(kiri, kiri + olah.join("\n").length);
  }
  ta.focus();
  ta.dispatchEvent(new Event("input", {bubbles:true}));
}

function bukaEditor(id){
  if(!bisaTulis()) return mintaSandi();
  sunting = id;
  ui.view = "editor";
  render();
  window.scrollTo(0,0);

  render();
}

  h += '<span class="bantu">Tempel latihan soal apa adanya. Dikenali: <code>1.</code>, <code>A.</code>, <code>Jawaban: B</code>, <code>Pembahasan:</code>. JSON juga diterima. <b id="hitungSoal"></b></span></div>';

  var hitung = document.getElementById("hitungSoal");

  function perbarui(){
    var n = uraiSoal(fSoal.value).length;
    hitung.textContent = n ? "Terbaca " + n + " soal." : (fSoal.value.trim() ? "Belum ada soal yang terbaca \u2014 periksa formatnya." : "");
    hitung.style.color = (!n && fSoal.value.trim()) ? "var(--buruk)" : "var(--baik)";
  }
  fSoal.addEventListener("input", perbarui);
  perbarui();

  fTipe.addEventListener("change", function(){
    kotakSoal.style.display = fTipe.value === "kuis" ? "" : "none";
  });

  // Lampiran disunting di larik terpisah supaya batal-sunting tidak
  // mengubah entri yang tersimpan.
  var lamKerja = lampiranEntri(e).map(function(x){ return Object.assign({}, x); });

  function bagianTersedia(){
    return pecahBagian(document.getElementById("fIsi").value).bagian.map(function(x){ return x.judul; });
  }

  function gambarLamSunting(){
    var kotak = document.getElementById("lamSunting");
    if(!kotak) return;
    if(!lamKerja.length){
      kotak.innerHTML = '<p class="bantu" style="margin:0">Belum ada lampiran.</p>';
      return;
    }
    var bag = bagianTersedia();
    var pakaiTab = document.getElementById("fTab").checked && bag.length >= 2;
    kotak.innerHTML = lamKerja.map(function(l, i){
      var tanda = l.jenis === "tautan" ? labelTautan(jenisTautan(l.url || "")) : "Berkas";
      var t = '<div class="lam-sbaris"><span class="lam-tanda">' + esc(tanda) + "</span>" +
              '<span class="lam-nama">' + esc(l.judul || l.url || "Berkas") + "</span>";
      // Tanpa ini semua lampiran menumpuk di satu tempat dan tidak bisa
      // dibedakan tab mana yang memilikinya.
      if(pakaiTab){
        t += '<select class="lam-bagian" data-lam-bagian="' + i + '" aria-label="Tab untuk lampiran ini">';
        t += '<option value=""' + (l.bagian ? "" : " selected") + ">Semua tab</option>";
        bag.forEach(function(nm){
          t += '<option value="' + esc(nm) + '"' + (l.bagian === nm ? " selected" : "") + ">" + esc(nm) + "</option>";
        });
        t += "</select>";
      }
      t += '<button class="t kcl" type="button" data-lam-buang="' + i + '">Buang</button></div>';
      return t;
    }).join("");
    Array.prototype.forEach.call(kotak.querySelectorAll("[data-lam-bagian]"), function(sel){
      sel.addEventListener("change", function(){
        lamKerja[Number(sel.dataset.lamBagian)].bagian = sel.value;
      });
    });
    Array.prototype.forEach.call(kotak.querySelectorAll("[data-lam-buang]"), function(b){
      b.addEventListener("click", function(){
        lamKerja.splice(Number(b.dataset.lamBuang), 1);
        gambarLamSunting();
      });
    });
  }
  gambarLamSunting();

  var btTautan = document.getElementById("lamTautan");
  if(btTautan) btTautan.addEventListener("click", async function(){
    var n = await dialog({
      judul:"Tambah tautan", jenis:"borang", ok:"Tambahkan",
      isi:'<label class="dl">Alamat (URL)</label>' +
          '<input id="lamUrl" type="url" placeholder="https://youtube.com/watch?v=\u2026">' +
          '<label class="dl">Nama tampilan (boleh kosong)</label>' +
          '<input id="lamJudul" type="text" maxlength="200" placeholder="mis. Kuliah syok - dr. Andi">',
      ambil: function(){
        var u = urlAman(document.getElementById("lamUrl").value);
        if(!u) return {galat:"Alamatnya harus dimulai dengan http:// atau https://"};
        return {nilai:{url:u, judul:document.getElementById("lamJudul").value.trim()}};
      }
    });
    if(!n) return;
    lamKerja.push({id:idBaru("l"), jenis:"tautan", url:n.url,
                   judul:n.judul || n.url, mime:"", ukuran:0});
    gambarLamSunting();
  });

  var btBerkas = document.getElementById("lamBerkas");
  var lamInput = document.getElementById("lamInput");
  if(btBerkas && lamInput){
    btBerkas.addEventListener("click", function(){ lamInput.click(); });
    lamInput.addEventListener("change", async function(){
      var kabar = document.getElementById("lamKabar");
      var f = (lamInput.files || [])[0];
      lamInput.value = "";
      if(!f) return;
      if(f.size > BATAS_UNGGAH){
        kabar.textContent = "Berkasnya " + Math.round(f.size / 1048576 * 10) / 10 +
          " MB, batasnya 3 MB. Unggah ke Google Drive lalu pasang tautannya \u2014 di situ tidak ada batas.";
        kabar.style.color = "var(--buruk)";
        return;
      }
      kabar.textContent = "Menyiapkan " + f.name + "\u2026";
      kabar.style.color = "var(--redup)";
      try{
        var data = await base64Berkas(f);
        lamKerja.push({id:idBaru("l"), jenis:"berkas", judul:f.name,
                       mime:f.type || "application/octet-stream", ukuran:f.size,
                       url:"", data:data, baru:true});
        gambarLamSunting();
        kabar.textContent = f.name + " siap. Tersimpan saat entrinya disimpan.";
        kabar.style.color = "var(--baik)";
      }catch(err){
        kabar.textContent = err.message;
        kabar.style.color = "var(--buruk)";
      }
    });
  }

  // Pemantik tab: menyisipkan kerangka "## Judul" supaya tidak perlu hafal
  // sintaksnya, dan menunjukkan tab apa saja yang sudah terbaca.
  var taIsi = document.getElementById("fIsi");
  var cTab = document.getElementById("fTab");
  var kotakTab = document.getElementById("tulisTab");
  var kotakKaya = document.getElementById("fKaya");
  var kayaUtama = pasangKaya(taIsi, kotakKaya);
  var modeSumber = false;
  var taAktif = kotakKaya;

  panggung.addEventListener("focusin", function(ev){
    if(ev.target.tagName === "TEXTAREA" || ev.target.isContentEditable) taAktif = ev.target;
  });

  var btRapi = document.getElementById("tulisRapikan");
  if(btRapi) btRapi.addEventListener("click", async function(){
    // Panen dulu supaya yang dikirim adalah tulisan terkini, bukan yang
    // tersimpan sebelum suntingan terakhir.
    if(!modeSumber && !cTab.checked) kayaUtama.panen();
    if(cTab.checked) susunDariKotak();
    var isiKini = taIsi.value;
    if(!isiKini.trim()) return beritahu("Masih kosong", "Tulis dulu isinya sebelum dibereskan.");

    var n = await dialog({
      judul:"Bereskan dengan AI", jenis:"borang", ok:"Bereskan", lebar:true,
      isi:'<p class="dialog-pesan" style="margin:0 0 10px">Perintahnya bisa kamu ubah. AI tidak boleh menambah fakta atau membuang isi \u2014 hanya merapikan susunan dan formatnya.</p>' +
          '<label class="dl">Perintah untuk AI</label>' +
          '<textarea id="rpPerintah" style="min-height:120px">' +
          esc("Rapikan jadi outline belajar koas yang enak dibaca:\n" +
              "- pecah jadi bagian ber-## sesuai alur klinis (definisi, patofisiologi, diagnosis, tatalaksana)\n" +
              "- ubah paragraf panjang jadi daftar berpoin kalau isinya memang berupa poin\n" +
              "- tebalkan istilah dan angka yang sering ditanya penguji\n" +
              "- rapikan ejaan dan singkatan medis, seragamkan penulisannya") + "</textarea>",
      ambil: function(){
        var t = document.getElementById("rpPerintah").value.trim();
        if(!t) return {galat:"Perintahnya belum diisi."};
        return {nilai:{perintah:t}};
      }
    });
    if(!n) return;

    var labelAsli = btRapi.textContent;
    btRapi.disabled = true; btRapi.textContent = "\u2026";
    var r = await mintaClaude("rapikan", "PERMINTAAN PENULIS:\n" + n.perintah +
                              "\n\n---\nCATATAN YANG HARUS DIRAPIKAN:\n" + isiKini, []);
    btRapi.disabled = false; btRapi.textContent = labelAsli;

    if(!r.ok) return beritahu("Gagal", r.mati ? "Sambungan ke AI belum aktif." : r.pesan);
    var baru = (r.hasil && r.hasil.isi) || "";
    if(!baru.trim()) return beritahu("Kosong", "AI tidak mengembalikan tulisan apa pun.");

    var ok = await tanya("Ganti dengan hasil rapian?",
      (r.hasil.catatan ? "Catatan AI: " + r.hasil.catatan + "\n\n" : "") +
      "Panjang semula " + isiKini.length + " karakter, hasilnya " + baru.length +
      " karakter. Periksa lagi setelah diganti \u2014 kamu masih bisa membatalkan dengan tidak menyimpan entrinya.",
      {ok:"Ganti"});
    if(!ok) return;

    taIsi.value = baru;
    kayaUtama.segarkan();
    segarkanDaftarTab();
    modeTulis();
    gambarLamSunting();
    toast("Sudah dirapikan. Periksa dulu sebelum disimpan.");
  });

  var btSumber = document.getElementById("tulisSumber");
  if(btSumber) btSumber.addEventListener("click", function(){
    modeSumber = !modeSumber;
    if(!modeSumber) kayaUtama.segarkan();       // markdown yang disunting tangan -> tampilan
    else kayaUtama.panen();                     // tampilan -> markdown sebelum diperlihatkan
    btSumber.setAttribute("aria-pressed", modeSumber ? "true" : "false");
    btSumber.textContent = modeSumber ? "Tampilan" : "Sumber";
    modeTulis();
  });

  Array.prototype.forEach.call(panggung.querySelectorAll("[data-format]"), function(b){
    b.addEventListener("mousedown", function(ev){ ev.preventDefault(); });
    b.addEventListener("click", function(){ terapkanFormat(taAktif, b.dataset.format); });
  });

  var btLuas = document.getElementById("tulisLuas");
  if(btLuas) btLuas.addEventListener("click", function(){
    var luas = document.getElementById("tulisKotak").classList.toggle("tulis-luas");
    document.body.classList.toggle("kunci-gulir", luas);
    btLuas.setAttribute("aria-pressed", luas ? "true" : "false");
    btLuas.textContent = luas ? "Tutup" : "Fokus";
    if(luas && taAktif) taAktif.focus();
  });
  document.addEventListener("keydown", function(ev){
    if(ev.key !== "Escape") return;
    var kt = document.getElementById("tulisKotak");
    if(kt && kt.classList.contains("tulis-luas") && btLuas) btLuas.click();
  });

  /* Menulis tab dalam satu kotak panjang berpenanda ## ternyata bikin
     bingung bahkan bagi yang membuat aplikasinya. Di mode tab, tiap bagian
     dapat kotaknya sendiri; fIsi disusun ulang dari kotak-kotak itu supaya
     bentuk datanya tidak berubah sama sekali. */
  function susunDariKotak(){
    var bagian = [];
    Array.prototype.forEach.call(kotakTab.querySelectorAll("[data-bag]"), function(blok){
      var judul = blok.querySelector(".bag-judul").value.trim();
      var isi = blok.querySelector(".bag-isi").value;
      if(!judul && !isi.trim()) return;
      bagian.push("## " + (judul || "Tanpa judul") + "\n" + isi.replace(/\s+$/, ""));
    });
    var peng = kotakTab.querySelector("#bagPengantar");
    var awal = peng ? peng.value.replace(/\s+$/, "") : "";
    taIsi.value = (awal ? awal + "\n\n" : "") + bagian.join("\n\n");
    segarkanDaftarTab();
    gambarLamSunting();
  }

  function gambarKotakTab(){
    var p = pecahBagian(taIsi.value);
    var h = '<div class="b bag-b"><label for="bagPengantar">Pengantar</label>';
    h += '<textarea id="bagPengantar" class="bag-pengantar" placeholder="Kalimat pembuka yang tampil di semua tab. Boleh dikosongkan.">' +
         esc(p.pengantar) + "</textarea></div>";
    p.bagian.forEach(function(bg, i){
      h += '<div class="bag-kartu" data-bag="' + i + '">';
      h += '<div class="bag-kepala"><span class="bag-nomor">Tab ' + (i + 1) + "</span>";
      h += '<input class="bag-judul" type="text" value="' + esc(bg.judul) +
           '" placeholder="Nama tab" aria-label="Nama tab ' + (i + 1) + '">';
      h += '<button class="t kcl" type="button" data-bag-naik="' + i + '"' + (i === 0 ? " disabled" : "") +
           ' aria-label="Naikkan tab ' + (i + 1) + '">\u2191</button>';
      h += '<button class="t kcl" type="button" data-bag-turun="' + i + '"' +
           (i === p.bagian.length - 1 ? " disabled" : "") + ' aria-label="Turunkan tab ' + (i + 1) + '">\u2193</button>';
      h += '<button class="t kcl" type="button" data-bag-buang="' + i + '" aria-label="Hapus tab ' + (i + 1) + '">Hapus</button>';
      h += "</div>";
      h += '<textarea class="bag-isi" aria-label="Sumber tab ' + (i + 1) + '" hidden>' +
           esc(bg.isi) + "</textarea>";
      h += '<div class="kaya bag-kaya" contenteditable="true" role="textbox" aria-multiline="true" ' +
           'aria-label="Isi tab ' + (i + 1) + '"></div></div>';
    });
    h += '<button class="t" type="button" id="bagTambah">+ Tab baru</button>';
    kotakTab.innerHTML = h;

    Array.prototype.forEach.call(kotakTab.querySelectorAll(".bag-kartu"), function(kartu){
      pasangKaya(kartu.querySelector(".bag-isi"), kartu.querySelector(".bag-kaya"));
    });
    Array.prototype.forEach.call(kotakTab.querySelectorAll("textarea, .bag-judul"), function(el){
      el.addEventListener("input", susunDariKotak);
    });
    function tukar(a, b){
      var bag = pecahBagian(taIsi.value);
      if(b < 0 || b >= bag.bagian.length) return;
      var t = bag.bagian[a]; bag.bagian[a] = bag.bagian[b]; bag.bagian[b] = t;
      taIsi.value = (bag.pengantar ? bag.pengantar + "\n\n" : "") +
        bag.bagian.map(function(x){ return "## " + x.judul + "\n" + x.isi; }).join("\n\n");
      gambarKotakTab(); segarkanDaftarTab(); gambarLamSunting();
    }
    Array.prototype.forEach.call(kotakTab.querySelectorAll("[data-bag-naik]"), function(b){
      b.addEventListener("click", function(){ tukar(Number(b.dataset.bagNaik), Number(b.dataset.bagNaik) - 1); });
    });
    Array.prototype.forEach.call(kotakTab.querySelectorAll("[data-bag-turun]"), function(b){
      b.addEventListener("click", function(){ tukar(Number(b.dataset.bagTurun), Number(b.dataset.bagTurun) + 1); });
    });
    Array.prototype.forEach.call(kotakTab.querySelectorAll("[data-bag-buang]"), function(b){
      b.addEventListener("click", async function(){
        var bag = pecahBagian(taIsi.value);
        var i = Number(b.dataset.bagBuang);
        if((bag.bagian[i].isi || "").trim() &&
           !await tanya("Hapus tab ini?", "\u201C" + bag.bagian[i].judul + "\u201D beserta isinya akan dibuang.",
                        {ok:"Hapus", bahaya:true})) return;
        bag.bagian.splice(i, 1);
        taIsi.value = (bag.pengantar ? bag.pengantar + "\n\n" : "") +
          bag.bagian.map(function(x){ return "## " + x.judul + "\n" + x.isi; }).join("\n\n");
        gambarKotakTab(); segarkanDaftarTab(); gambarLamSunting();
      });
    });
    var bt = document.getElementById("bagTambah");
    if(bt) bt.addEventListener("click", function(){
      taIsi.value = taIsi.value.replace(/\s+$/, "") + "\n\n## Tab baru\n";
      gambarKotakTab(); segarkanDaftarTab(); gambarLamSunting();
      var semua = kotakTab.querySelectorAll(".bag-judul");
      var akhir = semua[semua.length - 1];
      if(akhir){ akhir.focus(); akhir.select(); }
    });
  }

  function modeTulis(){
    var pakai = cTab.checked;
    kotakTab.hidden = !pakai;
    taIsi.hidden = pakai || !modeSumber;
    kotakKaya.hidden = pakai || modeSumber;
    if(pakai){
      gambarKotakTab();
      taAktif = kotakTab.querySelector("[contenteditable], textarea") || taIsi;
    } else {
      taAktif = modeSumber ? taIsi : kotakKaya;
    }
  }

  function segarkanDaftarTab(){
    var el = document.getElementById("fTabDaftar");
    if(!el) return;
    var bag = pecahBagian(taIsi.value).bagian;
    if(!cTab.checked){ el.textContent = "Centang dulu untuk memakai tab."; return; }
    el.textContent = bag.length
      ? bag.length + " tab: " + bag.map(function(b){ return b.judul; }).join(" \u00B7 ")
      : "Belum ada tab. Tambahkan minimal dua.";
  }
  segarkanDaftarTab();
  taIsi.addEventListener("input", function(){ segarkanDaftarTab(); gambarLamSunting(); });
  cTab.addEventListener("change", function(){ segarkanDaftarTab(); modeTulis(); gambarLamSunting(); });
  modeTulis();

  var btTabBaru = document.getElementById("fTabBaru");
  if(btTabBaru) btTabBaru.addEventListener("click", async function(){
    if(cTab.checked){
      // Di mode kotak, tombol ini cukup meneruskan ke penambah bagian.
      var bt = document.getElementById("bagTambah");
      if(bt){ bt.click(); return; }
    }
    var judul = await mintaTeks("Tab baru", "Nama tab",
      {placeholder:"mis. Pemeriksaan nistagmus", ok:"Sisipkan"});
    if(judul === null) return;
    judul = judul.trim();
    if(!judul) return;
    if(!cTab.checked) cTab.checked = true;
    var isiLama = taIsi.value.replace(/\s+$/, "");
    taIsi.value = (isiLama ? isiLama + "\n\n" : "") + "## " + judul + "\n";
    taIsi.focus();
    taIsi.setSelectionRange(taIsi.value.length, taIsi.value.length);
    taIsi.scrollTop = taIsi.scrollHeight;
    segarkanDaftarTab();
    modeTulis();
  });

  var inpBerkasE = document.getElementById("fBerkas");
  if(inpBerkasE) inpBerkasE.addEventListener("change", async function(){
    var kabar = document.getElementById("fBerkasKabar");
    var daftar = Array.prototype.slice.call(inpBerkasE.files || []);
    inpBerkasE.value = "";
    for(var bi = 0; bi < daftar.length; bi++){
      kabar.textContent = "Membaca " + daftar[bi].name + "\u2026";
      kabar.style.color = "var(--redup)";
      try{
        var hasilB = await bacaBerkasMateri(daftar[bi]);
        if(!hasilB.teks){
          throw new Error(hasilB.jenis + " tidak bisa diurai di sini. " +
            (pemilik() ? "Pakai menu Alat supaya Claude yang membacanya."
                       : "Salin teksnya manual, atau minta pemilik memprosesnya."));
        }
        var ta = document.getElementById("fIsi");
        ta.value += (ta.value.trim() ? "\n\n" : "") + "## " + hasilB.nama + "\n\n" + hasilB.teks;
        var judulE = document.getElementById("fJudul");
        if(judulE && !judulE.value.trim()) judulE.value = hasilB.nama.replace(/\.[^.]+$/, "");
        kabar.textContent = hasilB.nama + " masuk ke kotak Isi (" + hasilB.jenis + ").";
        kabar.style.color = "var(--baik)";
      }catch(err){
        kabar.textContent = err.message;
        kabar.style.color = "var(--buruk)";
      }
    }
  });

  document.getElementById("batal").addEventListener("click", keluarEditor);
  document.getElementById("batal2").addEventListener("click", keluarEditor);

  document.getElementById("simpanE").addEventListener("click", async function(){
    var judul = document.getElementById("fJudul").value.trim();
    if(!judul){ toast("Judul belum diisi."); return; }
    var tipe = fTipe.value;
    var soal = tipe === "kuis" ? uraiSoal(fSoal.value) : [];
    if(tipe === "kuis" && !soal.length){ toast("Tipe kuis butuh minimal satu soal yang terbaca."); return; }

    var obj = {
      id: e.id || idBaru("e"),
      stase: document.getElementById("fStase").value,
      tipe: tipe,
      akses: document.getElementById("fAkses").value === "publik" ? "publik" : "terbatas",
      judul: judul,
      tanggal: document.getElementById("fTgl").value || hariIni(),
      tag: document.getElementById("fTag").value.split(",").map(function(t){ return t.trim(); }).filter(Boolean),
      sumber: document.getElementById("fSumber").value.trim(),
      tab: document.getElementById("fTab").checked,
      lampiran: lamKerja.map(function(l){
        var salin = {id:l.id, jenis:l.jenis, judul:l.judul, url:l.url || "",
                     mime:l.mime || "", ukuran:l.ukuran || 0, bagian:l.bagian || ""};
        // Di mode luring isinya ikut entri; di mode server isinya sudah
        // diunggah tersendiri, jadi metadatanya saja yang disimpan.
        if(l.jenis === "berkas" && !SERVER.ada && l.data) salin.data = l.data;
        return salin;
      }),
      isi: document.getElementById("fIsi").value,
      soal: soal,
      status: pemilik() ? "terbit" : "menunggu",
      penulis: e.penulis || penulisSaya(),
      catatanTinjau: ""
    };

    if(SERVER.ada){
      // Berkas baru diunggah lebih dulu; kalau ada yang gagal, entrinya
      // tidak jadi disimpan supaya tidak menunjuk lampiran yang tidak ada.
      for(var li = 0; li < lamKerja.length; li++){
        var lb = lamKerja[li];
        if(lb.jenis !== "berkas" || !lb.baru) continue;
        var ju = await srv("lampiranSimpan", {
          id:lb.id, entriId:obj.id, nama:lb.judul, mime:lb.mime, data:lb.data
        });
        if(ju.galat){ toast(ju.galat); return; }
        lb.baru = false;
        delete lb.data;
      }
      var js = await srv("entriSimpan", {entri:[obj]});
      if(js.galat){ toast(js.galat); return; }
      pasangArsipServer(js.arsip);
      sunting = null;
      ui.entriId = obj.id;
      ui.view = "detail";
      render();
      window.scrollTo(0,0);
      toast(kontributor() ? "Terkirim. Menunggu tinjauan pemilik." : "Tersimpan di server.");
      return;
    }

    if(baru) db.entri.push(obj);
    else for(var i=0;i<db.entri.length;i++){ if(db.entri[i].id === obj.id) db.entri[i] = obj; }

    simpan();
    sunting = null;
    ui.entriId = obj.id;
    ui.view = "detail";
    render();
    window.scrollTo(0,0);
    toast(kontributor() ? "Terkirim. Menunggu tinjauan pemilik." : (baru ? "Entri terbit." : "Perubahan disimpan."));
  });
}

function viewTinjauan(){
  if(!pemilik()){ ui.view = "arsip"; return render(); }
  var q = antrian();

  var h = bilahAtas();
  h += '<section class="lembar kaca">';
  h += '<h1 class="judul-besar">Tinjauan</h1>';
  h += '<p style="color:var(--redup);font-size:14px;margin:10px 0 0">Entri yang dikirim kontributor menunggu keputusanmu sebelum tampil di arsip publik.</p>';

  if(!q.length){
    h += '<div class="sepi-kotak" style="margin-top:20px"><b>Antrean kosong</b><span>Belum ada kiriman yang menunggu.</span></div>';
  } else {
    h += '<div style="margin-top:20px">';
    q.forEach(function(e){
      var st = cariStase(e.stase);
      h += '<div class="tinjau-item">';
      h += '<div class="kartu-atas" style="margin-bottom:8px">';
      h += '<span class="tag-stase" style="--h:' + st.h + '"><span class="titik"></span>' + esc(st.kode) + "</span>";
      h += '<span class="tipe-pil">' + esc(labelTipe(e.tipe)) + "</span>";
      h += "</div>";
      h += '<p class="qq" style="font-size:17px;font-family:var(--f-tampil);font-weight:800">' + esc(e.judul) + "</p>";
      h += '<p class="nn">' + esc(ringkas(e.isi || ((e.soal||[]).length + " soal"), 170)) + "</p>";
      h += '<div class="kotak-aksi" style="margin-top:10px">';
      h += '<button class="t kcl" data-lihat="' + esc(e.id) + '" type="button">Lihat</button>';
      h += '<button class="t utama kcl" data-terima="' + esc(e.id) + '" type="button">Terbitkan</button>';
      h += '<button class="t bahaya kcl" data-tolak="' + esc(e.id) + '" type="button">Kembalikan</button>';
      h += "</div></div>";
    });
    h += "</div>";
  }
  h += "</section>";

  panggung.innerHTML = h;
  pasangCari();

  Array.prototype.forEach.call(panggung.querySelectorAll("[data-lihat]"), function(b){
    b.addEventListener("click", function(){
      ui.entriId = b.dataset.lihat; ui.view = "detail"; render(); window.scrollTo(0,0);
    });
  });
  Array.prototype.forEach.call(panggung.querySelectorAll("[data-terima]"), function(b){
    b.addEventListener("click", async function(){
      var e = cariEntri(b.dataset.terima);
      if(!e) return;
      if(SERVER.ada){
        var jt = await srv("entriTinjau", {id:e.id, terima:true});
        if(jt.galat){ toast(jt.galat); return; }
        pasangArsipServer(jt.arsip); render(); toast("Diterbitkan.");
        return;
      }
      e.status = "terbit";
      e.catatanTinjau = "";
      simpan(); render();
      toast("Diterbitkan.");
    });
  });
  Array.prototype.forEach.call(panggung.querySelectorAll("[data-tolak]"), function(b){
    b.addEventListener("click", async function(){
      var e = cariEntri(b.dataset.tolak);
      if(!e) return;
      var c = await mintaTeks("Kembalikan kiriman", "Catatan untuk kontributor",
        {pesan:"Apa yang perlu diperbaiki sebelum bisa diterbitkan?", ok:"Kembalikan"});
      if(c === null) return;
      if(SERVER.ada){
        var jk = await srv("entriTinjau", {id:e.id, terima:false, catatan:c.trim()});
        if(jk.galat){ toast(jk.galat); return; }
        pasangArsipServer(jk.arsip); render(); toast("Dikembalikan dengan catatan.");
        return;
      }
      e.status = "dikembalikan";
      e.catatanTinjau = c.trim();
      simpan(); render();
      toast("Dikembalikan dengan catatan.");
    });
  });
}

var SKEMA = '[\n  {\n    "stase": "ipd",\n    "tipe": "outline",\n    "judul": "\u2026",\n    "tanggal": "YYYY-MM-DD",\n    "tag": ["\u2026"],\n    "sumber": "\u2026",\n    "isi": "markdown: ## judul, - daftar, **tebal**, tabel pipa",\n    "soal": [\n      {\n        "q": "pertanyaan",\n        "opsi": ["a","b","c","d"],\n        "jawaban": 0,\n        "penjelasan": "markdown"\n      }\n    ]\n  }\n]';

function promptOutline(){
  return "Aku koas dan punya arsip belajar berbasis web. Aku akan tempel materi di bawah.\n\n" +
    "Tolong:\n" +
    "1. Susun jadi outline belajar yang runtut \u2014 definisi, patofisiologi ringkas, pendekatan diagnosis, diagnosis banding, tatalaksana, dan hal yang sering ditanya pembimbing saat visite.\n" +
    "2. Tandai bagian yang high-yield untuk ujian.\n" +
    '3. Keluarkan hasil akhirnya sebagai JSON dengan skema di bawah, "tipe": "outline", dalam satu blok kode supaya bisa langsung aku tempel.\n\n' +
    "Kode stase yang valid: " + semuaStase().map(function(s){ return s.id; }).join(", ") + "\n\nSKEMA:\n" + SKEMA + "\n\nMATERI:\n";
}

function promptKuis(){
  return "Aku koas dan punya arsip belajar berbasis web. Aku akan tempel latihan soal di bawah.\n\n" +
    "Tolong:\n" +
    "1. Rapikan jadi soal pilihan ganda yang bersih.\n" +
    "2. Pastikan kuncinya benar. Kalau kunci di soal aslinya keliru menurutmu, perbaiki dan sebutkan alasannya di pembahasan.\n" +
    "3. Tulis pembahasan yang menjelaskan kenapa kunci itu benar DAN kenapa opsi lain salah.\n" +
    '4. Keluarkan sebagai JSON dengan skema di bawah, "tipe": "kuis", dalam satu blok kode.\n\n' +
    "Kode stase yang valid: " + semuaStase().map(function(s){ return s.id; }).join(", ") + "\n\nSKEMA:\n" + SKEMA + "\n\nLATIHAN SOAL:\n";
}

function promptKlarifikasi(){
  if(!klarifikasiSaya().length) return "";
  var t = "Ini pembahasan dari kuis di arsip koasku yang aku tandai perlu diklarifikasi. " +
    "Tolong periksa ketepatannya, koreksi kalau ada yang keliru, dan kembalikan versi perbaikannya " +
    "(cukup teks pembahasan yang sudah diperbaiki, per soal).\n\n";
  klarifikasiSaya().forEach(function(k, n){
    var e = cariEntri(k.entriId);
    if(!e || !e.soal || !e.soal[k.qi]) return;
    var s = e.soal[k.qi];
    t += "--- " + (n+1) + " ---\n";
    t += "Entri: " + e.judul + " (" + cariStase(e.stase).nama + ")\n";
    t += "Soal: " + s.q + "\n";
    s.opsi.forEach(function(o, i){ t += String.fromCharCode(65+i) + ". " + o + "\n"; });
    t += "Kunci saat ini: " + String.fromCharCode(65 + s.jawaban) + "\n";
    t += "Pembahasan saat ini: " + (s.penjelasan || "(kosong)") + "\n";
    if(k.catatan) t += "Yang mengganjal buatku: " + k.catatan + "\n";
    t += "\n";
  });
  return t;
}

/* Tanda klarifikasi itu catatan pribadi tiap orang, bukan perkakas pemilik.
   Karena menu Alat sekarang khusus pemilik, daftarnya ikut tampil di menu
   Tampilan untuk yang lain supaya tombol "Tandai untuk klarifikasi" di kuis
   tidak berujung ke mana-mana. */
function bagianKlarifikasi(){
  var h = '<section class="kotak kaca"><h2>Pembahasan yang perlu diklarifikasi</h2>';
  if(!klarifikasiSaya().length){
    h += "<p>Belum ada. Saat mengerjakan kuis, tekan <b>Tandai untuk klarifikasi</b> pada pembahasan yang menurutmu janggal \u2014 daftarnya muncul di sini.</p>";
  } else {
    h += "<p>Ini catatanmu sendiri. Salin daftarnya ke AI untuk diperiksa, atau kirim ke pemilik arsip.</p>";
    klarifikasiSaya().forEach(function(k){
      var e = cariEntri(k.entriId);
      var s = e && e.soal ? e.soal[k.qi] : null;
      h += '<div class="tinjau-item">';
      h += '<div class="sl">' + esc(e ? e.judul : "(entri terhapus)") + " \u00B7 " + esc(tgl(k.pada)) + "</div>";
      h += '<p class="qq">' + esc(s ? s.q : "(soal tidak ditemukan)") + "</p>";
      if(k.catatan) h += '<p class="nn">' + esc(k.catatan) + "</p>";
      h += '<button class="t kcl bahaya" data-buang="' + esc(k.id) + '" type="button">Buang tanda</button>';
      h += "</div>";
    });
    h += '<div class="kotak-aksi"><button class="t utama" id="cpKlar" type="button">Salin daftar</button></div>';
  }
  return h + "</section>";
}

function pasangKlarifikasi(){
  pasangKlarifikasi();
}

   11c. Membaca berkas materi (PPT, Word, PDF, gambar)
   ===================================================================== */

/* PPTX dan DOCX sebenarnya arsip ZIP berisi XML. DecompressionStream sudah
   ada di semua browser modern, jadi teksnya bisa dikeluarkan tanpa pustaka
   luar sama sekali \u2014 dan tanpa mengirim berkasnya ke mana pun. */
async function bukaZip(buf){
  var dv = new DataView(buf);
  var n = buf.byteLength;
  // Cari End Of Central Directory dari belakang.
  var eocd = -1;
  for(var i = n - 22; i >= 0 && i >= n - 66000; i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error("Berkasnya bukan arsip ZIP yang sah.");

  var jml = dv.getUint16(eocd + 10, true);
  var mulai = dv.getUint32(eocd + 16, true);
  var isi = {};
  var p = mulai;

  for(var k = 0; k < jml; k++){
    if(dv.getUint32(p, true) !== 0x02014b50) break;
    var metode = dv.getUint16(p + 10, true);
    var ukurTerkompres = dv.getUint32(p + 20, true);
    var panjangNama = dv.getUint16(p + 28, true);
    var panjangEkstra = dv.getUint16(p + 30, true);
    var panjangKomentar = dv.getUint16(p + 32, true);
    var offsetLokal = dv.getUint32(p + 42, true);
    var nama = new TextDecoder().decode(new Uint8Array(buf, p + 46, panjangNama));
    p += 46 + panjangNama + panjangEkstra + panjangKomentar;

    if(!/\.xml$/i.test(nama)) continue;

    // Header lokal punya panjang nama/ekstra sendiri, wajib dibaca ulang.
    var nl = dv.getUint16(offsetLokal + 26, true);
    var el = dv.getUint16(offsetLokal + 28, true);
    var awalData = offsetLokal + 30 + nl + el;
    var mentah = new Uint8Array(buf, awalData, ukurTerkompres);

    var keluar;
    if(metode === 0){
      keluar = mentah;
    } else if(metode === 8 && typeof DecompressionStream === "function"){
      var aliran = new Blob([mentah]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      keluar = new Uint8Array(await new Response(aliran).arrayBuffer());
    } else {
      continue;
    }
    isi[nama] = new TextDecoder().decode(keluar);
  }
  return isi;
}

function teksDariXml(xml, tag){
  var keluar = [];
  var re = new RegExp("<" + tag + "[^>]*>([\\s\\S]*?)</" + tag + ">", "g");
  var m;
  while((m = re.exec(xml))){
    var t = m[1].replace(/<[^>]+>/g, "");
    t = t.replace(/&lt;/g, "<").replace(/&gt;/g, ">")
         .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, "&");
    if(t.trim()) keluar.push(t);
  }
  return keluar;
}

async function teksDariPptx(buf){
  var isi = await bukaZip(buf);
  var slide = Object.keys(isi)
    .filter(function(n){ return /^ppt\/slides\/slide\d+\.xml$/.test(n); })
    .sort(function(a, b){
      return Number(a.replace(/\D+/g, "")) - Number(b.replace(/\D+/g, ""));
    });
  if(!slide.length) throw new Error("Tidak ada slide yang terbaca di berkas ini.");

  var bagian = [];
  slide.forEach(function(nama, i){
    var baris = teksDariXml(isi[nama], "a:t");
    if(!baris.length) return;
    // Baris pertama slide hampir selalu judulnya.
    bagian.push("## Slide " + (i + 1) + ": " + baris[0]);
    if(baris.length > 1){
      bagian.push(baris.slice(1).map(function(b){ return "- " + b; }).join("\n"));
    }
  });
  if(!bagian.length) throw new Error("Slidenya terbaca tapi tidak ada teks di dalamnya.");
  return bagian.join("\n\n");
}

async function teksDariDocx(buf){
  var isi = await bukaZip(buf);
  var xml = isi["word/document.xml"];
  if(!xml) throw new Error("Ini bukan berkas Word yang bisa dibaca.");
  var paragraf = xml.split(/<w:p[ >]/).map(function(blok){
    return teksDariXml(blok, "w:t").join("");
  }).filter(function(t){ return t.trim(); });
  if(!paragraf.length) throw new Error("Dokumennya tidak berisi teks.");
  return paragraf.join("\n\n");
}

/* Gambar dikecilkan dulu. Foto ponsel 12 MP jadi beberapa ratus KB tanpa
   kehilangan keterbacaan tulisan, dan itu bedanya antara muat dikirim atau
   ditolak karena badan permintaan kegedean. */
function kecilkanGambar(berkas, sisiMaks){
  return new Promise(function(selesai, gagal){
    var url = URL.createObjectURL(berkas);
    var img = new Image();
    img.onload = function(){
      URL.revokeObjectURL(url);
      var w = img.naturalWidth, t = img.naturalHeight;
      var skala = Math.min(1, sisiMaks / Math.max(w, t));
      var kanvas = document.createElement("canvas");
      kanvas.width = Math.round(w * skala);
      kanvas.height = Math.round(t * skala);
      kanvas.getContext("2d").drawImage(img, 0, 0, kanvas.width, kanvas.height);
      var durl = kanvas.toDataURL("image/jpeg", 0.75);
      selesai({mime:"image/jpeg", data:durl.slice(durl.indexOf(",") + 1),
               lebar:kanvas.width, tinggi:kanvas.height});
    };
    img.onerror = function(){ URL.revokeObjectURL(url); gagal(new Error("Gambarnya tidak bisa dibuka.")); };
    img.src = url;
  });
}

function base64Berkas(berkas){
  return new Promise(function(selesai, gagal){
    var fr = new FileReader();
    fr.onload = function(){
      var d = String(fr.result);
      selesai(d.slice(d.indexOf(",") + 1));
    };
    fr.onerror = function(){ gagal(new Error("Berkasnya gagal dibaca.")); };
    fr.readAsDataURL(berkas);
  });
}

/* Satu pintu untuk semua berkas. Mengembalikan {teks} kalau isinya bisa
   dijadikan tulisan di browser, atau {lampiran} kalau berkasnya harus
   dibaca Claude sendiri. */
async function bacaBerkasMateri(berkas){
  var nama = berkas.name || "berkas";
  var akhiran = (nama.split(".").pop() || "").toLowerCase();

  if(/^video\//.test(berkas.type) || ["mp4","mov","avi","mkv","webm"].indexOf(akhiran) !== -1){
    throw new Error("Video belum bisa diproses \u2014 Claude tidak bisa menontonnya. " +
      "Kalau ada slide atau catatannya, unggah itu; atau tempel tautan videonya di kolom Sumber.");
  }
  if(akhiran === "ppt" || akhiran === "doc"){
    throw new Error("Format lama (." + akhiran + ") tidak terbaca. Simpan ulang sebagai ." +
      akhiran + "x atau PDF, lalu unggah lagi.");
  }

  if(akhiran === "pptx"){
    return {nama:nama, teks: await teksDariPptx(await berkas.arrayBuffer()), jenis:"PowerPoint"};
  }
  if(akhiran === "docx"){
    return {nama:nama, teks: await teksDariDocx(await berkas.arrayBuffer()), jenis:"Word"};
  }
  if(berkas.type === "application/pdf" || akhiran === "pdf"){
    if(berkas.size > BATAS_UNGGAH){
      throw new Error("PDF-nya " + (Math.round(berkas.size / 1048576 * 10) / 10) +
        " MB, sedangkan badan permintaan Vercel dibatasi 4,5 MB \u2014 setelah dikodekan, " +
        "berkas di atas 3 MB tidak akan pernah sampai. Kirim per bab, atau pasang " +
        "sebagai tautan lampiran kalau memang tidak perlu dibaca Claude.");
    }
    return {nama:nama, jenis:"PDF",
            lampiran:{jenis:"pdf", mime:"application/pdf", data: await base64Berkas(berkas)}};
  }
  if(/^image\//.test(berkas.type)){
    var g = await kecilkanGambar(berkas, 1500);
    return {nama:nama, jenis:"Gambar",
            lampiran:{jenis:"gambar", mime:g.mime, data:g.data}};
  }
  if(akhiran === "txt" || akhiran === "md" || /^text\//.test(berkas.type)){
    return {nama:nama, jenis:"Teks", teks: await berkas.text()};
  }
  throw new Error("Jenis berkas ." + akhiran + " belum didukung. " +
    "Yang bisa: PPTX, DOCX, PDF, gambar, dan teks biasa.");
}

/* =====================================================================
   11d. Lampiran entri: tautan (YouTube, Drive, PDF) dan berkas terunggah
   ===================================================================== */

/* Batas 4,5 MB pada badan permintaan Vercel adalah dinding keras: berkas
   yang lebih besar tidak akan pernah sampai ke server, seberapa pun
   longgar batas yang kita tulis di sini. Karena itu jalur utama untuk
   video dan PDF besar adalah tautan, yang tidak punya batas sama sekali. */
var BATAS_UNGGAH = 3200000;

function idYoutube(url){
  var m = String(url).match(
    /(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : null;
}

function jenisTautan(url){
  if(idYoutube(url)) return "youtube";
  if(/\.pdf($|\?)/i.test(url)) return "pdf";
  if(/\.(png|jpe?g|gif|webp)($|\?)/i.test(url)) return "gambar";
  if(/drive\.google\.com|docs\.google\.com/.test(url)) return "drive";
  return "tautan";
}

/* Google mengizinkan penyematan hanya lewat bentuk /preview. Tautan /view
   atau /edit yang ditempel apa adanya akan tampil sebagai bingkai kosong. */
function drivePratinjau(u){
  var berkas = u.match(/drive\.google\.com\/file\/d\/([A-Za-z0-9_-]+)/);
  if(berkas) return "https://drive.google.com/file/d/" + berkas[1] + "/preview";
  var dok = u.match(/docs\.google\.com\/([a-z]+)\/d\/([A-Za-z0-9_-]+)/);
  if(dok) return "https://docs.google.com/" + dok[1] + "/d/" + dok[2] + "/preview";
  var buka = u.match(/drive\.google\.com\/open\?id=([A-Za-z0-9_-]+)/);
  if(buka) return "https://drive.google.com/file/d/" + buka[1] + "/preview";
  return null;
}

function labelTautan(j){
  return {youtube:"Video YouTube", pdf:"PDF", gambar:"Gambar", drive:"Google Drive", tautan:"Tautan"}[j] || "Tautan";
}

function urlAman(u){
  var t = String(u || "").trim();
  // Hanya http(s). Tanpa ini, javascript: dan data: di kolom tautan jadi
  // celah XSS yang dipicu pembaca lain saat mengeklik lampiran.
  if(!/^https?:\/\//i.test(t)) return null;
  return t;
}

function ukuranBerkas(b){
  b = Number(b) || 0;
  if(!b) return "";
  if(b < 1024) return " \u00B7 " + b + " B";
  if(b < 1048576) return " \u00B7 " + Math.round(b / 1024) + " KB";
  return " \u00B7 " + (Math.round(b / 1048576 * 10) / 10) + " MB";
}

function lampiranEntri(e){
  return Array.isArray(e.lampiran) ? e.lampiran : [];
}

/* Isi berkas hidup di kunci server sendiri. Cache di memori supaya membuka
   entri yang sama dua kali tidak menarik ulang berkasnya. */
var cacheLampiran = {};

async function ambilLampiran(l){
  if(l.data) return "data:" + l.mime + ";base64," + l.data;
  if(cacheLampiran[l.id]) return cacheLampiran[l.id];
  if(!SERVER.ada) return null;
  var j = await srv("lampiranAmbil", {id:l.id});
  if(j.galat || !j.data) return null;
  cacheLampiran[l.id] = "data:" + j.mime + ";base64," + j.data;
  return cacheLampiran[l.id];
}

/* Memecah isi entri di tiap sub-judul "## " jadi bagian-bagian terpisah.
   Teks sebelum sub-judul pertama jadi pengantar yang selalu tampil. */
function pecahBagian(isi){
  var baris = String(isi || "").split("\n");
  var pengantar = [];
  var bagian = [];
  var kini = null;
  baris.forEach(function(b){
    var m = /^##\s+(.+?)\s*$/.exec(b);
    if(m && !/^###/.test(b)){
      kini = {judul:m[1], baris:[]};
      bagian.push(kini);
      return;
    }
    (kini ? kini.baris : pengantar).push(b);
  });
  return {
    pengantar: pengantar.join("\n").trim(),
    bagian: bagian.map(function(x){ return {judul:x.judul, isi:x.baris.join("\n").trim()}; })
  };
}

function bagianIsi(e){
  // Tab hanya masuk akal kalau memang ada beberapa bagian.
  if(e.tab !== true) return null;
  var p = pecahBagian(e.isi);
  return p.bagian.length >= 2 ? p : null;
}

/* bagian = null  -> lampiran yang tidak ditempel ke tab mana pun
   bagian = "judul" -> hanya lampiran milik tab itu */
function bagianLampiran(e, bagian, tanpaBingkai){
  var semua = lampiranEntri(e);
  var daftar = semua.filter(function(l){
    var milik = l.bagian || "";
    return bagian ? milik === bagian : !milik;
  });
  if(!daftar.length) return "";
  var h = tanpaBingkai
    ? '<div class="lam-daftar lam-dalam">'
    : '<section class="kotak kaca"><h2>Lampiran</h2><div class="lam-daftar">';

  function bingkai(src, judul, tautanLuar){
    var t = '<div class="lam-dok"><iframe src="' + esc(src) + '" title="' + esc(judul || "Dokumen") +
            '" loading="lazy" referrerpolicy="no-referrer"></iframe></div>';
    t += '<div class="lam-kaki"><span class="lam-cap">' + esc(judul || "Dokumen") + "</span>";
    // Sebagian situs menolak disematkan dan bingkainya jadi kosong tanpa
    // pesan apa pun, jadi jalan keluarnya selalu disediakan.
    if(tautanLuar) t += '<a class="t kcl" href="' + esc(tautanLuar) +
      '" target="_blank" rel="noopener noreferrer">Buka di tab baru</a>';
    t += "</div>";
    return t;
  }

  daftar.forEach(function(l){
    if(l.jenis === "tautan"){
      var u = urlAman(l.url);
      if(!u) return;
      var j = jenisTautan(u);

      if(j === "youtube"){
        h += '<div class="lam-video"><iframe src="https://www.youtube-nocookie.com/embed/' +
             esc(idYoutube(u)) + '" title="' + esc(l.judul || "Video") +
             '" allow="accelerometer; clipboard-write; encrypted-media; picture-in-picture" ' +
             'referrerpolicy="strict-origin-when-cross-origin" allowfullscreen loading="lazy"></iframe></div>';
        if(l.judul) h += '<p class="lam-cap">' + esc(l.judul) + "</p>";
        return;
      }

      if(j === "gambar"){
        h += '<figure class="lam-gbr"><img src="' + esc(u) + '" alt="' + esc(l.judul || "Gambar lampiran") +
             '" loading="lazy" referrerpolicy="no-referrer">';
        if(l.judul) h += "<figcaption>" + esc(l.judul) + "</figcaption>";
        h += "</figure>";
        return;
      }

      if(j === "pdf"){ h += bingkai(u, l.judul || "PDF", u); return; }

      var pratinjau = drivePratinjau(u);
      if(pratinjau){ h += bingkai(pratinjau, l.judul || "Google Drive", u); return; }

      h += '<a class="lam-baris" href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' +
           '<span class="lam-tanda">' + esc(labelTautan(j)) + "</span>" +
           '<span class="lam-nama">' + esc(l.judul || u) + "</span>" +
           '<span class="lam-buka">Buka</span></a>';
      return;
    }

    // Berkas terunggah: isinya ditarik dari server saat gulir sampai ke sini,
    // supaya membuka entri tidak langsung mengunduh semua PDF sekaligus.
    var gambar = (l.mime || "").indexOf("image") === 0;
    var pdf = (l.mime || "").indexOf("pdf") !== -1;
    if(gambar || pdf){
      h += '<div class="lam-tunda" data-lam-tunda="' + esc(l.id) + '" data-lam-jenis="' +
           (gambar ? "gambar" : "pdf") + '">';
      h += '<div class="lam-tunggu"><span class="lam-tanda">' + (gambar ? "Gambar" : "PDF") + "</span>" +
           '<span class="lam-nama">' + esc(l.judul || "Berkas") + esc(ukuranBerkas(l.ukuran)) + "</span>" +
           '<span class="lam-buka">Memuat\u2026</span></div>';
      h += "</div>";
      return;
    }

    h += '<button class="lam-baris" type="button" data-lam="' + esc(l.id) + '">' +
         '<span class="lam-tanda">Berkas</span>' +
         '<span class="lam-nama">' + esc(l.judul || "Berkas") + esc(ukuranBerkas(l.ukuran)) + "</span>" +
         '<span class="lam-buka">Unduh</span></button>';
  });

  h += tanpaBingkai ? "</div>" : "</div></section>";
  return h;
}

function pasangTabIsi(){
  var pil = panggung.querySelectorAll("[data-tab]");
  if(!pil.length) return;

  function ke(i){
    ui.tab = i;
    Array.prototype.forEach.call(pil, function(b, n){
      var aktif = n === i;
      b.classList.toggle("nyala", aktif);
      b.setAttribute("aria-selected", aktif ? "true" : "false");
      b.tabIndex = aktif ? 0 : -1;
      var panel = document.getElementById("panel-" + n);
      if(panel) panel.hidden = !aktif;
    });
    pil[i].focus();
  }

  Array.prototype.forEach.call(pil, function(b, n){
    b.addEventListener("click", function(){ ke(n); });
    // Panah kiri/kanan sesuai pola tablist yang lazim, supaya bisa
    // dijelajah tanpa tetikus.
    b.addEventListener("keydown", function(ev){
      var lompat = ev.key === "ArrowRight" ? 1 : ev.key === "ArrowLeft" ? -1 : 0;
      if(!lompat) return;
      ev.preventDefault();
      ke((n + lompat + pil.length) % pil.length);
    });
  });
}

function pasangLampiran(e){
  Array.prototype.forEach.call(panggung.querySelectorAll("[data-lam]"), function(b){
    b.addEventListener("click", async function(){
      var l = lampiranEntri(e).filter(function(x){ return x.id === b.dataset.lam; })[0];
      if(!l) return;
      var cap = b.querySelector(".lam-buka");
      var asli = cap.textContent;
      cap.textContent = "Memuat\u2026";
      var durl = await ambilLampiran(l);
      cap.textContent = asli;
      if(!durl){ toast("Lampirannya tidak bisa diambil."); return; }
      var url = blobDari(durl, l.mime);
      window.open(url, "_blank", "noopener");
      setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
    });
  });

  var tunda = panggung.querySelectorAll("[data-lam-tunda]");
  if(!tunda.length) return;

  async function muatKotak(kotak){
    if(kotak.dataset.sudah) return;
    kotak.dataset.sudah = "1";
    var l = lampiranEntri(e).filter(function(x){ return x.id === kotak.dataset.lamTunda; })[0];
    if(!l) return;
    var durl = await ambilLampiran(l);
    if(!durl){
      kotak.innerHTML = '<div class="lam-baris lam-gagal"><span class="lam-tanda">Gagal</span>' +
        '<span class="lam-nama">' + esc(l.judul || "Berkas") + " tidak bisa diambil.</span></div>";
      return;
    }
    var url = blobDari(durl, l.mime);
    if(kotak.dataset.lamJenis === "gambar"){
      kotak.innerHTML = '<figure class="lam-gbr"><img alt="' + esc(l.judul || "Gambar lampiran") + '">' +
        (l.judul ? "<figcaption>" + esc(l.judul) + "</figcaption>" : "") + "</figure>";
      kotak.querySelector("img").src = url;
      return;
    }
    kotak.innerHTML = '<div class="lam-dok"><iframe title="' + esc(l.judul || "PDF") + '"></iframe></div>' +
      '<div class="lam-kaki"><span class="lam-cap">' + esc(l.judul || "PDF") + "</span>" +
      '<button class="t kcl" type="button" data-lam-penuh="1">Buka di tab baru</button></div>';
    kotak.querySelector("iframe").src = url;
    kotak.querySelector("[data-lam-penuh]").addEventListener("click", function(){
      window.open(url, "_blank", "noopener");
    });
  }

  // Sengaja dimuat langsung, bukan menunggu digulir. Pemuatan malas sempat
  // dicoba, tapi kegagalannya bergejala "lampiran tidak pernah muncul" dan
  // itu tidak sepadan dengan hemat kuota yang didapat: berkasnya toh
  // dibatasi 3 MB dan satu entri jarang punya banyak lampiran.
  // Berurutan, supaya beberapa PDF tidak berebut jalur sekaligus.
  (async function(){
    for(var i = 0; i < tunda.length; i++) await muatKotak(tunda[i]);
  })();
}

/* data: URL panjang ditolak Safari saat dibuka di tab baru, jadi isinya
   selalu diubah jadi blob dulu. */
function blobDari(durl, mime){
  var bin = atob(durl.slice(durl.indexOf(",") + 1));
  var buf = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([buf], {type:mime || "application/octet-stream"}));
}

function imporJson(teks){
  var s = String(teks || "").trim();
  if(!s) return {ok:false, pesan:"Kotaknya masih kosong."};

  var fence = s.match(/```(?:json)?\s*([\s\S]*?)```/);
  if(fence) s = fence[1].trim();

  var data;
  try{ data = JSON.parse(s); }
  catch(err){ return {ok:false, pesan:"JSON tidak terbaca: " + err.message}; }

  var arr = Array.isArray(data) ? data : (Array.isArray(data.entri) ? data.entri : [data]);
  var sah = {};
  semuaStase().forEach(function(x){ sah[x.id] = true; });

  var tambah = 0, perbarui = 0, lewat = 0;
  var dibuat = [];
  arr.forEach(function(o){
    if(!o || typeof o !== "object" || !o.judul){ lewat++; return; }
    var soal = Array.isArray(o.soal) ? o.soal.map(normalSoal).filter(Boolean) : [];
    var tipe = TIPE_ENTRI.indexOf(o.tipe) !== -1 ? o.tipe : (soal.length ? "kuis" : "materi");
    var pakaiTab = o.tab === true;
    var obj = {
      id: o.id || idBaru("e"),
      stase: sah[o.stase] ? o.stase : "ipd",
      tipe: tipe,
      akses: o.akses === "publik" ? "publik" : "terbatas",
      judul: String(o.judul),
      tanggal: o.tanggal || hariIni(),
      tag: Array.isArray(o.tag) ? o.tag.map(String) : [],
      sumber: o.sumber ? String(o.sumber) : "",
      isi: o.isi ? String(o.isi) : "",
      tab: pakaiTab,
      soal: soal,
      status: pemilik() ? "terbit" : "menunggu",
      penulis: penulisSaya(),
      catatanTinjau: ""
    };
    var idx = -1;
    for(var i=0;i<db.entri.length;i++){
      if(db.entri[i].id === obj.id || (db.entri[i].judul === obj.judul && db.entri[i].stase === obj.stase)){ idx = i; break; }
    }
    if(idx >= 0){ obj.id = db.entri[idx].id; db.entri[idx] = obj; perbarui++; }
    else { db.entri.push(obj); tambah++; }
    dibuat.push(obj);
  });

  if(!tambah && !perbarui) return {ok:false, pesan:"Tidak ada entri sah \u2014 setiap entri butuh \u201Cjudul\u201D."};
  var p = [];
  if(tambah) p.push(tambah + " ditambahkan");
  if(perbarui) p.push(perbarui + " diperbarui");
  if(lewat) p.push(lewat + " dilewati");
  return {ok:true, pesan:p.join(", ") + ".", entri:dibuat};
}

/* Menulis hasil impor ke tempat yang benar. Tanpa ini, di mode server entri
   hasil tempel-JSON cuma hidup di localStorage lalu tertimpa arsip server
   begitu halaman dimuat ulang \u2014 persis gejala "habis bikin kuis, direfresh
   hilang". */
async function simpanImpor(hasil){
  if(!SERVER.ada){ simpan(); return {ok:true}; }
  var js = await srv("entriSimpan", {entri:hasil.entri});
  if(js.galat) return {ok:false, pesan:js.galat};
  if(js.arsip) pasangArsipServer(js.arsip);
  return {ok:true};
}

    bs.disabled = true; kabar.textContent = "Menyimpan\u2026"; kabar.style.color = "var(--redup)";
    var j = await srv("profilSimpan", {
      nama:v("pfNama"), universitas:v("pfUniv"), angkatan:v("pfAngkatan"), grup:v("pfGrup"),
      nim:v("pfNim"), staseKini:v("pfStase"), rsKini:v("pfRs"), telepon:v("pfTelepon"),
      bio:document.getElementById("pfBio").value.trim()
    });

      pribadi.tema.a1 = p.a1; pribadi.tema.a2 = p.a2; pribadi.tema.a3 = p.a3;
      simpanPribadi();

  ["a1","a2","a3"].forEach(function(k){

/* =====================================================================
   12b. Tracker IPK \u2014 milik masing-masing akun
   Diadaptasi dari aplikasi Tracker IPK milik pengguna, tanpa bagian OCR
   (mesin OCR-nya 13 MB, tidak muat ditanam di halaman ini).
   ===================================================================== */

var SKALA_BAWAAN = [
  {huruf:"A",   poin:4.00, min:85},   {huruf:"A-",  poin:3.75, min:80},
  {huruf:"A/B", poin:3.50, min:77.5}, {huruf:"B+",  poin:3.25, min:75},
  {huruf:"B",   poin:3.00, min:72.5}, {huruf:"B-",  poin:2.75, min:70},
  {huruf:"B/C", poin:2.50, min:67.5}, {huruf:"C+",  poin:2.25, min:65},
  {huruf:"C",   poin:2.00, min:60},   {huruf:"C-",  poin:1.75, min:57.5},
  {huruf:"C/D", poin:1.50, min:55},   {huruf:"D+",  poin:1.25, min:50},
  {huruf:"D",   poin:1.00, min:45},   {huruf:"E",   poin:0.00, min:0}
];

var POLA_KOMP = {
  ringkas:   [["Tugas",30],["UTS",30],["UAS",40]],
  lengkap:   [["Absen",10],["Tugas",25],["UTS",30],["UAS",35]],
  praktikum: [["Praktikum",30],["Laporan",20],["UTS",20],["UAS",30]]
};

function ipkKosong(){
  return {
    skala: SKALA_BAWAAN.map(function(s){ return {huruf:s.huruf, poin:s.poin, min:s.min}; }),
    lulus: "C",
    semester: [{id:idBaru("sm"), nama:"Semester 1", mk:[]}]
  };
}

function ipkData(){
  if(!pribadi.ipk) pribadi.ipk = ipkKosong();
  if(!Array.isArray(pribadi.ipk.semester)) pribadi.ipk.semester = [];
  if(!Array.isArray(pribadi.ipk.skala) || !pribadi.ipk.skala.length) pribadi.ipk.skala = ipkKosong().skala;
  return pribadi.ipk;
}

function mkBaru(o){
  o = o || {};
  return {id:idBaru("mk"), nama:o.nama || "", sks:o.sks === undefined ? 3 : o.sks,
          nilai:o.nilai || "", sim:"", target:"A", buka:false, komp:o.komp || []};
}

function poinDari(huruf){
  if(!huruf) return null;
  var d = ipkData();
  for(var i=0;i<d.skala.length;i++){ if(d.skala[i].huruf === huruf) return Number(d.skala[i].poin); }
  return null;
}

function hurufDariSkor(skor){
  if(skor === null || !isFinite(skor)) return null;
  var urut = ipkData().skala.slice().sort(function(a,b){ return b.min - a.min; });
  for(var i=0;i<urut.length;i++){ if(skor >= urut[i].min) return urut[i].huruf; }
  return urut.length ? urut[urut.length-1].huruf : null;
}

function lulusKah(huruf){
  var a = poinDari(huruf), b = poinDari(ipkData().lulus);
  if(a === null || b === null) return true;
  return a >= b;
}

function tiapMk(fn){
  ipkData().semester.forEach(function(sm){
    (sm.mk || []).forEach(function(m){ fn(m, sm); });
  });
}

/* Rata-rata berbobot dari komponen yang sudah ada nilainya, plus batas
   tertinggi dan terendah kalau sisa komponen dapat 100 atau 0. */
function statKomp(m){
  var bTotal = 0, bIsi = 0, jum = 0, sisa = [];
  (m.komp || []).forEach(function(k){
    var b = Number(k.bobot) || 0;
    bTotal += b;
    if(k.skor === "" || k.skor === null || !isFinite(Number(k.skor))){
      if(b > 0) sisa.push(k);
    } else {
      bIsi += b;
      jum += b * Number(k.skor);
    }
  });
  var st = {
    bTotal:bTotal, bIsi:bIsi, bSisa:bTotal - bIsi, sisa:sisa,
    ada:(m.komp || []).length > 0,
    nilai: bIsi > 0 ? jum / bIsi : null,
    terkumpul: jum / 100,
    lengkap: bTotal > 0 && (bTotal - bIsi) <= 1e-9
  };
  st.huruf = st.nilai === null ? null : hurufDariSkor(st.nilai);
  st.maks = bTotal > 0 ? (jum + (bTotal - bIsi) * 100) / bTotal : null;
  st.min = bTotal > 0 ? jum / bTotal : null;
  return st;
}

function butuhNilai(st, targetSkor){
  if(st.bTotal <= 0) return null;
  if(st.bSisa <= 1e-9) return {selesai:true};
  return {selesai:false, butuh:(targetSkor * st.bTotal - st.terkumpul * 100) / st.bSisa};
}

function totalIpk(){
  var t = {sks:0, mutu:0, sksSisa:0, simSks:0, simMutu:0, belum:0, gagal:0};
  tiapMk(function(m){
    var sks = Number(m.sks) || 0;
    var p = poinDari(m.nilai);
    if(p !== null){
      t.sks += sks; t.mutu += sks * p;
      if(!lulusKah(m.nilai)) t.gagal++;
    } else {
      t.belum++; t.sksSisa += sks;
      var sp = poinDari(m.sim);
      if(sp !== null){ t.simSks += sks; t.simMutu += sks * sp; }
    }
  });
  t.ipk = t.sks > 0 ? t.mutu / t.sks : null;
  var ps = t.sks + t.simSks;
  t.proyeksi = ps > 0 ? (t.mutu + t.simMutu) / ps : null;
  return t;
}

function totalSemester(sm){
  var sks = 0, mutu = 0, rencana = 0;
  (sm.mk || []).forEach(function(m){
    var s = Number(m.sks) || 0;
    var p = poinDari(m.nilai);
    if(p !== null){ sks += s; mutu += s * p; } else rencana += s;
  });
  return {sks:sks, mutu:mutu, rencana:rencana, ip: sks > 0 ? mutu / sks : null};
}

function angka(n, d){
  var v = Number(n);
  return isFinite(v) ? v.toFixed(d === undefined ? 2 : d) : "\u2013";
}

function predikat(ipk){
  if(ipk === null) return "";
  if(ipk >= 3.91) return "Summa cum laude";
  if(ipk >= 3.76) return "Magna cum laude";
  if(ipk >= 3.51) return "Cum laude";
  if(ipk >= 3.01) return "Sangat memuaskan";
  if(ipk >= 2.76) return "Memuaskan";
  return "";
}

function opsiHuruf(terpilih, kosong){
  var h = '<option value=""' + (terpilih ? "" : " selected") + ">" + esc(kosong || "\u2013") + "</option>";
  ipkData().skala.forEach(function(s){
    h += '<option value="' + esc(s.huruf) + '"' + (s.huruf === terpilih ? " selected" : "") + ">" +
         esc(s.huruf) + " (" + angka(s.poin) + ")</option>";
  });
  return h;
}

var JENIS_AGENDA = [
  {id:"jaga",  nm:"Jaga",   w:"var(--a2)"},
  {id:"ujian", nm:"Ujian",  w:"var(--buruk)"},
  {id:"tugas", nm:"Tugas",  w:"var(--tunggu)"},
  {id:"acara", nm:"Acara",  w:"var(--baik)"}
];
function jenisAgenda(id){
  for(var i=0;i<JENIS_AGENDA.length;i++){ if(JENIS_AGENDA[i].id === id) return JENIS_AGENDA[i]; }
  return JENIS_AGENDA[3];
}

/* Agenda bersama (diumumkan pemilik) dan agenda pribadi ditampilkan dalam
   satu aliran, tapi disimpan terpisah: yang bersama ikut arsip di server,
   yang pribadi ikut ember tiap akun. */
/* Pengingat yang ditugaskan datang dari server; di mode luring tidak ada
   karena tidak ada tempat bersama untuk menaruhnya. */
var TUGASAN = [];
var DAFTAR_AKUN = null;

async function muatDaftarAkun(){
  if(DAFTAR_AKUN) return DAFTAR_AKUN;
  if(!SERVER.ada) return [];
  var j = await srv("akunRingkas", {});
  DAFTAR_AKUN = Array.isArray(j.akun) ? j.akun : [];
  return DAFTAR_AKUN;
}

function namaAkun(pengguna){
  var a = (DAFTAR_AKUN || []).filter(function(x){ return x.pengguna === pengguna; })[0];
  return a ? a.nama : pengguna;
}

function jadwalGabung(){
  var keluar = [];
  (db.agenda || []).forEach(function(a){
    keluar.push({id:a.id, judul:a.judul, tanggal:a.tanggal, jam:a.jam || "",
                 jenis:a.jenis, catatan:a.catatan || "", bersama:true,
                 selesai: agendaSelesai()[a.id] === true});
  });
  agendaSaya().forEach(function(a){
    keluar.push({id:a.id, judul:a.judul, tanggal:a.tanggal, jam:a.jam || "",
                 jenis:a.jenis, catatan:a.catatan || "", bersama:false,
                 selesai: a.selesai === true});
  });
  TUGASAN.forEach(function(t){
    keluar.push({id:t.id, judul:t.judul, tanggal:t.tanggal, jam:t.jam || "",
                 jenis:t.jenis, catatan:t.catatan || "", bersama:false,
                 tugasan:true, pembuat:t.pembuat, untuk:t.untuk || [],
                 punyaku: t.pembuat === penggunaAkun(),
                 selesai: agendaSelesai()[t.id] === true});
  });
  keluar.sort(function(x, y){
    if(x.tanggal !== y.tanggal) return x.tanggal < y.tanggal ? -1 : 1;
    return (x.jam || "99:99") < (y.jam || "99:99") ? -1 : 1;
  });
  return keluar;
}

function jadwalMendesak(){
  if(!db) return 0;
  var kini = hariIni();
  return jadwalGabung().filter(function(a){
    return !a.selesai && a.tanggal <= kini;
  }).length;
}

function selisihHari(tanggal){
  var a = new Date(hariIni() + "T00:00:00");
  var b = new Date(tanggal + "T00:00:00");
  return Math.round((b - a) / 86400000);
}

var HARI_NAMA = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
var BULAN_NAMA = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];

function pecahTanggal(tgl){
  var d = new Date(String(tgl) + "T00:00:00");
  if(isNaN(d.getTime())) return null;
  return {hari:HARI_NAMA[d.getDay()], tgl:d.getDate(),
          bulan:BULAN_NAMA[d.getMonth()], tahun:d.getFullYear()};
}

/* Tanggal ditulis lengkap dengan nama harinya. "4 hari lagi" saja tidak
   cukup: orang perlu tahu itu jatuh hari apa untuk mencocokkan dengan
   jadwal jaga, dan pembaca layar tidak bisa menghitungnya sendiri. */
function tanggalPanjang(tgl){
  var p = pecahTanggal(tgl);
  if(!p) return tgl;
  return p.hari + ", " + p.tgl + " " + p.bulan + " " + p.tahun;
}

function labelWaktu(tanggal){
  var d = selisihHari(tanggal);
  if(isNaN(d)) return tanggal;
  if(d === 0) return "Hari ini";
  if(d === 1) return "Besok";
  if(d === -1) return "Kemarin";
  if(d < 0) return Math.abs(d) + " hari lalu";
  if(d < 7) return d + " hari lagi";
  return tanggal;
}

function kelompokJadwal(a){
  var d = selisihHari(a.tanggal);
  if(a.selesai) return "selesai";
  if(isNaN(d) || d < 0) return "lewat";
  if(d === 0) return "kini";
  if(d <= 7) return "dekat";
  return "nanti";
}

function viewJadwal(){
  var h = bilahAtas();
  var semua = jadwalGabung();

  h += '<section class="lembar kaca"><h1 class="judul-besar">Jadwal koas</h1>';
  h += '<p style="color:var(--redup);font-size:14px;margin:10px 0 0;max-width:60ch">Pengingat jaga, ujian, dan tugas. Yang kamu tambahkan milik akunmu sendiri, tapi bisa kamu tugaskan ke teman yang punya akun di sini' +
       (pemilik() ? ", dan sebagai pemilik kamu juga bisa mengumumkan agenda untuk semua orang." : ". Agenda bertanda \u201Cbersama\u201D diumumkan pemilik arsip.") + "</p>";
  h += '<div class="kotak-aksi"><button class="t utama" id="agTambah" type="button">+ Pengingat</button>';
  h += '<button class="t" id="agPemicu" type="button">Salin pemicu</button>';
  h += '<button class="t" id="agTempel" type="button">Tempel dari AI</button></div>';
  h += "</section>";

  var judulKel = {lewat:"Terlewat", kini:"Hari ini", dekat:"Minggu ini", nanti:"Nanti", selesai:"Sudah selesai"};
  var urutKel = ["lewat", "kini", "dekat", "nanti", "selesai"];
  var ember = {};
  urutKel.forEach(function(k){ ember[k] = []; });
  semua.forEach(function(a){ ember[kelompokJadwal(a)].push(a); });

  if(!semua.length){
    h += '<section class="kotak kaca"><div class="sepi-kotak" style="padding:30px">' +
         "<b>Belum ada pengingat</b><span>Tambahkan jaga malam, ujian stase, atau tenggat laporan supaya tidak kelewat.</span></div></section>";
  }

  urutKel.forEach(function(k){
    var isi = ember[k];
    if(!isi.length) return;
    h += '<section class="kotak kaca"><h2>' + judulKel[k] +
         ' <span class="ag-jml">' + isi.length + "</span></h2>";
    h += '<ul class="ag-daftar">';
    isi.forEach(function(a){
      var j = jenisAgenda(a.jenis);
      h += '<li class="ag-item' + (a.selesai ? " ag-usai" : "") + '" style="--jw:' + j.w + '">';
      h += '<button class="ag-centang" type="button" data-ag-usai="' + esc(a.id) + '" role="checkbox" aria-checked="' +
           (a.selesai ? "true" : "false") + '" aria-label="Tandai selesai: ' + esc(a.judul) + ", " +
           esc(tanggalPanjang(a.tanggal)) + (a.jam ? " pukul " + esc(a.jam) : "") + '">' +
           (a.selesai ? "\u2713" : "") + "</button>";
      var pt = pecahTanggal(a.tanggal);
      var lewat = !a.selesai && selisihHari(a.tanggal) < 0;
      h += '<div class="ag-kal' + (lewat ? " ag-kal-lewat" : "") + '" aria-hidden="true">' +
           "<b>" + (pt ? pt.tgl : "?") + "</b><span>" + (pt ? esc(pt.bulan) : "") + "</span></div>";
      h += '<div class="ag-isi">';
      h += '<div class="ag-judul">' + esc(a.judul) + "</div>";
      h += '<div class="ag-tanggal">' + esc(tanggalPanjang(a.tanggal)) +
           (a.jam ? ' <span class="ag-jam">' + esc(a.jam) + "</span>" : "") +
           ' <span class="ag-relatif' + (lewat ? " ag-telat" : "") + '">' + esc(labelWaktu(a.tanggal)) + "</span></div>";
      h += '<div class="ag-meta"><span class="ag-tag">' + esc(j.nm) + "</span>";
      if(a.bersama) h += '<span class="ag-tag ag-bersama">bersama</span>';
      if(a.tugasan){
        if(a.punyaku){
          var siapa = (a.untuk || []).map(namaAkun);
          h += '<span class="ag-tag ag-tugas">' +
               (siapa.length ? "untuk " + esc(siapa.join(", ")) : "belum ditugaskan") + "</span>";
        } else {
          h += '<span class="ag-tag ag-tugas">dari ' + esc(namaAkun(a.pembuat)) + "</span>";
        }
      }
      h += "</div>";
      if(a.catatan) h += '<div class="ag-catatan">' + esc(a.catatan) + "</div>";
      h += "</div>";
      // Agenda bersama hanya boleh disunting pemilik; yang lain tetap bisa
      // mencentangnya selesai untuk dirinya sendiri.
      // Pengingat titipan orang lain tetap bisa dicentang selesai untuk
      // diri sendiri, tapi tidak boleh disunting atau dihapus.
      var bolehUbah = a.tugasan ? a.punyaku : (!a.bersama || pemilik());
      // Duplikat terbuka untuk semua, termasuk pengingat titipan orang lain:
      // salinannya selalu jadi milik pribadi si penyalin, bukan ikut
      // disebar ulang ke orang yang sama.
      h += '<div class="ag-aksi">';
      h += '<button class="t kcl" type="button" data-ag-salin="' + esc(a.id) + '">Duplikat</button>';
      if(bolehUbah){
        h += '<button class="t kcl" type="button" data-ag-ubah="' + esc(a.id) + '">Ubah</button>';
        h += '<button class="t kcl" type="button" data-ag-hapus="' + esc(a.id) + '">Hapus</button>';
      }
      h += "</div>";
      h += "</li>";
    });
    h += "</ul></section>";
  });

  panggung.innerHTML = h;
  pasangCari();
  pasangJadwal();
}

function cariAgenda(id){
  var b = (db.agenda || []).filter(function(x){ return x.id === id; })[0];
  if(b) return {a:b, bersama:true};
  var t = TUGASAN.filter(function(x){ return x.id === id; })[0];
  if(t) return {a:t, bersama:false, tugasan:true};
  var p = agendaSaya().filter(function(x){ return x.id === id; })[0];
  return p ? {a:p, bersama:false} : null;
}

  var isi =

      : (SERVER.ada ? '<p class="ag-bantu">Belum ada akun lain untuk ditugaskan.</p>' : "")) +

      ? '<label class="ag-umum"><input id="agBersama" type="checkbox"' + (a.bersama ? " checked" : "") +

function pasangJadwal(){
  var ap = document.getElementById("agPemicu");
  if(ap) ap.addEventListener("click", function(){ salin(promptJadwal(), "Pemicu jadwal disalin."); });
  var at = document.getElementById("agTempel");
  if(at) at.addEventListener("click", tempelJadwal);

  var tb = document.getElementById("agTambah");
  if(tb) tb.addEventListener("click", async function(){
    var n = await formAgenda(null);
    if(!n) return;
    await tulisAgenda(null, n);
  });

  Array.prototype.forEach.call(panggung.querySelectorAll("[data-ag-ubah]"), function(b){
    b.addEventListener("click", async function(){
      var f = cariAgenda(b.dataset.agUbah);
      if(!f) return;
      var awal = {judul:f.a.judul, tanggal:f.a.tanggal, jam:f.a.jam || "",
                  jenis:f.a.jenis, catatan:f.a.catatan || "", bersama:f.bersama,
                  untuk:f.a.untuk || []};
      var n = await formAgenda(awal);
      if(!n) return;
      await tulisAgenda(b.dataset.agUbah, n);
    });
  });

  Array.prototype.forEach.call(panggung.querySelectorAll("[data-ag-salin]"), function(b){
    b.addEventListener("click", async function(){
      var f = cariAgenda(b.dataset.agSalin);
      if(!f) return;
      var n = await formAgenda({
        judul: f.a.judul, tanggal: f.a.tanggal, jam: f.a.jam || "",
        jenis: f.a.jenis, catatan: f.a.catatan || "",
        bersama: false, untuk: []
      });
      if(!n) return;
      await tulisAgenda(null, n);
    });
  });

  Array.prototype.forEach.call(panggung.querySelectorAll("[data-ag-hapus]"), function(b){
    b.addEventListener("click", async function(){
      var f = cariAgenda(b.dataset.agHapus);
      if(!f) return;
      if(!await tanya("Hapus pengingat?", "\u201C" + f.a.judul + "\u201D akan dihapus.", {ok:"Hapus", bahaya:true})) return;
      if(f.bersama){
        db.agenda = (db.agenda || []).filter(function(x){ return x.id !== f.a.id; });
        simpan();
        await dorongAtur();
      } else if(f.tugasan){
        var jd = await srv("agendaTugasHapus", {id:f.a.id});
        if(jd.galat){ toast(jd.galat); return; }
        TUGASAN = jd.tugasan || [];
      } else {
        pribadi.agenda = agendaSaya().filter(function(x){ return x.id !== f.a.id; });
        simpanPribadi();
      }
      render();
      toast("Pengingat dihapus.");
    });
  });

  Array.prototype.forEach.call(panggung.querySelectorAll("[data-ag-usai]"), function(b){
    b.addEventListener("click", function(){
      var f = cariAgenda(b.dataset.agUsai);
      if(!f) return;
      if(f.bersama || f.tugasan){
        // Dicentang per akun, bukan untuk semua orang yang menerimanya.
        var m = agendaSelesai();
        if(m[f.a.id]) delete m[f.a.id]; else m[f.a.id] = true;
      } else {
        f.a.selesai = !f.a.selesai;
      }
      simpanPribadi();
      render();
    });
  });
}

async function tulisAgenda(id, n){
  var obj = {id: id || idBaru("ag"), judul:n.judul, tanggal:n.tanggal,
             jam:n.jam, jenis:n.jenis, catatan:n.catatan};
  var lama = id ? cariAgenda(id) : null;

  var adaTugasan = (n.untuk || []).length > 0;

  // Pindah antar jenis berarti dicabut dulu dari asalnya, supaya tidak
  // muncul dobel di dua tempat.
  if(lama){
    if(lama.bersama) db.agenda = (db.agenda || []).filter(function(x){ return x.id !== id; });
    else if(lama.tugasan){
      if(!adaTugasan || n.bersama){
        var jh = await srv("agendaTugasHapus", {id:id});
        if(jh.galat){ toast(jh.galat); return; }
        TUGASAN = jh.tugasan || [];
      }
    }
    else pribadi.agenda = agendaSaya().filter(function(x){ return x.id !== id; });
  }

  if(adaTugasan && !n.bersama){
    if(!SERVER.ada){
      toast("Menugaskan ke teman butuh sambungan ke server.");
      return;
    }
    obj.untuk = n.untuk;
    var jt = await srv("agendaTugas", {agenda:obj});
    if(jt.galat){ toast(jt.galat); return; }
    TUGASAN = jt.tugasan || [];
    render();
    toast(id ? "Pengingat diperbarui." : "Pengingat dikirim ke " + n.untuk.length + " orang.");
    return;
  }

  if(n.bersama && pemilik()){
    if(!Array.isArray(db.agenda)) db.agenda = [];
    db.agenda.push(obj);
    simpan();
    var ok = await dorongAtur();
    if(!ok) return;
  } else {
    obj.selesai = lama && !lama.bersama ? lama.a.selesai === true : false;
    agendaSaya().push(obj);
    simpanPribadi();
  }
  render();
  toast(id ? "Pengingat diperbarui." : "Pengingat ditambahkan.");
}

   11c. Catatan pribadi tiap akun

/* Penampung catatan yang stasenya sudah tidak ada lagi. */
var CT_LAIN = "\u0000lain";

function catatanTersaring(){
  var l = catatanSaya().slice();
  // Penanda ini tidak boleh ikut lewat atribut HTML biasa: parser HTML
   // mengganti U+0000 dengan U+FFFD, jadi nilainya tidak pernah cocok lagi.
  if(ui.catatanStase === CT_LAIN){
    var sah = {};
    semuaStase().forEach(function(x){ sah[x.id] = true; });
    l = l.filter(function(c){ return !sah[c.stase]; });
  }
  else if(ui.catatanStase) l = l.filter(function(c){ return c.stase === ui.catatanStase; });
  var q = (ui.catatanCari || "").trim().toLowerCase();
  if(q) l = l.filter(function(c){
    return (c.judul || "").toLowerCase().indexOf(q) !== -1 ||
           (c.isi || "").toLowerCase().indexOf(q) !== -1;
  });
  l.sort(function(a, b){ return (b.diubah || b.pada || "") < (a.diubah || a.pada || "") ? -1 : 1; });
  return l;
}

  h += "</div>";

  if(semua.length){

    var jml = {};

    });
